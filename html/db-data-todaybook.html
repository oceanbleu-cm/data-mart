<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 지식 리포트</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card-bg: #ffffff;
    --text: #1c1c1f;
    --text-dim: #6b6b74;
    --border: #e3e3e7;
    --accent: #7c5cff;
    --accent-bg: #efeaff;
    --positive: #1a7f4b;
    --negative: #c23b3b;
    --table-head-bg: #f0f0f3;
    --stripe: #fafafb;
    --paid-bg: #eaf1ff;
    --paid-head-bg: #d7e4ff;
    --paid-text: #2a5db0;
    --join-bg: #e8f8ef;
    --join-head-bg: #c9f0d8;
    --join-text: #1a7f4b;
    --cancel-bg: #fff2e2;
    --cancel-head-bg: #ffe3bd;
    --cancel-text: #a15c00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171b;
      --card-bg: #202024;
      --text: #ececef;
      --text-dim: #9a9aa4;
      --border: #35353b;
      --accent: #b3a1ff;
      --accent-bg: #2a2440;
      --positive: #5fd08c;
      --negative: #ff8080;
      --table-head-bg: #26262b;
      --stripe: #232328;
      --paid-bg: #1c2740;
      --paid-head-bg: #253656;
      --paid-text: #8fb4ff;
      --join-bg: #163024;
      --join-head-bg: #1f4a34;
      --join-text: #7fe3ab;
      --cancel-bg: #3a2c10;
      --cancel-head-bg: #4a3a15;
      --cancel-text: #f0c374;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171b;
    --card-bg: #202024;
    --text: #ececef;
    --text-dim: #9a9aa4;
    --border: #35353b;
    --accent: #b3a1ff;
    --accent-bg: #2a2440;
    --positive: #5fd08c;
    --negative: #ff8080;
    --table-head-bg: #26262b;
    --stripe: #232328;
    --paid-bg: #1c2740;
    --paid-head-bg: #253656;
    --paid-text: #8fb4ff;
    --join-bg: #163024;
    --join-head-bg: #1f4a34;
    --join-text: #7fe3ab;
    --cancel-bg: #3a2c10;
    --cancel-head-bg: #4a3a15;
    --cancel-text: #f0c374;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 64px 214px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1080px; margin: 0; }
  .site-nav {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 190px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: var(--card-bg);
    border-right: 1px solid var(--border);
    padding: 18px 10px;
    overflow-y: auto;
    z-index: 200;
  }
  .site-nav a {
    display: block;
    font-size: 0.8rem;
    color: var(--text);
    line-height: 1.4;
    padding: 9px 8px;
    border-radius: 8px;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .site-nav a:hover { background: var(--bg); }
  .site-nav a.active { background: var(--accent-bg); color: var(--accent); font-weight: 700; }
  h1 { font-size: 1.35rem; margin: 16px 0 4px; }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-bottom: 20px;
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
    font-weight: 400;
  }
  .tab-btn-summary {
    border-color: var(--accent);
    color: var(--accent);
    margin-right: 8px;
  }
  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .reload-btn {
    margin-left: auto;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-dim);
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .reload-btn:hover { color: var(--accent); border-color: var(--accent); }
  .reload-btn:disabled { opacity: 0.5; cursor: default; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .card h2 {
    font-size: 0.88rem;
    font-weight: 400;
    margin: 0 0 8px;
  }
  .card h2 .hint {
    font-weight: 400;
    color: var(--text-dim);
    font-size: 0.72rem;
    margin-left: 6px;
  }
  .stat-group-title {
    font-size: 0.7rem;
    font-weight: 400;
    color: var(--text-dim);
    margin: 10px 0 6px;
  }
  .stat-group-title:first-of-type { margin-top: 0; }
  .section-divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .ga4-range-picker {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    margin: 8px 0 12px;
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  .ga4-range-picker input[type="date"] {
    font-family: inherit;
    font-size: 0.82rem;
    padding: 5px 8px;
    margin-left: 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card-bg);
    color: var(--text);
  }
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 8px;
  }
  .summary-grid-4 { grid-template-columns: repeat(4, 1fr); }
  .summary-grid-5 { grid-template-columns: repeat(5, 1fr); }
  @media (max-width: 760px) {
    .summary-grid-4, .summary-grid-5 { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
    body { padding-left: 16px; }
    .site-nav { position: static; width: auto; flex-direction: row; overflow-x: auto; margin-bottom: 12px; border-right: none; border-bottom: 1px solid var(--border); }
  }
  .stat { padding: 7px 10px; background: var(--stripe); border-radius: 8px; }
  .stat .label { font-size: 0.68rem; color: var(--text-dim); margin-bottom: 2px; }
  .stat .value { font-size: 0.92rem; font-weight: 400; font-variant-numeric: tabular-nums; }
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.78rem; min-width: 600px; }
  th, td {
    padding: 5px 8px;
    border-bottom: 1px solid var(--border);
    text-align: right;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  th:first-child, td:first-child { text-align: left; font-variant-numeric: normal; }
  .ga4-summary-table th:first-child, .ga4-summary-table td:first-child { text-align: center; }
  th { background: var(--table-head-bg); font-weight: 400; color: var(--text-dim); font-size: 0.74rem; }
  th .pending { color: var(--negative); font-size: 0.65rem; display: block; }
  tbody tr:nth-child(even) { background: var(--stripe); }
  tfoot td { font-weight: 400; border-top: 2px solid var(--border); border-bottom: none; }
  th.col-paid { background: var(--paid-head-bg); color: var(--paid-text); }
  td.col-paid { background: var(--paid-bg); }
  th.col-join { background: var(--join-head-bg); color: var(--join-text); }
  td.col-join { background: var(--join-bg); }
  th.col-cancel { background: var(--cancel-head-bg); color: var(--cancel-text); }
  td.col-cancel { background: var(--cancel-bg); color: var(--cancel-text); }
  tfoot td.col-paid { background: var(--paid-bg); }
  tfoot td.col-join { background: var(--join-bg); }
  tfoot td.col-cancel { background: var(--cancel-bg); }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 0.7rem;
    color: var(--text-dim);
  }
  .legend .swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    margin-right: 5px;
    vertical-align: middle;
  }
  .legend .swatch.paid { background: var(--paid-head-bg); }
  .legend .swatch.join { background: var(--join-head-bg); }
  .legend .swatch.cancel { background: var(--cancel-head-bg); }
  .delta { font-size: 0.68rem; margin-left: 2px; }
  .delta.up { color: var(--negative); }
  .delta.down { color: var(--paid-text); }
  .delta.flat { color: var(--text-dim); }
  .check-row {
    margin-top: 6px;
    font-size: 0.72rem;
    color: var(--text-dim);
  }
  .check-row.ok::before { content: "✓ "; color: var(--positive); font-weight: 400; }
  .check-row.bad::before { content: "✗ "; color: var(--negative); font-weight: 400; }
  .check-row.loading::before { content: "⏳ "; }
  .error-card { border-color: var(--negative); }
  .error-card .msg { color: var(--negative); font-size: 0.85rem; margin-bottom: 12px; }
  .retry-btn {
    border: 1px solid var(--negative);
    background: transparent;
    color: var(--negative);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  footer {
    color: var(--text-dim);
    font-size: 0.72rem;
    margin-top: 24px;
    line-height: 1.7;
  }
  footer a { color: var(--text-dim); }
</style>
<body>
  <div class="wrap">
    <nav class="site-nav">
      <a href="db-data-unsedang.html">운세당 매출 리포트</a>
      <a href="ga4-channel-unsedang.html">운세당 매체별 유입</a>
      <a href="ga4-funnel-unsedang.html">운세당 GA4 퍼널</a>
      <a href="ga4-ainote-kpi-unsedang.html">운세당 AI상담노트 KPI</a>
      <a href="db-data-mindcare.html">마인드케어 리포트</a>
      <a href="db-data-today.html">투데이 리포트</a>
      <a href="db-data-todaybook.html" class="active">오늘의 지식 리포트</a>
    </nav>
    <h1>오늘의 지식 리포트</h1>

    <div id="ga4Summary"></div>

    <div class="tabs" id="tabs"></div>

    <div id="content"></div>

    <footer id="footer"></footer>
  </div>

<script>
(function () {
  const API_TEMPLATE = "https://api.todaybook.kr/api/v1/reports/todaybook-subscription-stats/monthly.json?baseMonth={month}";
  const FETCH_TIMEOUT_MS = 15000;

  // --- GA4(todaybook, account 556152838) 활성 현황 — 서비스 오픈일(2026-10-13) 고정
  // 시작점부터 D-1까지 누적되는 정적 스냅샷. html/ga4-ainote-kpi-unsedang.html과 같은
  // 철학(윈도우 롤링 아님). 매일 자동 라우틴이 새 날짜만 추가한다.
  // activeUsers/totalUsers는 비집계 지표라 요청서가 "더하면 안 된다"고 명시 —
  // 그래서 일별 표에 합계 행을 두지 않는다(마인드케어의 단순합산 타협과 다름).
  // dauPaid/ebookUsers/audiobookUsers는 GA4에 맞춤 측정기준(customUser:member_status,
  // customEvent:format)이 아직 등록되지 않아 조회 불가 — null로 둔다(등록되면 커맨드
  // 문서만 고쳐서 채운다. docs/todaybook-data.md "GA4 실측 확인" 절 참고).
  const GA4_GENERATED_AT = '2026-10-16 04:40 UTC (Supermetrics GA4/GAWA todaybook 556152838 조회, 정적 스냅샷)';
  const GA4_RANGE = { from: '2026-10-13', to: '2026-10-15' };
  const GA4_DAILY = [
    { date: '2026-10-13', dau: 40, dauPaid: null, mauToDate: 40, cardReadUsers: 6, booknoteReadUsers: 5, bookchatUsers: 6, bookUsers: 3, ebookUsers: null, audiobookUsers: null },
    { date: '2026-10-14', dau: 9, dauPaid: null, mauToDate: 44, cardReadUsers: 3, booknoteReadUsers: 1, bookchatUsers: 0, bookUsers: 0, ebookUsers: null, audiobookUsers: null },
    { date: '2026-10-15', dau: 19, dauPaid: null, mauToDate: 61, cardReadUsers: 1, booknoteReadUsers: 1, bookchatUsers: 0, bookUsers: 0, ebookUsers: null, audiobookUsers: null },
  ];

  const numFmt = new Intl.NumberFormat('ko-KR');
  const num = (n) => (n === null || n === undefined ? '–' : numFmt.format(n));
  function fmtDelta(delta) {
    if (delta === null || delta === undefined) return '';
    if (delta > 0) return `<span class="delta up">▲${numFmt.format(delta)}</span>`;
    if (delta < 0) return `<span class="delta down">▼${numFmt.format(Math.abs(delta))}</span>`;
    return `<span class="delta flat">–0</span>`;
  }

  const WEEKDAY_KO = ['일', '월', '화', '수', '목', '금', '토'];
  function fmtDateLabel(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const [, m, day] = dateStr.split('-');
    return `${parseInt(m, 10)}/${parseInt(day, 10)} (${WEEKDAY_KO[d.getDay()]})`;
  }
  function fmtMonthLabel(monthKey) {
    return `${parseInt(monthKey.split('-')[1], 10)}월`;
  }
  function fmtShortDate(dateStr) {
    return dateStr.slice(2).replace(/-/g, '.');
  }

  function sortedDays(monthlyData) {
    return [...monthlyData.dailyStats].sort((a, b) => b.date.localeCompare(a.date));
  }

  // 이 API는 데이터 없는 월도 HTTP 200 + dailyStats 전부 null로 응답한다(마인드케어/투데이
  // API의 resCd:'8888' 분기와 다름) — "행이 있다"가 아니라 "실제 값이 있다"로 판정해야 한다.
  function dayHasData(d) {
    return d.paidCumulative !== null || d.paidJoin !== null || d.paidCancel !== null;
  }
  function hasAnyData(data) {
    return (data.carrierStats || []).some((c) => c.monthly && (c.monthly.dailyStats || []).some(dayHasData));
  }

  // --- GA4 요약/일별 표 ---
  const GA4_METRICS = [
    { key: 'dau', label: 'DAU' },
    { key: 'dauPaid', label: 'DAU(유료)', pending: true },
    { key: 'mauToDate', label: '월 누적 MAU' },
    { key: 'cardReadUsers', label: '지식카드 읽음' },
    { key: 'booknoteReadUsers', label: '북노트 읽음' },
    { key: 'bookchatUsers', label: '북챗 이용' },
    { key: 'bookUsers', label: '도서 이용' },
    { key: 'ebookUsers', label: '전자책 이용', pending: true },
    { key: 'audiobookUsers', label: '오디오북 이용', pending: true },
  ];

  // DB 섹션이 로드되면 같은 날짜의 paidCumulative로 유료 활성률을 계산해 채운다
  // (GA4는 정적 스냅샷, DB는 실시간 fetch라 소스 갱신 시점이 다름 — DB 로드 완료 후 채움).
  let paidCumulativeByDate = {};

  function paidActiveRateHtml(dateStr, row) {
    const paidTotal = paidCumulativeByDate[dateStr];
    if (row.dauPaid === null || row.dauPaid === undefined || !paidTotal) return '–';
    return `${((row.dauPaid / paidTotal) * 100).toFixed(2)}%`;
  }

  function renderGa4Daily(fromDate, toDate) {
    const body = document.getElementById('ga4DailyBody');
    if (!body) return;
    const [start, end] = fromDate <= toDate ? [fromDate, toDate] : [toDate, fromDate];
    const headCells = GA4_METRICS.map((m) => `<th>${m.label}${m.pending ? '<span class="pending">측정기준 등록 대기</span>' : ''}</th>`).join('');
    const filtered = GA4_DAILY.filter((d) => d.date >= start && d.date <= end);
    const sorted = [...filtered].sort((a, b) => b.date.localeCompare(a.date));
    const rows = sorted
      .map((d) => `<tr><td>${fmtDateLabel(d.date)}</td>${GA4_METRICS.map((m) => `<td>${num(d[m.key])}</td>`).join('')}<td>${paidActiveRateHtml(d.date, d)}</td></tr>`)
      .join('');

    body.innerHTML = `
      <div class="table-scroll">
        <table class="ga4-summary-table">
          <thead><tr><th>날짜</th>${headCells}<th>유료 활성률</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  function renderGa4Summary() {
    const el = document.getElementById('ga4Summary');
    if (!el) return;
    if (GA4_DAILY.length === 0) {
      el.innerHTML = '<div class="card"><div class="check-row loading">GA4 데이터가 아직 없습니다.</div></div>';
      return;
    }
    const latest = [...GA4_DAILY].sort((a, b) => b.date.localeCompare(a.date))[0];

    el.innerHTML = `
      <div class="card">
        <h2>GA4 활성 현황 <span class="hint">서비스 오픈일(${fmtShortDate(GA4_RANGE.from)})부터 누적 · ${fmtShortDate(GA4_RANGE.from)}~${fmtShortDate(GA4_RANGE.to)}</span></h2>
        <div class="stat-group-title">최신일(${fmtDateLabel(latest.date)}) 요약</div>
        <div class="summary-grid summary-grid-4">
          <div class="stat"><div class="label">DAU</div><div class="value">${num(latest.dau)}</div></div>
          <div class="stat"><div class="label">DAU(유료)</div><div class="value">${num(latest.dauPaid)}</div></div>
          <div class="stat"><div class="label">월 누적 MAU</div><div class="value">${num(latest.mauToDate)}</div></div>
          <div class="stat"><div class="label">유료 활성률</div><div class="value" id="ga4LatestPaidRate">${paidActiveRateHtml(latest.date, latest)}</div></div>
        </div>
        <hr class="section-divider">
        <div class="ga4-range-picker">
          <label>시작일<input type="date" id="ga4FromInput" value="${GA4_RANGE.from}" min="${GA4_RANGE.from}" max="${GA4_RANGE.to}"></label>
          <label>종료일<input type="date" id="ga4ToInput" value="${GA4_RANGE.to}" min="${GA4_RANGE.from}" max="${GA4_RANGE.to}"></label>
        </div>
        <div id="ga4DailyBody"></div>
        <div class="check-row">* 사용자 수(DAU·MAU·읽음/이용 지표)는 비집계 지표라 더하면 실제보다 크게 나옵니다 — 요청서 지침에 따라 합계 행을 두지 않습니다. 일자별 값만 참고하세요.</div>
        <div class="check-row">* "측정기준 등록 대기" 표시 열은 GA4에 맞춤 측정기준(customUser:member_status · customEvent:format)이 아직 등록되지 않아 조회할 수 없습니다 — 등록되면 채워집니다.</div>
        <div class="check-row">* 공통 필터 hostName == web.todaybook.kr 기준(dev·api·localhost 등 테스트 트래픽 제외).</div>
        <div class="check-row">출처 — GA4 todaybook 계정(Supermetrics, account_id 556152838), 정적 스냅샷 · 마지막 갱신: ${GA4_GENERATED_AT}</div>
      </div>`;

    const fromInput = document.getElementById('ga4FromInput');
    const toInput = document.getElementById('ga4ToInput');
    const update = () => renderGa4Daily(fromInput.value, toInput.value);
    fromInput.onchange = update;
    toInput.onchange = update;
    update();
  }

  // --- DB(가입/해지) 실시간 fetch + 캐시 ---
  const monthCache = new Map(); // monthKey -> { data, fetchedAt }
  let lastFetchedAt = null;

  async function fetchMonth(monthKey, { force = false } = {}) {
    if (!force && monthCache.has(monthKey)) return monthCache.get(monthKey).data;

    const url = API_TEMPLATE.replace('{month}', monthKey);
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
    try {
      const res = await fetch(url, { mode: 'cors', signal: controller.signal });
      if (!res.ok) {
        let body = null;
        try { body = await res.json(); } catch (_) {}
        if (body && body.resCd === '8888') {
          const err = new Error(body.resMsg || '집계된 데이터가 없는 월입니다.');
          err.noData = true;
          throw err;
        }
        throw new Error(`HTTP ${res.status}`);
      }
      const data = await res.json();
      const fetchedAt = new Date();
      monthCache.set(monthKey, { data, fetchedAt });
      lastFetchedAt = fetchedAt;
      updateFooter();
      return data;
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('요청 시간 초과');
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }

  function getMonthOrder() {
    const YEAR = 2026;
    const now = new Date();
    let lastMonth = 12;
    if (now.getFullYear() === YEAR) lastMonth = now.getMonth() + 1;
    else if (now.getFullYear() < YEAR) lastMonth = 1;
    const months = [];
    for (let m = 10; m <= lastMonth; m++) months.push(`${YEAR}-${String(m).padStart(2, '0')}`); // 서비스 오픈이 2026-10이라 10월부터
    return months.length ? months : [`${YEAR}-10`];
  }

  function getClosedMonthOrder() {
    return getMonthOrder().slice(0, -1);
  }

  function renderLoadingCard(msg) {
    document.getElementById('content').innerHTML = `<div class="card"><div class="check-row loading">${msg}</div></div>`;
  }

  function renderErrorCard(msg, onRetry) {
    const content = document.getElementById('content');
    content.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'card error-card';
    card.innerHTML = `<h2>데이터를 불러오지 못했습니다</h2><div class="msg">${msg}</div>`;
    const retryBtn = document.createElement('button');
    retryBtn.className = 'retry-btn';
    retryBtn.textContent = '다시 시도';
    retryBtn.onclick = onRetry;
    card.appendChild(retryBtn);
    content.appendChild(card);
  }

  function summaryCardHtml(titleHtml, latestPaid, joinSum, cancelSum) {
    return `
      <h2>${titleHtml}</h2>
      <div class="stat-group-title">요약 (누적가입자는 최신값 기준)</div>
      <div class="summary-grid summary-grid-4">
        <div class="stat"><div class="label">유료 누적가입자</div><div class="value">${num(latestPaid)}</div></div>
        <div class="stat"><div class="label">신규 가입(월 합계)</div><div class="value">${num(joinSum)}</div></div>
        <div class="stat"><div class="label">해지(월 합계)</div><div class="value">${num(cancelSum)}</div></div>
        <div class="stat"><div class="label">해지율(월)</div><div class="value">${latestPaid ? ((cancelSum / latestPaid) * 100).toFixed(2) + '%' : '–'}</div></div>
      </div>`;
  }

  // rows: [{ label, date, paid, join, cancel }]
  function combinedTableHtml({ headLabel, rows, joinSum, cancelSum, hintHtml, checkHtmls }) {
    const bodyRows = rows
      .map((r, i) => {
        const prev = rows[i + 1];
        const paidDelta = prev && r.paid !== null && prev.paid !== null ? r.paid - prev.paid : null;
        const churnRate = r.paid !== null && prev && prev.paid ? ((r.cancel / prev.paid) * 100).toFixed(2) + '%' : '–';
        return `<tr>
        <td>${r.label}</td>
        <td class="col-paid">${num(r.paid)} ${fmtDelta(paidDelta)}</td>
        <td class="col-join">${num(r.join)}</td>
        <td class="col-cancel">${num(r.cancel)}</td>
        <td>${churnRate}</td>
      </tr>`;
      })
      .join('');
    return `
      <h2>가입자 현황 <span class="hint">${hintHtml}</span></h2>
      <div class="legend">
        <span><span class="swatch paid"></span>유료 누적</span>
        <span><span class="swatch join"></span>신규 가입</span>
        <span><span class="swatch cancel"></span>해지</span>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>${headLabel}</th>
              <th class="col-paid">유료 누적가입자</th>
              <th class="col-join">신규 가입</th>
              <th class="col-cancel">해지</th>
              <th>해지율</th>
            </tr>
          </thead>
          <tbody>${bodyRows}</tbody>
          <tfoot>
            <tr>
              <td>합계</td>
              <td class="col-paid">–</td>
              <td class="col-join">${num(joinSum)}</td>
              <td class="col-cancel">${num(cancelSum)}</td>
              <td>–</td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="check-row">* 유료 누적가입자는 스냅샷 값이라 합산하지 않습니다(합계 열 "–") — 최신값은 위 요약 카드를 참고하세요. 서비스 오픈(2026-10-13) 이전 날짜는 집계 대상이 없어 "–"로 표시됩니다.</div>
      ${(checkHtmls || []).join('')}
      <div class="check-row">출처 — 유료 누적·가입·해지: todaybook-subscription-stats API</div>
      <div class="check-row">* 요청서(docs/todaybook-data.md)의 지식카드 알림 신청자·쿠폰 신청건수는 이 API에 포함돼 있지 않아 리포트에서 생략했습니다.</div>`;
  }

  // --- 월간 뷰 ---
  async function renderMonth(monthKey, opts = {}) {
    setReloadEnabled(false);
    renderLoadingCard(`${monthKey} 데이터 불러오는 중...`);
    let data;
    try {
      data = await fetchMonth(monthKey, opts);
    } catch (e) {
      renderErrorCard(`${monthKey} 조회 실패 (${e.message})`, () => renderMonth(monthKey, { force: true }));
      setReloadEnabled(true);
      return;
    }
    setReloadEnabled(true);

    const c = data.carrierStats[0];
    const days = sortedDays(c.monthly);
    const content = document.getElementById('content');
    content.innerHTML = '';

    paidCumulativeByDate = {};
    days.forEach((d) => { if (d.paidCumulative !== null) paidCumulativeByDate[d.date] = d.paidCumulative; });

    const latestDay = days.find((d) => d.paidCumulative !== null);
    const latestPaid = latestDay ? latestDay.paidCumulative : null;
    const joinSum = days.reduce((s, d) => s + (d.paidJoin || 0), 0);
    const cancelSum = days.reduce((s, d) => s + (d.paidCancel || 0), 0);
    const joinMatches = joinSum === c.monthly.paidJoin;
    const cancelMatches = cancelSum === c.monthly.paidCancel;

    const allRows = days.map((d) => ({
      label: fmtDateLabel(d.date),
      date: d.date,
      paid: d.paidCumulative,
      join: d.paidJoin || 0,
      cancel: d.paidCancel || 0,
      hasData: dayHasData(d),
    }));
    const visibleRows = allRows.filter((r) => r.hasData);
    const hiddenCount = allRows.length - visibleRows.length;

    // 요청서 검증 규칙: paidCumulative 전일 대비 증감 == paidJoin - paidCancel
    // (allRows 기준으로 계산 — 전일이 null인 날(오픈 첫날)은 검증 대상에서 자동 제외됨)
    let diffChecked = 0;
    let diffOk = 0;
    for (let i = 0; i < allRows.length - 1; i++) {
      const cur = allRows[i];
      const prev = allRows[i + 1];
      if (cur.paid === null || prev.paid === null) continue;
      diffChecked++;
      if (cur.paid - prev.paid === cur.join - cur.cancel) diffOk++;
    }
    const diffAllOk = diffChecked === 0 || diffOk === diffChecked;

    const checkHtmls = [
      `<div class="check-row ${joinMatches && cancelMatches ? 'ok' : 'bad'}">
        ${joinMatches && cancelMatches ? '일별 가입·해지 합계가 월 API 합계와 일치합니다.' : `일별 합계가 월 API 합계와 다릅니다 — 가입 ${joinSum}/${c.monthly.paidJoin}, 해지 ${cancelSum}/${c.monthly.paidCancel}. 확인 필요.`}
      </div>`,
      diffChecked > 0
        ? `<div class="check-row ${diffAllOk ? 'ok' : 'bad'}">
            ${diffAllOk ? `전일 대비 증감이 가입-해지와 일치합니다 (${diffChecked}일 검증).` : `전일 대비 증감이 가입-해지와 다른 날이 있습니다 (${diffOk}/${diffChecked}일 일치) — 확인 필요.`}
          </div>`
        : '',
      hiddenCount > 0
        ? `<div class="check-row">오픈 전 ${hiddenCount}일은 집계 데이터가 없어 표에서 생략했습니다.</div>`
        : '',
    ];

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      summaryCardHtml(
        `오늘의 지식(SKT) ${data.baseMonth} 월 요약 <span class="hint">${data.dateRange.from} ~ ${data.dateRange.to}</span>`,
        latestPaid,
        c.monthly.paidJoin,
        c.monthly.paidCancel
      ) +
      '<hr class="section-divider">' +
      combinedTableHtml({
        headLabel: '일자',
        rows: visibleRows,
        joinSum: c.monthly.paidJoin,
        cancelSum: c.monthly.paidCancel,
        hintHtml: '해당 월 일별 상세 내역 — hostName=web.todaybook.kr(SKT) 기준, KT·LGU+ 도메인 생기면 추가',
        checkHtmls,
      });
    content.appendChild(card);

    // GA4 카드가 이미 렌더된 상태라면 유료 활성률을 갱신(DB 값이 방금 채워졌으므로)
    renderGa4Summary();
  }

  // --- 연간 요약 뷰 (마감된 전월까지만 집계) ---
  async function renderYear(year, opts = {}) {
    setReloadEnabled(false);
    const monthKeys = getClosedMonthOrder().filter((k) => k.startsWith(year + '-'));
    if (monthKeys.length === 0) {
      document.getElementById('content').innerHTML =
        '<div class="card"><div class="check-row">마감된 월이 아직 없습니다 (당월 데이터는 요약에서 제외).</div></div>';
      setReloadEnabled(true);
      return;
    }
    const monthsData = [];
    for (let i = 0; i < monthKeys.length; i++) {
      renderLoadingCard(`${year}년 데이터 불러오는 중 (${i}/${monthKeys.length})...`);
      try {
        const data = await fetchMonth(monthKeys[i], opts);
        monthsData.push(data);
      } catch (e) {
        renderErrorCard(`${monthKeys[i]} 조회 실패 (${e.message})`, () => renderYear(year, { force: true }));
        setReloadEnabled(true);
        return;
      }
    }
    setReloadEnabled(true);

    const content = document.getElementById('content');
    content.innerHTML = '';

    const carriers = monthsData.map((d) => d.carrierStats[0]);
    const lastDays = sortedDays(carriers[carriers.length - 1].monthly);
    const lastLatestDay = lastDays.find((d) => d.paidCumulative !== null);
    const latestPaid = lastLatestDay ? lastLatestDay.paidCumulative : null;
    const joinSum = carriers.reduce((s, c) => s + c.monthly.paidJoin, 0);
    const cancelSum = carriers.reduce((s, c) => s + c.monthly.paidCancel, 0);

    const first = monthsData[0];
    const last = monthsData[monthsData.length - 1];

    const rows = [];
    for (let i = monthsData.length - 1; i >= 0; i--) {
      const c = carriers[i];
      const days = sortedDays(c.monthly);
      const d = days.find((dd) => dd.paidCumulative !== null);
      rows.push({
        label: fmtMonthLabel(monthKeys[i]),
        paid: d ? d.paidCumulative : null,
        join: c.monthly.paidJoin,
        cancel: c.monthly.paidCancel,
      });
    }
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      summaryCardHtml(
        `오늘의 지식(SKT) ${year}년 요약 <span class="hint">${first.dateRange.from} ~ ${last.dateRange.to} · 마감월 기준</span>`,
        latestPaid,
        joinSum,
        cancelSum
      ) +
      '<hr class="section-divider">' +
      combinedTableHtml({
        headLabel: '월',
        rows,
        joinSum,
        cancelSum,
        hintHtml: `${year}년 월별 상세 내역 (누적가입자는 월말 기준)`,
        checkHtmls: [],
      });
    content.appendChild(card);
  }

  // --- 탭/새로고침 UI ---
  let currentView = null; // { type: 'year'|'month', key }

  function setReloadEnabled(enabled) {
    const btn = document.getElementById('reloadBtn');
    if (btn) btn.disabled = !enabled;
  }

  function renderCurrentView(opts = {}) {
    if (!currentView) return;
    if (currentView.type === 'year') renderYear(currentView.key, opts);
    else renderMonth(currentView.key, opts);
  }

  function updateFooter() {
    const footer = document.getElementById('footer');
    const ts = lastFetchedAt ? lastFetchedAt.toLocaleTimeString('ko-KR') : '-';
    footer.innerHTML =
      `DB 가입자 데이터는 todaybook-subscription-stats API에서 실시간으로 조회됩니다 · 마지막 조회: ${ts}<br>` +
      `GA4 활성 현황은 Supermetrics(todaybook, account 556152838) 정적 스냅샷입니다 · 마지막 갱신: ${GA4_GENERATED_AT}<br>` +
      `출처: <a href="${API_TEMPLATE}" target="_blank" rel="noopener">${API_TEMPLATE}</a>`;
  }

  // D-1 기준으로 데이터가 적재되는 구조라, 당월 첫날엔 전날이 아직 당월에 속하지 않아
  // 당월 dailyStats가 비어 있을 수 있다. 이 경우 당월 탭 자체를 숨긴다.
  async function init() {
    renderGa4Summary();
    renderLoadingCard('데이터 불러오는 중...');
    const tabsEl = document.getElementById('tabs');
    let months = getMonthOrder();
    const year = months[0].split('-')[0];

    const lastMonthKey = months[months.length - 1];
    let lastMonthData;
    let lastMonthNoData = false;
    try {
      lastMonthData = await fetchMonth(lastMonthKey);
    } catch (e) {
      lastMonthNoData = !!e.noData;
      lastMonthData = undefined;
    }
    const lastMonthEmpty = lastMonthData && !hasAnyData(lastMonthData);
    if ((lastMonthNoData || lastMonthEmpty) && months.length > 1) {
      months = months.slice(0, -1);
    }

    const yearBtn = document.createElement('button');
    yearBtn.className = 'tab-btn tab-btn-summary';
    yearBtn.textContent = `${year}년`;
    yearBtn.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
      yearBtn.classList.add('active');
      currentView = { type: 'year', key: year };
      renderYear(year);
    };
    tabsEl.appendChild(yearBtn);

    months.forEach((mk, i) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (i === months.length - 1 ? ' active' : '');
      btn.textContent = `${mk.split('-')[1]}월`;
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentView = { type: 'month', key: mk };
        renderMonth(mk);
      };
      tabsEl.appendChild(btn);
    });

    const reloadBtn = document.createElement('button');
    reloadBtn.id = 'reloadBtn';
    reloadBtn.className = 'reload-btn';
    reloadBtn.textContent = '↻ 새로고침';
    reloadBtn.onclick = () => renderCurrentView({ force: true });
    tabsEl.appendChild(reloadBtn);

    updateFooter();
    const defaultMonthKey = months[months.length - 1];
    currentView = { type: 'month', key: defaultMonthKey };
    renderMonth(defaultMonthKey);
  }

  init();
})();
</script>
</body>
