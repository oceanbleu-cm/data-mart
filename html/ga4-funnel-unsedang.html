    const pFrom = addDays(pTo, -(len - 1));
    if (pFrom < DATE_RANGE.from) return null;
    return { from: pFrom, to: pTo };
  }

  // 증감 칩. mode 'rel' = 상대 증감률(%), mode 'pp' = 비율의 절대 차이(%p).
  function deltaChip(cur, prev, mode) {
    if (prev == null || cur == null || !isFinite(cur) || !isFinite(prev)) return '';
    if (mode === 'pp') {
      const d = (cur - prev) * 100;
      if (Math.abs(d) < 0.05) return '<span class="chip flat">±0.0%p</span>';
      const cls = d > 0 ? 'up' : 'down';
      return `<span class="chip ${cls}">${d > 0 ? '▲' : '▼'}${Math.abs(d).toFixed(1)}%p</span>`;
    }
    if (!prev) return '';
    const d = ((cur - prev) / prev) * 100;
    if (Math.abs(d) < 0.05) return '<span class="chip flat">±0.0%</span>';
    const cls = d > 0 ? 'up' : 'down';
    return `<span class="chip ${cls}">${d > 0 ? '▲' : '▼'}${Math.abs(d).toFixed(1)}%</span>`;
  }

  // 상담 매출/건수는 운세당 DB API(consultation-stats)에서 페이지를 열 때마다
  // 실시간으로 가져온다(GA4 정적 스냅샷과 별개) — ①의 "실제 상담(DB)" 단계/지표/
  // 일자별 상세 표 DB 열에 쓰인다.
  const FETCH_TIMEOUT_MS = 10000;
  let CONSULT_REVENUE_DAILY = null; // {date: 매출(원), 선불+후불 합산}
  let CONSULT_COUNT_PREPAID_DAILY = null; // {date: 상담건수(선불)}
  let CONSULT_COUNT_POSTPAID_DAILY = null; // {date: 상담건수(후불)}
  let CONSULT_STATE = 'loading'; // 'loading' | 'ok' | 'error'
  let CONSULT_ERROR_MSG = '';

  function consultApiUrl(baseMonth) {
    return `https://adm.unsedang.com/api/v1/reports/consultation-stats/monthly?baseMonth=${baseMonth}`;
  }
  // DATE_RANGE(90일 창)가 여러 달에 걸쳐 있을 수 있어, 걸쳐 있는 모든 달(baseMonth)을
  // 구해 각각 fetch 후 합친다 — 한 달만 고정 조회하면 다른 달 날짜가 영영 비게 된다.
  const CONSULT_MONTHS = [...new Set(rangeDates(DATE_RANGE.from, DATE_RANGE.to).map((d) => d.slice(0, 7)))];

  async function loadConsultStats() {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
    try {
      const results = await Promise.all(CONSULT_MONTHS.map(async (month) => {
        const res = await fetch(consultApiUrl(month), { mode: 'cors', signal: controller.signal });
        if (!res.ok) throw new Error(`${month}: HTTP ${res.status}`);
        return res.json();
      }));
      const revenueMap = {};
      const countPrepaidMap = {};
      const countPostpaidMap = {};
      for (const data of results) {
        for (const day of data.dailyStats || []) {
          revenueMap[day.date] = day.revenue.prepaid.total + day.revenue.postpaid.total;
          countPrepaidMap[day.date] = day.consultationCount.prepaid.total;
          countPostpaidMap[day.date] = day.consultationCount.postpaid.total;
        }
      }
      CONSULT_REVENUE_DAILY = revenueMap;
      CONSULT_COUNT_PREPAID_DAILY = countPrepaidMap;
      CONSULT_COUNT_POSTPAID_DAILY = countPostpaidMap;
      CONSULT_STATE = 'ok';
    } catch (e) {
      CONSULT_STATE = 'error';
      CONSULT_ERROR_MSG = e.name === 'AbortError' ? '요청 시간 초과' : String(e.message || e);
      console.error('상담 매출/건수 로드 실패', e);
    } finally {
      clearTimeout(timer);
      render(CURRENT_FROM, CURRENT_TO);
      updateFooter();
    }
  }

  // ===========================================================================
  // 퍼널 렌더링 — 단계 막대 + 단계 사이에 "전환율 / 이탈 인원·이탈률" 커넥터를 넣는다.
  // 막대 폭은 (전체사용자가 아니라) **그 퍼널의 1단계** 기준이라 작은 트랙도 읽힌다.
  // 절대 이탈 인원이 가장 큰 구간은 '최대 이탈'로 강조한다.
  // ===========================================================================
  function renderFunnelRows(steps, from, to, compare) {
    const cur = steps.map((s) => ({ ...s, value: nodeValue(s.id, from, to).value }));
    const base = cur[0].value;
    const prev = compare ? prevPeriod(from, to) : null;
    const prevVals = prev ? steps.map((s) => nodeSum(s.id, prev.from, prev.to)) : null;
    const curSums = prev ? steps.map((s) => nodeSum(s.id, from, to)) : null;

    // 최대 이탈 구간(절대 인원 기준). 전환율이 100%를 넘는 구간은 후보에서 제외한다.
    let worstIdx = -1;
    let worstDrop = 0;
    for (let i = 1; i < cur.length; i++) {
      const drop = cur[i - 1].value - cur[i].value;
      if (drop > worstDrop) { worstDrop = drop; worstIdx = i; }
    }

    let html = '';
    cur.forEach((s, i) => {
      const pctOfBase = base ? s.value / base : null;
      const barPct = base ? Math.max((s.value / base) * 100, s.value > 0 ? 1.2 : 0) : 0;
      if (i > 0) {
        const fromV = cur[i - 1].value;
        const rate = fromV ? cur[i].value / fromV : null;
        const drop = fromV - cur[i].value;
        const prevRate = prevVals && prevVals[i - 1] ? prevVals[i] / prevVals[i - 1] : null;
        const curRate = curSums && curSums[i - 1] ? curSums[i] / curSums[i - 1] : null;
        const gain = drop < 0;
        const cls = gain ? 'gain' : (i === worstIdx && drop > 0 ? 'worst' : '');
        const dropHtml = gain
          ? `<span class="drop">상위 단계를 거치지 않은 직접 진입 <b>+${numFmt.format(-drop)}명</b></span>`
          : `<span class="drop">이탈 ${numFmt.format(drop)}명 (${fmtPct(fromV ? drop / fromV : null)})</span>`;
        html += `
        <div class="fnl-conn ${cls}">
          <span class="rate">↓ ${fmtPct(rate)}</span>
          ${dropHtml}
          ${deltaChip(curRate, prevRate, 'pp')}
          ${cls === 'worst' ? '<span class="badge bad">최대 이탈</span>' : ''}
          ${gain ? '<span class="badge mute">순차 아님</span>' : ''}
        </div>`;
      }
      html += `
        <div class="fnl-row${i === cur.length - 1 ? ' terminal' : ''}">
          <div class="fnl-label"><span class="nm">${s.label}</span><span class="sub">${s.sub || ''}</span></div>
          <div class="fnl-track"><div class="fnl-bar" style="width:${barPct}%"></div></div>
          <div class="fnl-figs">
            <span class="v">${fmtUsers(s.value)}</span>
            <span class="p">${i === 0 ? '기준 100%' : fmtPct(pctOfBase) + '<span class="pnote"> (1단계 대비)</span>'}</span>
          </div>
        </div>`;
    });
    return { html, cur, base, prev };
  }

  // 일자별 상세 표 — steps(해당 트랙의 항목들)를 열로, 날짜를 행으로(최신순) 깐다.
  // 선택 기간이 90일이어도 전부 보여준다(table-scroll로 가로 스크롤). 하루짜리 값은
  // nodeSum(id, d, d)로 구한다 — 어차피 단일 날짜라 nodeValue의 "전체기간 정확값"
  // 분기(isFullRange)와 무관하게 그날의 일별 원본값 그대로다.
  // extraCols: [{ label, value: (date) => number, fmt: (n) => string }] — GA4 스텝이
  // 아닌 외부 출처(DB 등) 열을 덧붙일 때 쓴다(예: ①의 상담수/매출, DB 실시간 fetch).
  function renderDailyTable(steps, from, to, extraCols) {
    extraCols = extraCols || [];
    const dates = [...rangeDates(from, to)].reverse();
    const head = `<th>일자</th>`
      + steps.map((s) => `<th>${s.label}</th>`).join('')
      + extraCols.map((c) => `<th>${c.label}</th>`).join('');
    const body = dates
      .map((d) => {
        const cells = steps.map((s) => `<td>${fmtUsers(nodeSum(s.id, d, d))}</td>`).join('');
        const extraCells = extraCols.map((c) => `<td>${c.fmt(c.value(d))}</td>`).join('');
        return `<tr><td>${d}</td>${cells}${extraCells}</tr>`;
      })
      .join('');
    const extraNote = extraCols.length
      ? ' DB 열(상담수/매출/건당 평균매출)은 운세당 DB API를 페이지 로드 시점에 실시간으로 가져온 값입니다.'
      : '';
    return `
      <div class="sec-title">일자별 상세</div>
      <div class="table-scroll">
        <table class="daily-tbl">
          <thead><tr>${head}</tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
      <p class="note">일별 원본 활성사용자 값입니다(비집계 지표라 여러 날 합산치가 아닙니다) — 위 퍼널 막대/전환율과 같은 정의입니다.${extraNote}</p>`;
  }

  // --- ①번 퍼널에 이어붙이는 "실제 상담(DB)" 단계. GA4 활성사용자(명)가 아니라 운세당
  // DB API(consultation-stats)의 상담건수(건)라 단위가 다르다 — 그래서 직전 단계와의
  // 커넥터는 "전환율"이 아니라 건÷명 비율로 표기한다(이 코드베이스의 "클릭 1명당
  // 상담건수"와 같은 패턴). 매출(원)은 사람 수 흐름인 퍼널 막대에 넣을 수 없는 지표라
  // 여기엔 안 넣고 dbConsultIndicatorsNote()에서 별도 지표로 보여준다.
  function dbConsultSum(from, to) {
    const dates = rangeDates(from, to);
    return dates.reduce((a, d) => a + (CONSULT_COUNT_PREPAID_DAILY[d] || 0) + (CONSULT_COUNT_POSTPAID_DAILY[d] || 0), 0);
  }
  function dbRevenueSum(from, to) {
    const dates = rangeDates(from, to);
    return dates.reduce((a, d) => a + (CONSULT_REVENUE_DAILY[d] || 0), 0);
  }

  function renderDbConsultStep(from, to, base, clickV) {
    if (CONSULT_STATE !== 'ok') {
      const ph = CONSULT_STATE === 'error' ? '로드 실패' : '로딩 중…';
      return `
        <div class="fnl-conn">
          <span class="rate">↓ –</span>
          <span class="drop">DB 상담수 ${ph}</span>
        </div>
        <div class="fnl-row terminal">
          <div class="fnl-label"><span class="nm">실제 상담 <span class="src-badge db">DB</span></span><span class="sub">consultation-stats</span></div>
          <div class="fnl-track"><div class="fnl-bar" style="width:0%"></div></div>
          <div class="fnl-figs"><span class="v">${ph}</span><span class="p"></span></div>
        </div>`;
    }
    const dbCount = dbConsultSum(from, to);
    const rate = clickV ? dbCount / clickV : null;
    const barPct = base ? Math.max((dbCount / base) * 100, dbCount > 0 ? 1.2 : 0) : 0;
    const pctOfBase = base ? dbCount / base : null;
    return `
      <div class="fnl-conn">
        <span class="rate">↓ ${fmtRatio2(rate)}건/명</span>
        <span class="drop">GA4 명 → DB 건, 단위가 달라 전환율이 아니라 비율입니다</span>
      </div>
      <div class="fnl-row terminal">
        <div class="fnl-label"><span class="nm">실제 상담 <span class="src-badge db">DB</span></span><span class="sub">consultation-stats</span></div>
        <div class="fnl-track"><div class="fnl-bar" style="width:${barPct}%"></div></div>
        <div class="fnl-figs">
          <span class="v">${fmtCount(dbCount)}</span>
          <span class="p">${fmtPct(pctOfBase)}<span class="pnote"> (1단계 대비)</span></span>
        </div>
      </div>`;
  }

  function dbConsultIndicatorsNote(from, to, clickV) {
    if (CONSULT_STATE === 'loading') return '<p class="note">상담수/매출을 DB API에서 불러오는 중…</p>';
    if (CONSULT_STATE === 'error') return `<p class="note warn">상담수/매출 실시간 조회 실패(${CONSULT_ERROR_MSG}) — 새로고침하면 재시도합니다.</p>`;
    const dbCount = dbConsultSum(from, to);
    const revenueSum = dbRevenueSum(from, to);
    return `<p class="note">
      DB 실측 <span class="src-badge db">DB</span>: 상담수 <b>${fmtCount(dbCount)}</b> · 매출 <b>${fmtWon(revenueSum)}</b>
      · 클릭 1명당 상담수 <b>${clickV ? fmtRatio2(dbCount / clickV) + '건' : '–'}</b>
      · 상담 1건당 매출 <b>${dbCount ? fmtWon(Math.round(revenueSum / dbCount)) : '–'}</b>
      — 운세당 DB API(consultation-stats)를 페이지 로드 시점에 실시간으로 가져온 값이라 위 GA4 퍼널(정적 스냅샷)과 집계 시점이 다릅니다.
    </p>`;
  }

  function renderMainFunnel(from, to) {
    const { html, cur, base } = renderFunnelRows(MAIN_FUNNEL, from, to, true);
    const end = cur[cur.length - 1].value;

    const dbCols = CONSULT_STATE === 'ok'
      ? [
          { label: '상담수(DB)', value: (d) => (CONSULT_COUNT_PREPAID_DAILY[d] || 0) + (CONSULT_COUNT_POSTPAID_DAILY[d] || 0), fmt: fmtCount },
          { label: '매출(DB)', value: (d) => CONSULT_REVENUE_DAILY[d] || 0, fmt: fmtWon },
          {
            label: '건당 평균매출(DB)',
            value: (d) => {
              const c = (CONSULT_COUNT_PREPAID_DAILY[d] || 0) + (CONSULT_COUNT_POSTPAID_DAILY[d] || 0);
              return c ? Math.round((CONSULT_REVENUE_DAILY[d] || 0) / c) : null;
            },
            fmt: fmtWon,
          },
        ]
      : [];

    return `
      <div class="card">
        <h2>핵심 전환 퍼널 <span class="src-badge ga4">GA4</span>
          <span class="hint">활성사용자 기준(근사 — 세션 경로 추적 아님) · ${from} ~ ${to}</span></h2>
        <div class="fnl">${html}${renderDbConsultStep(from, to, base, end)}</div>
        ${dbConsultIndicatorsNote(from, to, end)}
        ${renderDailyTable(MAIN_FUNNEL, from, to, dbCols)}
      </div>`;
  }

  let CURRENT_FROM = DATE_RANGE.to;
  let CURRENT_TO = DATE_RANGE.to;

  function render(from, to) {
    CURRENT_FROM = from;
    CURRENT_TO = to;
    document.getElementById('content').innerHTML = renderMainFunnel(from, to);
  }

  function setActivePreset(days) {
    document.querySelectorAll('.preset-btn[data-preset]').forEach((btn) => {
      btn.classList.toggle('active', Number(btn.dataset.preset) === days);
    });
  }

  function applyRange(from, to, presetDays) {
    from = clamp(from);
    to = clamp(to);
    document.getElementById('customFrom').value = from;
    document.getElementById('customTo').value = to;
    setActivePreset(presetDays || null);
    render(from, to);
  }

  function updateFooter() {
    const consultStatusLine = CONSULT_STATE === 'ok'
      ? `퍼널의 "실제 상담(DB)" 단계/상담수·매출 지표는 <b>${consultApiUrl('YYYY-MM')}</b>를 baseMonth <b>${CONSULT_MONTHS.join(', ')}</b>에 대해 페이지 로드 시점에 실시간 fetch함(DB API).`
      : CONSULT_STATE === 'error'
        ? `"실제 상담(DB)" 단계/상담수·매출 지표 실시간 fetch 실패(${CONSULT_ERROR_MSG}) — 새로고침 시 재시도.`
        : '"실제 상담(DB)" 단계/상담수·매출 지표를 실시간 fetch 중…';
    document.getElementById('footer').innerHTML =
      `데이터 출처: Supermetrics(GAWA) · GA4 계정 ${ACCOUNT_NAME} (account_id ${ACCOUNT_ID}) · 내장 데이터 범위 ${DATE_RANGE.from} ~ ${DATE_RANGE.to}(최근 90일)<br>` +
      `GA4 부분(<span class="src-badge ga4">GA4</span> 표시)은 실시간 fetch가 아닌 <b>정적 스냅샷</b>입니다 — 매일 정오(KST) 자동 라우틴이 최근 90일 창을 하루씩 밀어 갱신합니다.<br>` +
      `날짜 필터는 이미 내장된 90일 데이터 안에서 다시 집계하는 것이며, 그 순간 GA4에 실시간으로 쿼리하는 것이 아닙니다.<br>` +
      `전체(90일)를 선택하면 dimension 없이 따로 재조회한 순사용자 합계를, 그보다 짧은 기간은 일별 활성사용자 합계를 씁니다(활성사용자는 비집계 지표라 날짜별로 더하면 중복 계산됨).<br>` +
      `${consultStatusLine}<br>` +
      `생성 시각: ${GENERATED_AT}`;
  }

  // --- #content를 이미지로 캡처 — html2canvas를 버튼 클릭 시점에 지연 로드한다
  // (평소엔 페이지 로드를 느리게 하지 않도록 CDN에서 가져오지 않는다).
  const HTML2CANVAS_SRC = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';

  function loadHtml2Canvas() {
    if (window.html2canvas) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = HTML2CANVAS_SRC;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('html2canvas 로드 실패(네트워크 확인 필요)'));
      document.head.appendChild(s);
    });
  }

  async function captureContent() {
    const btn = document.getElementById('captureBtn');
    const orig = btn.textContent;
    btn.disabled = true;
    btn.textContent = '캡처 중…';
    try {
      await loadHtml2Canvas();
      const target = document.getElementById('content');
      const canvas = await window.html2canvas(target, {
        backgroundColor: getComputedStyle(document.body).backgroundColor,
        scale: 2,
        useCORS: true,
      });
      const link = document.createElement('a');
      link.download = `ga4-funnel-unsedang_${CURRENT_FROM}_${CURRENT_TO}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch (e) {
      console.error('이미지 캡처 실패', e);
      alert('이미지 캡처에 실패했습니다: ' + (e.message || e));
    } finally {
      btn.disabled = false;
      btn.textContent = orig;
    }
  }

  function init() {
    document.getElementById('customFrom').min = DATE_RANGE.from;
    document.getElementById('customFrom').max = DATE_RANGE.to;
    document.getElementById('customTo').min = DATE_RANGE.from;
    document.getElementById('customTo').max = DATE_RANGE.to;

    document.querySelectorAll('.preset-btn[data-preset]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const days = Number(btn.dataset.preset);
        const to = DATE_RANGE.to;
        const from = days >= 90 ? DATE_RANGE.from : clamp(addDays(to, -(days - 1)));
        applyRange(from, to, days);
      });
    });
    const onCustomChange = () => {
      const from = document.getElementById('customFrom').value || DATE_RANGE.from;
      const to = document.getElementById('customTo').value || DATE_RANGE.to;
      if (from > to) return;
      applyRange(from, to, null);
    };
    document.getElementById('customFrom').addEventListener('change', onCustomChange);
    document.getElementById('customTo').addEventListener('change', onCustomChange);
    document.getElementById('captureBtn').addEventListener('click', captureContent);

    applyRange(DATE_RANGE.to, DATE_RANGE.to, 1);
    updateFooter();
    loadConsultStats();
  }

  init();
</script>
