  .funnel-media-group {

    padding: 5px 2px;

  .funnel-media-item .funnel-subitem-value { font-size: 0.78rem; font-weight: 400; color: var(--accent); text-align: center; }

    }
  }

  function renderCallSubRows(from, to) {
    let revenueText;
    let countPrepaidText;
    let countPostpaidText;
    if (CONSULT_STATE === 'loading') {
      revenueText = '로딩 중…';
      countPrepaidText = '로딩 중…';
      countPostpaidText = '로딩 중…';
    } else if (CONSULT_STATE === 'error') {
      revenueText = '로드 실패';
      countPrepaidText = '로드 실패';
      countPostpaidText = '로드 실패';
    } else {
      const dates = rangeDates(from, to);
      const revenueSum = dates.reduce((acc, d) => acc + (CONSULT_REVENUE_DAILY[d] || 0), 0);
      const countPrepaidSum = dates.reduce((acc, d) => acc + (CONSULT_COUNT_PREPAID_DAILY[d] || 0), 0);
      const countPostpaidSum = dates.reduce((acc, d) => acc + (CONSULT_COUNT_POSTPAID_DAILY[d] || 0), 0);
      revenueText = fmtWon(revenueSum);
      countPrepaidText = fmtCount(countPrepaidSum);
      countPostpaidText = fmtCount(countPostpaidSum);
    }
    const aiNoteUsageSum = rangeDates(from, to).reduce((acc, d) => acc + (AI_NOTE_USAGE_DAILY[d] || 0), 0);
    const items = [
      { label: '매출', value: revenueText },
      { label: '상담건수(선불)', value: countPrepaidText },
      { label: '상담건수(후불)', value: countPostpaidText },
      { label: 'AI상담노트사용', value: fmtUsers(aiNoteUsageSum) },
    ];
    const itemsHtml = items
      .map((it) => `
          <div class="funnel-subitem">
            <span class="funnel-subitem-label">${it.label}</span>
            <span class="funnel-subitem-value">${it.value}</span>
          </div>`)
      .join('');
    return `<div class="funnel-subgroup">${itemsHtml}</div>`;
  }

  function renderSubRows(items, from, to) {
    const itemsHtml = items
      .map((it) => {
        const v = subEventValue(it.eventName, from, to).value;
        return `
          <div class="funnel-subitem">
            <span class="funnel-subitem-label">${it.label}</span>
            <span class="funnel-subitem-value">${fmtUsers(v)}</span>
          </div>`;
      })
      .join('');
    return `<div class="funnel-subgroup">${itemsHtml}</div>`;
  }

  function renderFunnel(from, to) {
    const siteTotal = siteTotalValue(from, to);
    const results = [
      { step: { key: 'siteTotal', label: '전체사용자' }, value: siteTotal.value },
      ...STEPS.map((s) => ({ step: s, ...stepValue(s, from, to) })),
    ];
    const first = results[0].value || 1;
    const rows = results.map((r) => {
      const widthPct = Math.max((r.value / first) * 100, r.value > 0 ? 1.5 : 0);
      const subRowsHtml = r.step.key === 'siteTotal'
        ? renderMediaSubRows(from, to)
        : r.step.key === 'cslInfo'
          ? renderSubRows(SUBGROUPS.cslInfo, from, to) + renderCallSubRows(from, to)
          : (SUBGROUPS[r.step.key] ? renderSubRows(SUBGROUPS[r.step.key], from, to) : '');
      return `
        <div class="funnel-row">
          <div class="funnel-label">${r.step.label}</div>
          <div class="funnel-track"><div class="funnel-bar" style="width:${widthPct}%"></div></div>
          <div class="funnel-figures">
            <span class="value">${fmtUsers(r.value)}</span>
          </div>
          ${subRowsHtml}
        </div>`;
    }).join('');
    return `
      <div class="card">
        <h2>매체 유입 → 상담 전환 퍼널 <span class="hint">활성사용자 기준, ${from} ~ ${to}</span></h2>
        <div class="funnel">${rows}</div>
      </div>`;
  }

  let CURRENT_FROM = DATE_RANGE.to;
  let CURRENT_TO = DATE_RANGE.to;

  function render(from, to) {
    CURRENT_FROM = from;
    CURRENT_TO = to;
    document.getElementById('content').innerHTML = renderFunnel(from, to);
  }

  function setActivePreset(days) {
    document.querySelectorAll('.preset-btn[data-preset]').forEach((btn) => {
      btn.classList.toggle('active', Number(btn.dataset.preset) === days);
    });
  }

  function applyRange(from, to, presetDays) {
    from = clamp(from);
    to = clamp(to);
    document.getElementById('customFrom').value = from;
    document.getElementById('customTo').value = to;
    setActivePreset(presetDays || null);
    render(from, to);
  }

  function updateFooter() {
    const consultStatusLine = CONSULT_STATE === 'ok'
      ? `상담사 상세 하위그룹의 매출/상담건수는 <b>${CONSULT_MONTHS.map(consultApiUrl).join(', ')}</b>를 페이지 로드 시점에 실시간 fetch함(DB API).`
      : CONSULT_STATE === 'error'
        ? `상담사 상세 하위그룹의 매출/상담건수 실시간 fetch 실패(${CONSULT_ERROR_MSG}) — 새로고침 시 재시도.`
        : '상담사 상세 하위그룹의 매출/상담건수 실시간 fetch 중…';
    document.getElementById('footer').innerHTML =
      `데이터 출처: Supermetrics(GAWA) · GA4 계정 ${ACCOUNT_NAME} (account_id ${ACCOUNT_ID}) · 내장 데이터 범위 ${DATE_RANGE.from} ~ ${DATE_RANGE.to}(최근 90일)<br>` +
      `이 표는 실시간 fetch가 아닌 <b>정적 스냅샷</b>입니다 — 조회 시점 값을 임베드했습니다. 갱신하려면 Supermetrics로 재조회 후 리포트를 다시 생성해야 합니다.<br>` +
      `날짜 필터는 이미 내장된 90일 데이터 안에서 다시 집계하는 것이며, 그 순간 GA4에 실시간으로 쿼리하는 것이 아닙니다.<br>` +
      `${consultStatusLine}<br>` +
      `생성 시각: ${GENERATED_AT}`;
  }

  // --- #content를 이미지로 캡처 — html2canvas를 버튼 클릭 시점에 지연 로드한다
  // (평소엔 페이지 로드를 느리게 하지 않도록 CDN에서 가져오지 않는다).
  const HTML2CANVAS_SRC = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';

  function loadHtml2Canvas() {
    if (window.html2canvas) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = HTML2CANVAS_SRC;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('html2canvas 로드 실패(네트워크 확인 필요)'));
      document.head.appendChild(s);
    });
  }

  async function captureContent() {
    const btn = document.getElementById('captureBtn');
    const orig = btn.textContent;
    btn.disabled = true;
    btn.textContent = '캡처 중…';
    try {
      await loadHtml2Canvas();
      const target = document.getElementById('content');
      const canvas = await window.html2canvas(target, {
        backgroundColor: getComputedStyle(document.body).backgroundColor,
        scale: 2,
        useCORS: true,
      });
      const link = document.createElement('a');
      link.download = `ga4-funnel-unsedang_${CURRENT_FROM}_${CURRENT_TO}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch (e) {
      console.error('이미지 캡처 실패', e);
      alert('이미지 캡처에 실패했습니다: ' + (e.message || e));
    } finally {
      btn.disabled = false;
      btn.textContent = orig;
    }
  }

  function init() {
    document.getElementById('customFrom').min = DATE_RANGE.from;
    document.getElementById('customFrom').max = DATE_RANGE.to;
    document.getElementById('customTo').min = DATE_RANGE.from;
    document.getElementById('customTo').max = DATE_RANGE.to;

    document.querySelectorAll('.preset-btn[data-preset]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const days = Number(btn.dataset.preset);
        const to = DATE_RANGE.to;
        const from = days >= 90 ? DATE_RANGE.from : clamp(addDays(to, -(days - 1)));
        applyRange(from, to, days);
      });
    });
    const onCustomChange = () => {
      const from = document.getElementById('customFrom').value || DATE_RANGE.from;
      const to = document.getElementById('customTo').value || DATE_RANGE.to;
      if (from > to) return;
      applyRange(from, to, null);
    };
    document.getElementById('customFrom').addEventListener('change', onCustomChange);
    document.getElementById('customTo').addEventListener('change', onCustomChange);
    document.getElementById('captureBtn').addEventListener('click', captureContent);

    applyRange(DATE_RANGE.to, DATE_RANGE.to, 1);
    updateFooter();
    loadConsultStats();
  }

  init();
</script>
