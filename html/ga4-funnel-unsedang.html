<style>
  :root {
    --bg: #f7f7f8;
    --card-bg: #ffffff;
    --text: #1c1c1f;
    --text-dim: #6b6b74;
    --border: #e3e3e7;
    --accent: #7c5cff;
    --accent-bg: #efeaff;
    --table-head-bg: #f0f0f3;
    --stripe: #fafafb;
    --good: #1f8a4c;
    --good-bg: #e8f7ee;
    --bad: #d13c3c;
    --bad-bg: #fdecec;
    --mute-bg: #eceef2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171b;
      --card-bg: #202024;
      --text: #ececef;
      --text-dim: #9a9aa4;
      --border: #35353b;
      --accent: #b3a1ff;
      --accent-bg: #2a2440;
      --table-head-bg: #26262b;
      --stripe: #232328;
      --good: #4fcf86;
      --good-bg: #16301f;
      --bad: #ff6b6b;
      --bad-bg: #3a1a1a;
      --mute-bg: #2a2a30;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171b;
    --card-bg: #202024;
    --text: #ececef;
    --text-dim: #9a9aa4;
    --border: #35353b;
    --accent: #b3a1ff;
    --accent-bg: #2a2440;
    --table-head-bg: #26262b;
    --stripe: #232328;
    --good: #4fcf86;
    --good-bg: #16301f;
    --bad: #ff6b6b;
    --bad-bg: #3a1a1a;
    --mute-bg: #2a2a30;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 64px 214px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 980px; margin: 0; }
  .site-nav {
    position: fixed; left: 0; top: 0; bottom: 0; width: 190px;
    display: flex; flex-direction: column; gap: 2px;
    background: var(--card-bg); border-right: 1px solid var(--border);
    padding: 18px 10px; overflow-y: auto; z-index: 200;
  }
  .site-nav a { display: block; font-size: 0.8rem; color: var(--text); line-height: 1.4; padding: 9px 8px; border-radius: 8px; text-decoration: none; white-space: nowrap; flex-shrink: 0; }
  .site-nav a:hover { background: var(--bg); }
  .site-nav a.active { background: var(--accent-bg); color: var(--accent); font-weight: 700; }
  h1 { font-size: 1.35rem; margin: 16px 0 2px; }
  .subtitle { font-size: 0.78rem; color: var(--text-dim); margin: 0 0 14px; line-height: 1.6; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .card h2 { font-size: 0.88rem; font-weight: 700; margin: 0 0 10px; }
  .card h2 .hint { font-weight: 400; color: var(--text-dim); font-size: 0.72rem; margin-left: 6px; }
  footer { color: var(--text-dim); font-size: 0.72rem; margin-top: 24px; line-height: 1.7; }
  footer a { color: var(--text-dim); }

  /* --- 필터 바 --- */
  .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .preset-btn {
    border: 1px solid var(--border); background: var(--card-bg); color: var(--text);
    padding: 6px 13px; border-radius: 999px; font-size: 0.8rem; cursor: pointer; font-family: inherit;
  }
  .preset-btn:hover { border-color: var(--accent); }
  .preset-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .custom-range { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--text-dim); margin-left: 4px; padding-left: 10px; border-left: 1px solid var(--border); }
  .custom-range input[type="date"] {
    font-size: 0.78rem; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--card-bg); color: var(--text); font-family: inherit;
  }

  /* --- 데이터 출처 배지 / 공통 조각 --- */
  .src-badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 0.64rem; font-weight: 700; vertical-align: 2px; margin-left: 6px; white-space: nowrap; }
  .src-badge.ga4 { background: var(--accent-bg); color: var(--accent); }
  .src-badge.db { background: var(--good-bg); color: var(--good); }
  .src-badge.manual { background: var(--mute-bg); color: var(--text-dim); }
  .sec-title { font-size: 0.78rem; font-weight: 700; margin: 16px 0 8px; padding-top: 12px; border-top: 1px solid var(--border); }
  .note { font-size: 0.72rem; color: var(--text-dim); margin: 10px 0 0; line-height: 1.65; }
  .note b { color: var(--text); font-variant-numeric: tabular-nums; }
  .note a { color: var(--accent); }
  .note.warn b, .note.warn { color: var(--bad); }

  /* --- 퍼널(단계 막대만 나열 — 단계 간 연결을 암시하는 커넥터 없음) --- */
  .fnl { display: flex; flex-direction: column; }
  .fnl-row { display: grid; grid-template-columns: 150px 1fr 124px; align-items: center; gap: 12px; }
  .fnl-label { text-align: right; min-width: 0; }
  .fnl-label .nm { font-size: 0.82rem; font-weight: 600; display: block; }
  .fnl-label .sub { font-size: 0.64rem; color: var(--text-dim); font-family: "SFMono-Regular", Menlo, Consolas, monospace; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fnl-track { position: relative; height: 22px; background: var(--stripe); border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
  .fnl-bar { height: 100%; background: var(--accent); min-width: 2px; }
  .fnl-row.terminal .fnl-bar { background: linear-gradient(90deg, var(--accent), var(--good)); }
  .fnl-figs { text-align: right; font-variant-numeric: tabular-nums; min-width: 0; }
  .fnl-figs .v { font-size: 0.94rem; font-weight: 700; white-space: nowrap; }
  .fnl-figs .p { font-size: 0.66rem; color: var(--text-dim); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* --- 일자별 상세 표 --- */
  .table-scroll { overflow-x: auto; }
  .daily-tbl { border-collapse: collapse; width: 100%; font-size: 0.76rem; min-width: 480px; margin-top: 10px; }
  .daily-tbl th, .daily-tbl td { padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .daily-tbl th:first-child, .daily-tbl td:first-child { text-align: center; font-variant-numeric: normal; }
  .daily-tbl th { background: var(--table-head-bg); font-weight: 600; color: var(--text-dim); font-size: 0.7rem; }
  .daily-tbl tbody tr:nth-child(even) { background: var(--stripe); }

  @media (max-width: 760px) {
    body { padding-left: 16px; }
    .site-nav { position: static; width: auto; flex-direction: row; overflow-x: auto; margin-bottom: 12px; border-right: none; border-bottom: 1px solid var(--border); }
    .fnl-row { grid-template-columns: 88px 1fr 86px; gap: 8px; }
    .fnl-label .nm { font-size: 0.73rem; }
    .fnl-label .sub { display: none; }
    .fnl-figs .v { font-size: 0.82rem; }
    .fnl-figs .pnote { display: none; }
    #captureBtn { margin-left: 0 !important; }
  }
</style>

    const head = `<th>일자</th>`
      + steps.map((s) => `<th>${s.label}</th>`).join('')
      + extraCols.map((c) => `<th>${c.label}</th>`).join('');
    const body = dates
      .map((d) => {
        const cells = steps.map((s) => `<td>${fmtUsers(nodeSum(s.id, d, d))}</td>`).join('');
        const extraCells = extraCols.map((c) => `<td>${c.fmt(c.value(d))}</td>`).join('');
        return `<tr><td>${d}</td>${cells}${extraCells}</tr>`;
      })
      .join('');
    const extraNote = extraCols.length
      ? ' DB 열(상담수/매출/건당 평균매출)은 운세당 DB API를 페이지 로드 시점에 실시간으로 가져온 값입니다.'
      : '';
    return `
      <div class="sec-title">일자별 상세</div>
      <div class="table-scroll">
        <table class="daily-tbl">
          <thead><tr>${head}</tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
      <p class="note">일별 원본 활성사용자 값입니다(비집계 지표라 여러 날 합산치가 아닙니다) — 위 막대와 같은 정의입니다.${extraNote}</p>`;
  }

  // --- ①번에 이어붙이는 "실제 상담(DB)" 단계. GA4 활성사용자(명)가 아니라 운세당
  // DB API(consultation-stats)의 상담건수(건)라 단위가 다르다 — 건/명 비율·단위 차이
  // 설명은 막대에 넣지 않고 dbConsultIndicatorsNote()의 "클릭 1명당 상담수"로만 보여준다.
  // 매출(원)도 사람 수 막대에 넣을 수 없는 지표라 같은 note에 별도로 둔다.
  function dbConsultSum(from, to) {
    const dates = rangeDates(from, to);
    return dates.reduce((a, d) => a + (CONSULT_COUNT_PREPAID_DAILY[d] || 0) + (CONSULT_COUNT_POSTPAID_DAILY[d] || 0), 0);
  }
  function dbRevenueSum(from, to) {
    const dates = rangeDates(from, to);
    return dates.reduce((a, d) => a + (CONSULT_REVENUE_DAILY[d] || 0), 0);
  }

  function renderDbConsultStep(from, to, base) {
    if (CONSULT_STATE !== 'ok') {
      const ph = CONSULT_STATE === 'error' ? '로드 실패' : '로딩 중…';
      return `
        <div class="fnl-row terminal">
          <div class="fnl-label"><span class="nm">실제 상담 <span class="src-badge db">DB</span></span><span class="sub">consultation-stats</span></div>
          <div class="fnl-track"><div class="fnl-bar" style="width:0%"></div></div>
          <div class="fnl-figs"><span class="v">${ph}</span><span class="p"></span></div>
        </div>`;
    }
    const dbCount = dbConsultSum(from, to);
    const barPct = base ? Math.max((dbCount / base) * 100, dbCount > 0 ? 1.2 : 0) : 0;
    const pctOfBase = base ? dbCount / base : null;
    return `
      <div class="fnl-row terminal">
        <div class="fnl-label"><span class="nm">실제 상담 <span class="src-badge db">DB</span></span><span class="sub">consultation-stats</span></div>
        <div class="fnl-track"><div class="fnl-bar" style="width:${barPct}%"></div></div>
        <div class="fnl-figs">
          <span class="v">${fmtCount(dbCount)}</span>
          <span class="p">${fmtPct(pctOfBase)}<span class="pnote"> (1단계 대비)</span></span>
        </div>
      </div>`;
  }

  function dbConsultIndicatorsNote(from, to, clickV) {
    if (CONSULT_STATE === 'loading') return '<p class="note">상담수/매출을 DB API에서 불러오는 중…</p>';
    if (CONSULT_STATE === 'error') return `<p class="note warn">상담수/매출 실시간 조회 실패(${CONSULT_ERROR_MSG}) — 새로고침하면 재시도합니다.</p>`;
    const dbCount = dbConsultSum(from, to);
    const revenueSum = dbRevenueSum(from, to);
    return `<p class="note">
      DB 실측 <span class="src-badge db">DB</span>: 상담수 <b>${fmtCount(dbCount)}</b> · 매출 <b>${fmtWon(revenueSum)}</b>
      · 클릭 1명당 상담수 <b>${clickV ? fmtRatio2(dbCount / clickV) + '건' : '–'}</b>
      · 상담 1건당 매출 <b>${dbCount ? fmtWon(Math.round(revenueSum / dbCount)) : '–'}</b>
      — DB API 실시간 값(GA4는 정적 스냅샷이라 집계 시점이 다름).
    </p>`;
  }

  function renderMainFunnel(from, to) {
    const { html, cur, base } = renderFunnelRows(MAIN_FUNNEL, from, to);
    const end = cur[cur.length - 1].value;

    const dbCols = CONSULT_STATE === 'ok'
      ? [
          { label: '상담수(DB)', value: (d) => (CONSULT_COUNT_PREPAID_DAILY[d] || 0) + (CONSULT_COUNT_POSTPAID_DAILY[d] || 0), fmt: fmtCount },
          { label: '매출(DB)', value: (d) => CONSULT_REVENUE_DAILY[d] || 0, fmt: fmtWon },
          {
            label: '건당 평균매출(DB)',
            value: (d) => {
              const c = (CONSULT_COUNT_PREPAID_DAILY[d] || 0) + (CONSULT_COUNT_POSTPAID_DAILY[d] || 0);
              return c ? Math.round((CONSULT_REVENUE_DAILY[d] || 0) / c) : null;
            },
            fmt: fmtWon,
          },
        ]
      : [];

    return `
      <div class="card">
        <h2>핵심 전환 퍼널 <span class="src-badge ga4">GA4</span>
          <span class="hint">활성사용자 기준 · 단계별 독립 집계(연결 추적 아님) · ${from} ~ ${to}</span></h2>
        <div class="fnl">${html}${renderDbConsultStep(from, to, base)}</div>
        ${dbConsultIndicatorsNote(from, to, end)}
        ${renderDailyTable(MAIN_FUNNEL, from, to, dbCols)}
      </div>`;
  }

  let CURRENT_FROM = DATE_RANGE.to;
  let CURRENT_TO = DATE_RANGE.to;

  function render(from, to) {
    CURRENT_FROM = from;
    CURRENT_TO = to;
    document.getElementById('content').innerHTML = renderMainFunnel(from, to);
  }

  function setActivePreset(days) {
    document.querySelectorAll('.preset-btn[data-preset]').forEach((btn) => {
      btn.classList.toggle('active', Number(btn.dataset.preset) === days);
    });
  }

  function applyRange(from, to, presetDays) {
    from = clamp(from);
    to = clamp(to);
    document.getElementById('customFrom').value = from;
    document.getElementById('customTo').value = to;
    setActivePreset(presetDays || null);
    render(from, to);
  }

  function updateFooter() {
    const consultStatusLine = CONSULT_STATE === 'ok'
      ? `퍼널의 "실제 상담(DB)" 단계/상담수·매출 지표는 <b>${consultApiUrl('YYYY-MM')}</b>를 baseMonth <b>${CONSULT_MONTHS.join(', ')}</b>에 대해 페이지 로드 시점에 실시간 fetch함(DB API).`
      : CONSULT_STATE === 'error'
        ? `"실제 상담(DB)" 단계/상담수·매출 지표 실시간 fetch 실패(${CONSULT_ERROR_MSG}) — 새로고침 시 재시도.`
        : '"실제 상담(DB)" 단계/상담수·매출 지표를 실시간 fetch 중…';
    document.getElementById('footer').innerHTML =
      `데이터 출처: BigQuery GA4 export (unsedang.analytics_488612198) · GA4 계정 ${ACCOUNT_NAME} (account_id ${ACCOUNT_ID}) · 내장 데이터 범위 ${DATE_RANGE.from} ~ ${DATE_RANGE.to}(최근 ${WINDOW_DAYS}일)<br>` +
      (WINDOW_DAYS < 90 ? `목표 윈도우는 90일이지만 BigQuery GA4 export 시작일(${DATE_RANGE.from}) 이전 데이터가 없어 ${WINDOW_DAYS}일로 축소되어 있습니다 — 날짜가 쌓이면 자동으로 90일로 복원됩니다.<br>` : '') +
      `GA4 부분(<span class="src-badge ga4">GA4</span> 표시)은 실시간 fetch가 아닌 <b>정적 스냅샷</b>입니다 — 매일 정오(KST) 자동 라우틴이 최근 ${WINDOW_DAYS}일 창을 하루씩 밀어 갱신합니다.<br>` +
      `날짜 필터는 이미 내장된 ${WINDOW_DAYS}일 데이터 안에서 다시 집계하는 것이며, 그 순간 GA4에 실시간으로 쿼리하는 것이 아닙니다.<br>` +
      `전체(${WINDOW_DAYS}일)를 선택하면 dimension 없이 따로 재조회한 순사용자 합계를, 그보다 짧은 기간은 일별 활성사용자 합계를 씁니다(활성사용자는 비집계 지표라 날짜별로 더하면 중복 계산됨).<br>` +
      `${consultStatusLine}<br>` +
      `생성 시각: ${GENERATED_AT}`;
  }

  // --- #content를 이미지로 캡처 — html2canvas를 버튼 클릭 시점에 지연 로드한다
  // (평소엔 페이지 로드를 느리게 하지 않도록 CDN에서 가져오지 않는다).
  const HTML2CANVAS_SRC = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';

  function loadHtml2Canvas() {
    if (window.html2canvas) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = HTML2CANVAS_SRC;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('html2canvas 로드 실패(네트워크 확인 필요)'));
      document.head.appendChild(s);
    });
  }

  async function captureContent() {
    const btn = document.getElementById('captureBtn');
    const orig = btn.textContent;
    btn.disabled = true;
    btn.textContent = '캡처 중…';
    try {
      await loadHtml2Canvas();
      const target = document.getElementById('content');
      const canvas = await window.html2canvas(target, {
        backgroundColor: getComputedStyle(document.body).backgroundColor,
        scale: 2,
        useCORS: true,
      });
      const link = document.createElement('a');
      link.download = `ga4-funnel-unsedang_${CURRENT_FROM}_${CURRENT_TO}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch (e) {
      console.error('이미지 캡처 실패', e);
      alert('이미지 캡처에 실패했습니다: ' + (e.message || e));
    } finally {
      btn.disabled = false;
      btn.textContent = orig;
    }
  }

  function init() {
    document.getElementById('customFrom').min = DATE_RANGE.from;
    document.getElementById('customFrom').max = DATE_RANGE.to;
    document.getElementById('customTo').min = DATE_RANGE.from;
    document.getElementById('customTo').max = DATE_RANGE.to;

    const presetAllBtn = document.getElementById('presetAll');
    presetAllBtn.dataset.preset = String(WINDOW_DAYS);
    presetAllBtn.textContent = `전체(${WINDOW_DAYS}일)`;

    document.querySelectorAll('.preset-btn[data-preset]').forEach((btn) => {
      const btnDays = Number(btn.dataset.preset);
      if (btnDays > WINDOW_DAYS) { btn.style.display = 'none'; return; }
      btn.addEventListener('click', () => {
        const days = Number(btn.dataset.preset);
        const to = DATE_RANGE.to;
        const from = days >= WINDOW_DAYS ? DATE_RANGE.from : clamp(addDays(to, -(days - 1)));
        applyRange(from, to, days);
      });
    });
    const onCustomChange = () => {
      const from = document.getElementById('customFrom').value || DATE_RANGE.from;
      const to = document.getElementById('customTo').value || DATE_RANGE.to;
      if (from > to) return;
      applyRange(from, to, null);
    };
    document.getElementById('customFrom').addEventListener('change', onCustomChange);
    document.getElementById('customTo').addEventListener('change', onCustomChange);
    document.getElementById('captureBtn').addEventListener('click', captureContent);

    const defaultPresetDays = 7;
    const defaultFrom = defaultPresetDays >= WINDOW_DAYS ? DATE_RANGE.from : clamp(addDays(DATE_RANGE.to, -(defaultPresetDays - 1)));
    applyRange(defaultFrom, DATE_RANGE.to, defaultPresetDays);
    updateFooter();
    loadConsultStats();
  }

  init();
</script>
