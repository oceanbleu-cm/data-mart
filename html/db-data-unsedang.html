<!doctype html>
<meta charset="utf-8">
<title>매출 일별 리포트 — 운세당</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card-bg: #ffffff;
    --text: #1c1c1f;
    --text-dim: #6b6b74;
    --border: #e3e3e7;
    --accent: #7c5cff;
    --accent-bg: #efeaff;
    --positive: #1a7f4b;
    --negative: #c23b3b;
    --table-head-bg: #f0f0f3;
    --stripe: #fafafb;
    --warn-bg: #fff4e5;
    --warn-text: #8a5300;
    --prepaid-bg: #eaf1ff;
    --prepaid-head-bg: #d7e4ff;
    --prepaid-text: #2a5db0;
    --postpaid-bg: #fff2e2;
    --postpaid-head-bg: #ffe3bd;
    --postpaid-text: #a15c00;
    --total-bg: #efeaff;
    --total-head-bg: #ddd1ff;
    --total-text: #5c3fd6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171b;
      --card-bg: #202024;
      --text: #ececef;
      --text-dim: #9a9aa4;
      --border: #35353b;
      --accent: #b3a1ff;
      --accent-bg: #2a2440;
      --positive: #5fd08c;
      --negative: #ff8080;
      --table-head-bg: #26262b;
      --stripe: #232328;
      --warn-bg: #3a2c10;
      --warn-text: #f0c374;
      --prepaid-bg: #1c2740;
      --prepaid-head-bg: #253656;
      --prepaid-text: #8fb4ff;
      --postpaid-bg: #3a2c10;
      --postpaid-head-bg: #4a3a15;
      --postpaid-text: #f0c374;
      --total-bg: #2a2440;
      --total-head-bg: #362a5c;
      --total-text: #c9b8ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171b;
    --card-bg: #202024;
    --text: #ececef;
    --text-dim: #9a9aa4;
    --border: #35353b;
    --accent: #b3a1ff;
    --accent-bg: #2a2440;
    --positive: #5fd08c;
    --negative: #ff8080;
    --table-head-bg: #26262b;
    --stripe: #232328;
    --warn-bg: #3a2c10;
    --warn-text: #f0c374;
    --prepaid-bg: #1c2740;
    --prepaid-head-bg: #253656;
    --prepaid-text: #8fb4ff;
    --postpaid-bg: #3a2c10;
    --postpaid-head-bg: #4a3a15;
    --postpaid-text: #f0c374;
    --total-bg: #2a2440;
    --total-head-bg: #362a5c;
    --total-text: #c9b8ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 64px 214px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1080px; margin: 0; }
  .site-nav {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 190px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: var(--card-bg);
    border-right: 1px solid var(--border);
    padding: 18px 10px;
    overflow-y: auto;
    z-index: 200;
  }
  .site-nav-title {
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--text-dim);
    padding: 0 8px;
    margin-bottom: 8px;
    white-space: nowrap;
  }
  .site-nav a {
    display: block;
    font-size: 0.8rem;
    color: var(--text);
    line-height: 1.4;
    padding: 9px 8px;
    border-radius: 8px;
    text-decoration: none;
  }
  .site-nav a:hover { background: var(--bg); }
  .site-nav a.active { background: var(--accent-bg); color: var(--accent); font-weight: 700; }
  h1 { font-size: 1.35rem; margin: 16px 0 4px; }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-bottom: 20px;
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
    font-weight: 400;
  }
  .tab-btn-summary {
    border-color: var(--accent);
    color: var(--accent);
    margin-right: 8px;
  }
  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .reload-btn {
    margin-left: auto;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-dim);
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .reload-btn:hover { color: var(--accent); border-color: var(--accent); }
  .reload-btn:disabled { opacity: 0.5; cursor: default; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .card h2 {
    font-size: 0.88rem;
    font-weight: 400;
    margin: 0 0 8px;
  }
  .card h2 .hint {
    font-weight: 400;
    color: var(--text-dim);
    font-size: 0.72rem;
    margin-left: 6px;
  }
  .stat-group-title {
    font-size: 0.7rem;
    font-weight: 400;
    color: var(--text-dim);
    margin: 10px 0 6px;
  }
  .stat-group-title:first-of-type { margin-top: 0; }
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 8px;
  }
  .stat { padding: 7px 10px; background: var(--stripe); border-radius: 8px; }
  .stat .label { font-size: 0.68rem; color: var(--text-dim); margin-bottom: 2px; }
  .stat .value { font-size: 0.92rem; font-weight: 400; font-variant-numeric: tabular-nums; }
  .stat .sub { font-size: 0.68rem; color: var(--text-dim); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.78rem; min-width: 720px; }
  th, td {
    padding: 5px 8px;
    border-bottom: 1px solid var(--border);
    text-align: right;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  th:first-child, td:first-child { text-align: left; font-variant-numeric: normal; }
  th { background: var(--table-head-bg); font-weight: 400; color: var(--text-dim); font-size: 0.74rem; }
  tbody tr:nth-child(even) { background: var(--stripe); }
  tfoot td { font-weight: 400; border-top: 2px solid var(--border); border-bottom: none; }
  th.col-prepaid { background: var(--prepaid-head-bg); color: var(--prepaid-text); }
  td.col-prepaid { background: var(--prepaid-bg); }
  th.col-postpaid { background: var(--postpaid-head-bg); color: var(--postpaid-text); }
  td.col-postpaid { background: var(--postpaid-bg); }
  th.col-total { background: var(--total-head-bg); color: var(--total-text); }
  td.col-total { background: var(--total-bg); color: var(--total-text); font-weight: 400; }
  tfoot td.col-prepaid { background: var(--prepaid-bg); }
  tfoot td.col-postpaid { background: var(--postpaid-bg); }
  tfoot td.col-total { background: var(--total-bg); }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 0.7rem;
    color: var(--text-dim);
  }
  .legend .swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    margin-right: 5px;
    vertical-align: middle;
  }
  .legend .swatch.prepaid { background: var(--prepaid-head-bg); }
  .legend .swatch.postpaid { background: var(--postpaid-head-bg); }
  .legend .swatch.total { background: var(--total-head-bg); }
  .badge {
    display: inline-block;
    font-size: 0.68rem;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--accent-bg);
    color: var(--accent);
    font-weight: 600;
    margin-left: 4px;
  }
  .badge.warn { background: var(--warn-bg); color: var(--warn-text); }
  .check-row {
    margin-top: 6px;
    font-size: 0.72rem;
    color: var(--text-dim);
  }
  .check-row.ok::before { content: "✓ "; color: var(--positive); font-weight: 700; }
  .check-row.bad::before { content: "✗ "; color: var(--negative); font-weight: 700; }
  .check-row.loading::before { content: "⏳ "; }
  .error-card {
    border-color: var(--negative);
  }
  .error-card .msg { color: var(--negative); font-size: 0.85rem; margin-bottom: 12px; }
  .retry-btn {
    border: 1px solid var(--negative);
    background: transparent;
    color: var(--negative);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 0.8rem;
    cursor: pointer;
    font-weight: 600;
  }
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .two-col > div { min-width: 0; }
  .two-col table { min-width: 0; }
  @media (max-width: 640px) {
    .two-col { grid-template-columns: 1fr; }
  }
  footer {
    color: var(--text-dim);
    font-size: 0.72rem;
    margin-top: 24px;
    line-height: 1.7;
  }
  footer a { color: var(--text-dim); }
</style>
<body>
  <div class="wrap">
    <nav class="site-nav">
      <div class="site-nav-title">리포트 메뉴</div>
      <a href="db-data-unsedang.html" class="active">운세당 매출 리포트</a>
      <a href="ga4-funnel-unsedang.html">운세당 GA4 퍼널</a>
      <a href="ga4-channel-unsedang.html">운세당 매체별 유입</a>
      <a href="db-data-mindcare.html">마인드케어 리포트</a>
      <a href="db-data-lg-today.html">LGU+ 투데이 리포트</a>
      <a href="db-data-kt-today.html">KT 투데이 리포트</a>
    </nav>
    <h1>운세당 매출 일별 리포트</h1>

    <div class="tabs" id="tabs"></div>

    <div id="content"></div>

    <footer id="footer"></footer>
  </div>

<script>
(function () {
  const API_TEMPLATE = "https://adm.unsedang.com/api/v1/reports/consultation-stats/monthly?baseMonth={month}";
  const FETCH_TIMEOUT_MS = 15000;

  const numFmt = new Intl.NumberFormat('ko-KR');
  const won = (n) => numFmt.format(n) + '원';
  const cnt = (n) => numFmt.format(n) + '건';

  const WEEKDAY_KO = ['일', '월', '화', '수', '목', '금', '토'];
  function fmtDateLabel(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const [, m, day] = dateStr.split('-');
    return `${parseInt(m, 10)}/${parseInt(day, 10)} (${WEEKDAY_KO[d.getDay()]})`;
  }

  const AGG_FIELDS = ['total', 'newConsultation', 'repeatConsultation', 'sameDayRepeatConsultation', 'laterRepeatConsultation'];
  function emptyAgg() {
    const zero = () => Object.fromEntries(AGG_FIELDS.map((f) => [f, 0]));
    return { prepaid: zero(), postpaid: zero() };
  }
  function addInto(agg, src) {
    for (const k of ['prepaid', 'postpaid']) {
      for (const f of AGG_FIELDS) agg[k][f] += src[k][f];
    }
  }
  function aggMatches(a, b) {
    return ['prepaid', 'postpaid'].every((k) => AGG_FIELDS.every((f) => a[k][f] === b[k][f]));
  }

  function buildDays(monthData) {
    return [...monthData.dailyStats]
      .sort((a, b) => b.date.localeCompare(a.date))
      .map((day) => {
        const revTotal = day.revenue.prepaid.total + day.revenue.postpaid.total;
        const cntTotal = day.consultationCount.prepaid.total + day.consultationCount.postpaid.total;
        return { ...day, revTotal, cntTotal };
      });
  }

  function summaryCardHtml(titleHtml, revAgg, cntAgg) {
    const revAll = revAgg.prepaid.total + revAgg.postpaid.total;
    const revNew = revAgg.prepaid.newConsultation + revAgg.postpaid.newConsultation;
    const revRepeat = revAgg.prepaid.repeatConsultation + revAgg.postpaid.repeatConsultation;
    const revSameDay = revAgg.prepaid.sameDayRepeatConsultation + revAgg.postpaid.sameDayRepeatConsultation;
    const revLater = revAgg.prepaid.laterRepeatConsultation + revAgg.postpaid.laterRepeatConsultation;
    const cntAll = cntAgg.prepaid.total + cntAgg.postpaid.total;
    const cntNew = cntAgg.prepaid.newConsultation + cntAgg.postpaid.newConsultation;
    const cntRepeat = cntAgg.prepaid.repeatConsultation + cntAgg.postpaid.repeatConsultation;
    const cntSameDay = cntAgg.prepaid.sameDayRepeatConsultation + cntAgg.postpaid.sameDayRepeatConsultation;
    const cntLater = cntAgg.prepaid.laterRepeatConsultation + cntAgg.postpaid.laterRepeatConsultation;
    return `
      <h2>${titleHtml}</h2>
      <div class="stat-group-title">매출</div>
      <div class="summary-grid">
        <div class="stat"><div class="label">합계</div><div class="value">${won(revAll)}</div></div>
        <div class="stat"><div class="label">선불</div><div class="value">${won(revAgg.prepaid.total)}</div></div>
        <div class="stat"><div class="label">후불</div><div class="value">${won(revAgg.postpaid.total)}</div></div>
        <div class="stat"><div class="label">신규</div><div class="value">${won(revNew)}</div></div>
        <div class="stat"><div class="label">재상담</div><div class="value">${won(revRepeat)}</div><div class="sub">당일 ${won(revSameDay)} · 이후 ${won(revLater)}</div></div>
      </div>
      <div class="stat-group-title">상담 건수</div>
      <div class="summary-grid">
        <div class="stat"><div class="label">합계</div><div class="value">${cnt(cntAll)}</div></div>
        <div class="stat"><div class="label">선불</div><div class="value">${cnt(cntAgg.prepaid.total)}</div></div>
        <div class="stat"><div class="label">후불</div><div class="value">${cnt(cntAgg.postpaid.total)}</div></div>
        <div class="stat"><div class="label">신규</div><div class="value">${cnt(cntNew)}</div></div>
        <div class="stat"><div class="label">재상담</div><div class="value">${cnt(cntRepeat)}</div><div class="sub">당일 ${cnt(cntSameDay)} · 이후 ${cnt(cntLater)}</div></div>
      </div>`;
  }

  // rows: [{ label, revenue, consultationCount, revTotal, cntTotal, avg }]
  const GROUP_LEGEND_HTML = `
    <div class="legend">
      <span><span class="swatch prepaid"></span>선불</span>
      <span><span class="swatch postpaid"></span>후불</span>
      <span><span class="swatch total"></span>합계</span>
    </div>`;

  function revenueTableHtml({ headLabel, rows, sumRev, sumRevTotal, avgAll, hintHtml, checkHtml }) {
    const bodyRows = rows
      .map(
        (r) => `<tr>
        <td>${r.label}</td>
        <td class="col-total">${won(r.revTotal)}</td>
        <td>${won(r.avg)}</td>
        <td class="col-prepaid">${won(r.revenue.prepaid.total)}</td>
        <td class="col-prepaid">${won(r.revenue.prepaid.newConsultation)}</td>
        <td class="col-prepaid">${won(r.revenue.prepaid.repeatConsultation)}</td>
        <td class="col-prepaid">${won(r.revenue.prepaid.sameDayRepeatConsultation)}</td>
        <td class="col-prepaid">${won(r.revenue.prepaid.laterRepeatConsultation)}</td>
        <td class="col-postpaid">${won(r.revenue.postpaid.total)}</td>
        <td class="col-postpaid">${won(r.revenue.postpaid.newConsultation)}</td>
        <td class="col-postpaid">${won(r.revenue.postpaid.repeatConsultation)}</td>
        <td class="col-postpaid">${won(r.revenue.postpaid.sameDayRepeatConsultation)}</td>
        <td class="col-postpaid">${won(r.revenue.postpaid.laterRepeatConsultation)}</td>
      </tr>`
      )
      .join('');
    return `
      <h2>매출 <span class="hint">${hintHtml}</span></h2>
      ${GROUP_LEGEND_HTML}
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th rowspan="2">${headLabel}</th>
              <th class="col-total" rowspan="2">매출 합계</th>
              <th rowspan="2">건당 평균매출</th>
              <th class="col-prepaid" rowspan="2">선불 매출</th><th class="col-prepaid" rowspan="2">선불 신규</th><th class="col-prepaid" colspan="3">선불 재상담</th>
              <th class="col-postpaid" rowspan="2">후불 매출</th><th class="col-postpaid" rowspan="2">후불 신규</th><th class="col-postpaid" colspan="3">후불 재상담</th>
            </tr>
            <tr>
              <th class="col-prepaid">합계</th><th class="col-prepaid">당일</th><th class="col-prepaid">이후</th>
              <th class="col-postpaid">합계</th><th class="col-postpaid">당일</th><th class="col-postpaid">이후</th>
            </tr>
          </thead>
          <tbody>${bodyRows}</tbody>
          <tfoot>
            <tr>
              <td>합계</td>
              <td class="col-total">${won(sumRevTotal)}</td>
              <td>${won(avgAll)}</td>
              <td class="col-prepaid">${won(sumRev.prepaid.total)}</td>
              <td class="col-prepaid">${won(sumRev.prepaid.newConsultation)}</td>
              <td class="col-prepaid">${won(sumRev.prepaid.repeatConsultation)}</td>
              <td class="col-prepaid">${won(sumRev.prepaid.sameDayRepeatConsultation)}</td>
              <td class="col-prepaid">${won(sumRev.prepaid.laterRepeatConsultation)}</td>
              <td class="col-postpaid">${won(sumRev.postpaid.total)}</td>
              <td class="col-postpaid">${won(sumRev.postpaid.newConsultation)}</td>
              <td class="col-postpaid">${won(sumRev.postpaid.repeatConsultation)}</td>
              <td class="col-postpaid">${won(sumRev.postpaid.sameDayRepeatConsultation)}</td>
              <td class="col-postpaid">${won(sumRev.postpaid.laterRepeatConsultation)}</td>
            </tr>
          </tfoot>
        </table>
      </div>
      ${checkHtml || ''}`;
  }

  // rows: [{ label, revenue, consultationCount, revTotal, cntTotal, avg }] — 매출 표와 동일한 항목 구조
  function countTableHtml({ headLabel, rows, sumCnt, sumCntTotal, hintHtml, checkHtml }) {
    const bodyRows = rows
      .map(
        (r) => `<tr>
        <td>${r.label}</td>
        <td class="col-total">${cnt(r.cntTotal)}</td>
        <td class="col-prepaid">${cnt(r.consultationCount.prepaid.total)}</td>
        <td class="col-prepaid">${cnt(r.consultationCount.prepaid.newConsultation)}</td>
        <td class="col-prepaid">${cnt(r.consultationCount.prepaid.repeatConsultation)}</td>
        <td class="col-prepaid">${cnt(r.consultationCount.prepaid.sameDayRepeatConsultation)}</td>
        <td class="col-prepaid">${cnt(r.consultationCount.prepaid.laterRepeatConsultation)}</td>
        <td class="col-postpaid">${cnt(r.consultationCount.postpaid.total)}</td>
        <td class="col-postpaid">${cnt(r.consultationCount.postpaid.newConsultation)}</td>
        <td class="col-postpaid">${cnt(r.consultationCount.postpaid.repeatConsultation)}</td>
        <td class="col-postpaid">${cnt(r.consultationCount.postpaid.sameDayRepeatConsultation)}</td>
        <td class="col-postpaid">${cnt(r.consultationCount.postpaid.laterRepeatConsultation)}</td>
      </tr>`
      )
      .join('');
    return `
      <h2>상담 건수 <span class="hint">${hintHtml}</span></h2>
      ${GROUP_LEGEND_HTML}
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th rowspan="2">${headLabel}</th>
              <th class="col-total" rowspan="2">건수 합계</th>
              <th class="col-prepaid" rowspan="2">선불 건수</th><th class="col-prepaid" rowspan="2">선불 신규</th><th class="col-prepaid" colspan="3">선불 재상담</th>
              <th class="col-postpaid" rowspan="2">후불 건수</th><th class="col-postpaid" rowspan="2">후불 신규</th><th class="col-postpaid" colspan="3">후불 재상담</th>
            </tr>
            <tr>
              <th class="col-prepaid">합계</th><th class="col-prepaid">당일</th><th class="col-prepaid">이후</th>
              <th class="col-postpaid">합계</th><th class="col-postpaid">당일</th><th class="col-postpaid">이후</th>
            </tr>
          </thead>
          <tbody>${bodyRows}</tbody>
          <tfoot>
            <tr>
              <td>합계</td>
              <td class="col-total">${cnt(sumCntTotal)}</td>
              <td class="col-prepaid">${cnt(sumCnt.prepaid.total)}</td>
              <td class="col-prepaid">${cnt(sumCnt.prepaid.newConsultation)}</td>
              <td class="col-prepaid">${cnt(sumCnt.prepaid.repeatConsultation)}</td>
              <td class="col-prepaid">${cnt(sumCnt.prepaid.sameDayRepeatConsultation)}</td>
              <td class="col-prepaid">${cnt(sumCnt.prepaid.laterRepeatConsultation)}</td>
              <td class="col-postpaid">${cnt(sumCnt.postpaid.total)}</td>
              <td class="col-postpaid">${cnt(sumCnt.postpaid.newConsultation)}</td>
              <td class="col-postpaid">${cnt(sumCnt.postpaid.repeatConsultation)}</td>
              <td class="col-postpaid">${cnt(sumCnt.postpaid.sameDayRepeatConsultation)}</td>
              <td class="col-postpaid">${cnt(sumCnt.postpaid.laterRepeatConsultation)}</td>
            </tr>
          </tfoot>
        </table>
      </div>
      ${checkHtml || ''}`;
  }

  // --- 실시간 fetch + 캐시 ---
  const monthCache = new Map(); // monthKey -> { data, fetchedAt }
  let lastFetchedAt = null;

  async function fetchMonth(monthKey, { force = false } = {}) {
    if (!force && monthCache.has(monthKey)) return monthCache.get(monthKey).data;

    const url = API_TEMPLATE.replace('{month}', monthKey);
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
    try {
      const res = await fetch(url, { mode: 'cors', signal: controller.signal });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const fetchedAt = new Date();
      monthCache.set(monthKey, { data, fetchedAt });
      lastFetchedAt = fetchedAt;
      updateFooter();
      return data;
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('요청 시간 초과');
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }

  function getMonthOrder() {
    const YEAR = 2026;
    const now = new Date();
    let lastMonth = 12;
    if (now.getFullYear() === YEAR) lastMonth = now.getMonth() + 1;
    else if (now.getFullYear() < YEAR) lastMonth = 1;
    const months = [];
    for (let m = 1; m <= lastMonth; m++) months.push(`${YEAR}-${String(m).padStart(2, '0')}`);
    return months;
  }

  // 연도 요약은 마감된(전월까지) 월만 집계 — 진행 중인 당월은 제외
  function getClosedMonthOrder() {
    const all = getMonthOrder();
    return all.slice(0, -1);
  }

  function renderLoadingCard(msg) {
    const content = document.getElementById('content');
    content.innerHTML = `<div class="card"><div class="check-row loading">${msg}</div></div>`;
  }

  function renderErrorCard(msg, onRetry) {
    const content = document.getElementById('content');
    content.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'card error-card';
    card.innerHTML = `<h2>데이터를 불러오지 못했습니다</h2><div class="msg">${msg}</div>`;
    const retryBtn = document.createElement('button');
    retryBtn.className = 'retry-btn';
    retryBtn.textContent = '다시 시도';
    retryBtn.onclick = onRetry;
    card.appendChild(retryBtn);
    content.appendChild(card);
  }

  // --- 월간 뷰 ---
  async function renderMonth(monthKey, opts = {}) {
    setReloadEnabled(false);
    renderLoadingCard(`${monthKey} 데이터 불러오는 중...`);
    let m;
    try {
      m = await fetchMonth(monthKey, opts);
    } catch (e) {
      renderErrorCard(`${monthKey} 조회 실패 (${e.message})`, () => renderMonth(monthKey, { force: true }));
      setReloadEnabled(true);
      return;
    }
    setReloadEnabled(true);

    const days = buildDays(m);
    const content = document.getElementById('content');
    content.innerHTML = '';

    const summary = document.createElement('div');
    summary.className = 'card';
    summary.innerHTML = summaryCardHtml(
      `${m.baseMonth} 월 요약 <span class="hint">${m.dateRange.from} ~ ${m.dateRange.to}</span>`,
      m.revenue,
      m.consultationCount
    );
    content.appendChild(summary);

    let sumRev = emptyAgg();
    let sumCnt = emptyAgg();
    const dayRows = days.map((d) => {
      addInto(sumRev, d.revenue);
      addInto(sumCnt, d.consultationCount);
      const avg = d.cntTotal > 0 ? Math.round(d.revTotal / d.cntTotal) : 0;
      return {
        label: fmtDateLabel(d.date),
        revenue: d.revenue,
        consultationCount: d.consultationCount,
        revTotal: d.revTotal,
        cntTotal: d.cntTotal,
        avg,
      };
    });
    const sumRevTotal = sumRev.prepaid.total + sumRev.postpaid.total;
    const sumCntTotal = sumCnt.prepaid.total + sumCnt.postpaid.total;
    const avgAll = sumCntTotal > 0 ? Math.round(sumRevTotal / sumCntTotal) : 0;

    const revMatches = aggMatches(sumRev, m.revenue);
    const cntMatches = aggMatches(sumCnt, m.consultationCount);

    const revenueCard = document.createElement('div');
    revenueCard.className = 'card';
    revenueCard.innerHTML = revenueTableHtml({
      headLabel: '일자',
      rows: dayRows,
      sumRev,
      sumRevTotal,
      avgAll,
      hintHtml: '해당 월 일별 매출 내역',
      checkHtml: `<div class="check-row ${revMatches ? 'ok' : 'bad'}">
        ${revMatches ? '일별 매출 합계가 월 API 합계와 일치합니다.' : '일별 매출 합계가 월 API 합계와 다릅니다 — 데이터 확인 필요.'}
      </div>`,
    });
    content.appendChild(revenueCard);

    const countCard = document.createElement('div');
    countCard.className = 'card';
    countCard.innerHTML = countTableHtml({
      headLabel: '일자',
      rows: dayRows,
      sumCnt,
      sumCntTotal,
      hintHtml: '해당 월 일별 상담건수 내역',
      checkHtml: `<div class="check-row ${cntMatches ? 'ok' : 'bad'}">
        ${cntMatches ? '일별 상담건수 합계가 월 API 합계와 일치합니다.' : '일별 상담건수 합계가 월 API 합계와 다릅니다 — 데이터 확인 필요.'}
      </div>`,
    });
    content.appendChild(countCard);

    const topCard = document.createElement('div');
    topCard.className = 'card';
    const revRows = m.topRevenueConsultants
      .map((c) => `<tr><td>${c.rank}위 · ${c.consultantName}</td><td>${won(c.revenueAmount)}</td></tr>`)
      .join('');
    const cntRows = m.topConsultationCountConsultants
      .map((c) => `<tr><td>${c.rank}위 · ${c.consultantName}</td><td>${cnt(c.consultationCount)}</td></tr>`)
      .join('');
    topCard.innerHTML = `
      <h2>상담사 TOP5 <span class="hint">월 전체 기준 (일별 TOP5 합산이 아닌 API 월간 순위 원본)</span></h2>
      <div class="two-col">
        <div>
          <div class="check-row">매출 기준</div>
          <table><tbody>${revRows}</tbody></table>
        </div>
        <div>
          <div class="check-row">건수 기준</div>
          <table><tbody>${cntRows}</tbody></table>
        </div>
      </div>`;
    content.appendChild(topCard);
  }

  function fmtMonthLabel(monthKey) {
    return `${parseInt(monthKey.split('-')[1], 10)}월`;
  }

  // --- 연간 요약 뷰 (마감된 전월까지만 집계) ---
  async function renderYear(year, opts = {}) {
    setReloadEnabled(false);
    const monthKeys = getClosedMonthOrder().filter((k) => k.startsWith(year + '-'));
    if (monthKeys.length === 0) {
      document.getElementById('content').innerHTML =
        '<div class="card"><div class="check-row">마감된 월이 아직 없습니다 (당월 데이터는 요약에서 제외).</div></div>';
      setReloadEnabled(true);
      return;
    }
    const monthsData = [];
    for (let i = 0; i < monthKeys.length; i++) {
      renderLoadingCard(`${year}년 데이터 불러오는 중 (${i}/${monthKeys.length})...`);
      try {
        const data = await fetchMonth(monthKeys[i], opts);
        monthsData.push(data);
      } catch (e) {
        renderErrorCard(`${monthKeys[i]} 조회 실패 (${e.message})`, () => renderYear(year, { force: true }));
        setReloadEnabled(true);
        return;
      }
    }
    setReloadEnabled(true);

    const content = document.getElementById('content');
    content.innerHTML = '';

    let yearRev = emptyAgg();
    let yearCnt = emptyAgg();
    for (const m of monthsData) {
      addInto(yearRev, m.revenue);
      addInto(yearCnt, m.consultationCount);
    }

    const summary = document.createElement('div');
    summary.className = 'card';
    const first = monthsData[0];
    const last = monthsData[monthsData.length - 1];
    summary.innerHTML = summaryCardHtml(
      `${year}년 요약 <span class="hint">${first.dateRange.from} ~ ${last.dateRange.to} · 마감월 기준</span>`,
      yearRev,
      yearCnt
    );
    content.appendChild(summary);

    const monthRows = [];
    for (let i = monthsData.length - 1; i >= 0; i--) {
      const m = monthsData[i];
      const mk = monthKeys[i];
      const revTotal = m.revenue.prepaid.total + m.revenue.postpaid.total;
      const cntTotal = m.consultationCount.prepaid.total + m.consultationCount.postpaid.total;
      const avg = cntTotal > 0 ? Math.round(revTotal / cntTotal) : 0;
      monthRows.push({
        label: fmtMonthLabel(mk),
        revenue: m.revenue,
        consultationCount: m.consultationCount,
        revTotal,
        cntTotal,
        avg,
      });
    }
    const yearRevTotal = yearRev.prepaid.total + yearRev.postpaid.total;
    const yearCntTotal = yearCnt.prepaid.total + yearCnt.postpaid.total;
    const yearAvg = yearCntTotal > 0 ? Math.round(yearRevTotal / yearCntTotal) : 0;

    const revenueCard = document.createElement('div');
    revenueCard.className = 'card';
    revenueCard.innerHTML = revenueTableHtml({
      headLabel: '월',
      rows: monthRows,
      sumRev: yearRev,
      sumRevTotal: yearRevTotal,
      avgAll: yearAvg,
      hintHtml: `${year}년 월별 매출 내역`,
    });
    content.appendChild(revenueCard);

    const countCard = document.createElement('div');
    countCard.className = 'card';
    countCard.innerHTML = countTableHtml({
      headLabel: '월',
      rows: monthRows,
      sumCnt: yearCnt,
      sumCntTotal: yearCntTotal,
      hintHtml: `${year}년 월별 상담건수 내역`,
    });
    content.appendChild(countCard);
  }

  // --- 탭/새로고침 UI ---
  let currentView = null; // { type: 'year'|'month', key }

  function setReloadEnabled(enabled) {
    const btn = document.getElementById('reloadBtn');
    if (btn) btn.disabled = !enabled;
  }

  function renderCurrentView(opts = {}) {
    if (!currentView) return;
    if (currentView.type === 'year') renderYear(currentView.key, opts);
    else renderMonth(currentView.key, opts);
  }

  function updateFooter() {
    const footer = document.getElementById('footer');
    const ts = lastFetchedAt ? lastFetchedAt.toLocaleTimeString('ko-KR') : '-';
    footer.innerHTML =
      `데이터는 adm.unsedang.com API에서 실시간으로 조회됩니다 · 마지막 조회: ${ts}<br>` +
      `출처: <a href="${API_TEMPLATE}" target="_blank" rel="noopener">${API_TEMPLATE}</a>`;
  }

  function init() {
    const tabsEl = document.getElementById('tabs');
    const months = getMonthOrder();
    const year = months[0].split('-')[0];

    const yearBtn = document.createElement('button');
    yearBtn.className = 'tab-btn tab-btn-summary';
    yearBtn.textContent = `${year}년`;
    yearBtn.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
      yearBtn.classList.add('active');
      currentView = { type: 'year', key: year };
      renderYear(year);
    };
    tabsEl.appendChild(yearBtn);

    months.forEach((mk, i) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (i === months.length - 1 ? ' active' : '');
      btn.textContent = `${mk.split('-')[1]}월`;
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentView = { type: 'month', key: mk };
        renderMonth(mk);
      };
      tabsEl.appendChild(btn);
    });

    const reloadBtn = document.createElement('button');
    reloadBtn.id = 'reloadBtn';
    reloadBtn.className = 'reload-btn';
    reloadBtn.textContent = '↻ 새로고침';
    reloadBtn.onclick = () => renderCurrentView({ force: true });
    tabsEl.appendChild(reloadBtn);

    updateFooter();
    currentView = { type: 'month', key: months[months.length - 1] };
    renderMonth(months[months.length - 1]);
  }

  init();
})();
</script>
</body>
