  // 공통 집계: 전체 기간은 재조회한 정확값을, 그 외 기간은 일별 합산 근사값을 쓴다.
  function rangeSum(dict, totalExact, from, to) {
    if (isFullRange(from, to)) return { value: totalExact, exact: true };
    const sum = rangeDates(from, to).reduce((acc, d) => acc + (dict[d] || 0), 0);
    return { value: sum, exact: false };
  }
  const callValue = (from, to) => rangeSum(DAILY_CALL, CALL_TOTAL, from, to);
  const pretelValue = (from, to) => rangeSum(DAILY_PRETEL, PRETEL_TOTAL, from, to);
  const aiNoteValue = (from, to) => rangeSum(DAILY_AINOTE, PAGE_TOTALS.aiNote, from, to);
  const noteInfoValue = (from, to) => rangeSum(DAILY_NOTEINFO, PAGE_TOTALS.noteInfo, from, to);
  const subEventValue = (name, from, to) => rangeSum(DAILY_SUBEVENTS[name] || {}, SUBEVENT_TOTALS[name] || 0, from, to);
  const utmClickValue = (from, to) => rangeSum(DAILY_UTM_CLICK, UTM_CLICK_TOTAL, from, to);
  const recoClickValue = (from, to) => rangeSum(DAILY_RECO_CLICK, RECO_CLICK_TOTAL, from, to);
  // GA4가 아니라 운영진이 직접 전달한 일별 실집계라 비집계 지표 문제가 없어 그냥 합산한다.
  const aiNoteUsageValue = (from, to) => rangeDates(from, to).reduce((acc, d) => acc + (DAILY_AINOTE_USAGE[d] || 0), 0);
  const alimtalkValue = (from, to) => rangeSum(DAILY_ALIMTALK, ALIMTALK_TOTAL, from, to);
  const aiNoteConsultCntValue = (from, to) => rangeSum(DAILY_AINOTE_CONSULT_CNT, AINOTE_CONSULT_CNT_TOTAL, from, to);
  const aiNoteConsultUsrValue = (from, to) => rangeSum(DAILY_AINOTE_CONSULT_USR, AINOTE_CONSULT_USR_TOTAL, from, to);
  const aiNoteRepeatUsrValue = (from, to) => rangeSum(DAILY_AINOTE_REPEAT_USR, AINOTE_REPEAT_USR_TOTAL, from, to);
  const aiNoteRepeatCntValue = (from, to) => rangeSum(DAILY_AINOTE_REPEAT_CNT, AINOTE_REPEAT_CNT_TOTAL, from, to);
  const aiNoteAfterRepeatCntValue = (from, to) => rangeSum(DAILY_AINOTE_AFTER_REPEAT_CNT, AINOTE_AFTER_REPEAT_CNT_TOTAL, from, to);
  const scroll90Value = (from, to) => rangeSum(DAILY_SCROLL90, SCROLL90_TOTAL, from, to);
  function engagementValue(from, to) {
    const durDict = {}, userDict = {};
    for (const [d, v] of Object.entries(DAILY_ENGAGEMENT)) { durDict[d] = v[0]; userDict[d] = v[1]; }
    const dur = rangeSum(durDict, ENGAGEMENT_TOTAL.duration, from, to);
    const usr = rangeSum(userDict, ENGAGEMENT_TOTAL.users, from, to);
    return { duration: dur.value, users: usr.value, exact: dur.exact };
  }

  // 비율 계산: 분모 0이면 null(표시 "–"), 그 외 num/den

  function metricStatus(m) {
    if (m.kind === 'off') return 'off';
    if (m.kind === 'aux') return 'aux';
    if (m.value == null) return 'nodata';
    return (m.dir === 'up' ? m.value >= m.target : m.value <= m.target) ? 'good' : 'bad';
  }
  function fmtMetricValue(m) {
    if (m.value == null) return '–';
    if (m.unit === 'sec') return fmtSec(m.value);
    if (m.unit === 'count') return fmtUsers(m.value);
    if (m.unit === 'txn') return fmtTxn(m.value);
    return fmtPct(m.value);
  }
  function fmtTarget(m) {
    if (m.target == null) return '–';
    if (m.unit === 'sec') return `${m.target}초 이상`;
    if (m.unit === 'count') return fmtUsers(m.target);
    if (m.unit === 'txn') return fmtTxn(m.target);
    return m.dir === 'down' ? `${m.target * 100}% 이하` : `${m.target * 100}% 이상`;
  }
  function statusBadge(status) {
    if (status === 'good') return '<span class="badge good">달성</span>';
    if (status === 'bad') return '<span class="badge bad">미달</span>';
    if (status === 'off') return '<span class="badge mute">추가 개발 필요</span>';
    if (status === 'aux') return '<span class="badge aux">보조지표</span>';
    return '<span class="badge mute">–</span>';
  }
  function kindBadge(kind) {
    if (kind === 'proxy') return ' <span class="badge aux" title="기획 문서가 정의한 분모를 직접 측정할 방법이 없어, 가장 가까운 대체 지표로 근사 계산한 값입니다. 계산식 칸에 실제 쓴 분모를 적어뒀습니다.">프록시</span>';
    return '';
  }

  // 넘을 수 있다(부분집합 관계가 보장되지 않음 — 집계 오류 아님). 퍼센트형 지표에서

        <div class="mock-line w40"></div>
        <div class="mock-tag-row"><div class="mock-tag"></div><div class="mock-tag"></div><div class="mock-tag"></div></div>
      </div>
      <div class="mock-dim"></div>
      <div class="mock-sheet">
        <div class="mock-line w90"></div><div class="mock-line w60"></div>
        <div class="mock-opt-row"><div class="mock-check"></div><div class="mock-line w40" style="background:var(--accent);opacity:.6"></div></div>
        <div class="mock-btn primary">상담하기</div>
      </div>`,
    mock02: `
      <div class="mock-profile-bg">
        <div class="mock-avatar"></div>
        <div class="mock-line w60"></div>
        <div class="mock-line w40"></div>
        <div class="mock-tag-row"><div class="mock-tag"></div><div class="mock-tag"></div><div class="mock-tag"></div></div>
      </div>
      <div class="mock-dim"></div>
      <div class="mock-modal">
        <div class="mock-modal-title">AI 상담노트를 이용하려면 필요해요</div>
        <div class="mock-modal-box"><div class="mock-line w90"></div><div class="mock-line w80"></div><div class="mock-line w90"></div><div class="mock-line w60"></div></div>
        <div class="mock-modal-actions"><div class="mock-btn ghost">취소</div><div class="mock-btn primary">동의하기</div></div>
      </div>`,
    mock03: `
      <div class="mock-kakao-bg"></div>
      <div class="mock-kakao-prior"><div class="mock-line w60"></div><div class="mock-line w40"></div></div>
      <div class="mock-kakao-card">
        <div class="mock-kakao-title">AI 상담노트가 도착했어요</div>
        <div class="mock-kakao-line" style="width:92%"></div><div class="mock-kakao-line" style="width:70%"></div>
        <div class="mock-kakao-btn">운세당 바로가기</div>
      </div>`,
    mock04: `
      <div class="mock-chat-head">선생님 · 6분 상담</div>
      <div class="mock-chat-body">
        <div class="mock-bubble left"><div class="mock-line w80"></div><div class="mock-line w40"></div></div>
        <div class="mock-bubble right"><div class="mock-line w60"></div></div>
        <div class="mock-bubble left"><div class="mock-line w90"></div><div class="mock-line w60"></div></div>
      </div>
      <div class="mock-audio"><div class="mock-line"></div></div>
      <div class="mock-chat-cta"><span class="pill">상담가능</span><span class="cta-btn">상담하기</span></div>`,
    mock05: `
      <div class="mock-chat-head">선생님 · 6분 상담</div>
      <div class="mock-chat-body"><div class="mock-bubble left"><div class="mock-line w80"></div></div></div>
      <div class="mock-dim"></div>
      <div class="mock-survey">
        <div class="mock-modal-title">OO님과의 상담은 어떠셨나요?</div>
        <div class="mock-chip-grid">
          <div class="mock-chip on">편안한 경청</div><div class="mock-chip">쉬운 설명</div>
          <div class="mock-chip on">높은 적중률</div><div class="mock-chip">구체적 조언</div>
        </div>
        <div class="mock-btn primary" style="margin-top:4px;">다음</div>
        <div class="mock-skip">건너뛰고 상담노트 보기</div>
      </div>`,
    mock06: `
      <div class="mock-chat-head">선생님 · 6분 상담</div>
      <div class="mock-chat-body">
        <div class="mock-bubble left"><div class="mock-line w80"></div><div class="mock-line w40"></div></div>
        <div class="mock-bubble right"><div class="mock-line w60"></div></div>

      <div class="mock-audio"><div class="mock-line"></div></div>
      <div class="mock-chat-cta highlight"><span class="pill">상담가능</span><span class="cta-btn">상담하기</span></div>`,
  };

  function flowStatusLabel(status) {
    if (status === 'good') return '달성';
    if (status === 'bad') return '미달';
    if (status === 'off') return '추가 개발 필요';
    if (status === 'aux') return '참고용';
    return '측정불가';
  }
  // 일자별 상세/차트용 접근자 — 3단계는 표에서는 유입수/총사용자수 둘 다, 차트에서는
  // 알림톡 유입 수(utmClick)만 쓴다(사용자 요청: "차트에 3번은 알림톡 유입 수 수치로").
  const FUNNEL_DAILY = {
    1: (d) => DAILY_AINOTE_CONSULT_CNT[d] || 0,
    2: (d) => DAILY_AINOTE_CONSULT_CNT[d] || 0,
    3: (d) => [DAILY_UTM_CLICK[d] || 0, DAILY_NOTEINFO[d] || 0],
    4: (d) => (DAILY_SUBEVENTS['ai-note-review-next'][d] || 0) + (DAILY_SUBEVENTS['ai-note-review-skip'][d] || 0),
    5: (d) => DAILY_SUBEVENTS['ai-note-review-submit'][d] || 0,
    6: (d) => DAILY_SCROLL90[d] || 0,
    7: (d) => DAILY_SUBEVENTS['ai-note-councel-click'][d] || 0,
    8: (d) => DAILY_RECO_CLICK[d] || 0,
    9: (d) => [DAILY_AINOTE_AFTER_REPEAT_CNT[d] || 0, DAILY_AINOTE_REPEAT_CNT[d] || 0],
  };
  // 일자별 수치 표 전용 짧은 열 제목 — "AI 상담노트" 접두어와 8단계의 집계시작일 안내를
  // 뺀 축약형.
  const FUNNEL_SHORT_LABEL = {
    1: 'AI 노트 상담건수',
    2: '알림톡 발송 수',
    3: '상담노트 알림톡 유입 수 / 총 사용자 수',
    4: '후기 팝업 노출 수',
    5: '후기 작성 완료 수',
    6: '상세 스크롤 90% 도달 사용자',
    7: '재상담하기 클릭 수',
    8: '추천 선생님 클릭 수',
  };

  function renderFunnelDailyTable(data, from, to) {
    const dates = [...rangeDates(from, to)].reverse();
    const head = `<th>일자</th>` + data.funnel.map((f) => `<th>${FUNNEL_SHORT_LABEL[f.no] || f.label}</th>`).join('');
    const body = dates.map((d) => {
      const cells = data.funnel.map((f) => {
        const raw = FUNNEL_DAILY[f.no](d);
        if (Array.isArray(raw)) {
          const units = f.values ? f.values.map((v) => v.unit) : [];
          return `<td>${raw.map((v, i) => (units[i] === 'txn' ? fmtTxn(v) : fmtUsers(v))).join(' / ')}</td>`;
        }
        return `<td>${f.unit === 'txn' ? fmtTxn(raw) : fmtUsers(raw)}</td>`;
      }).join('');
      return `<tr><td>${d}</td>${cells}</tr>`;
    }).join('');
    return `
      <div class="card">
        <h2>일자별 수치</h2>
        <div class="table-scroll">
        <table class="daily-tbl">
          <thead><tr>${head}</tr></thead>
          <tbody>${body}</tbody>
        </table>
        </div>
        <p style="font-size:0.72rem;color:var(--text-dim);margin:8px 0 0;">최신 날짜부터 표시합니다. 3단계는 "알림톡 유입 수 / 총 사용자 수" 순서입니다.</p>
      </div>`;
  }

  function renderCoreFunnel(data) {
    const base = data.funnel[0].value;
    const fmtFig = (v, unit) => unit === 'txn' ? fmtTxn(v) : fmtUsers(v);
    const fmtFigPct = (v) => base > 0 ? fmtPct(v / base) : '–';
    const rows = data.funnel.map((f) => {
      let figTxt, pctTxt;
      if (f.values) {
        figTxt = f.values.map((v) => fmtFig(v.value, v.unit)).join(' / ');
        pctTxt = f.values.map((v) => fmtFigPct(v.value)).join(' / ');
      } else {
        figTxt = fmtFig(f.value, f.unit);
        pctTxt = f.no === 1 ? '기준' : fmtFigPct(f.value);
      }
      return `
        <tr>
          <td class="figcell">${f.no}</td>
          <td>${f.label}</td>
          <td class="figcell">${figTxt}</td>
          <td class="figcell">${pctTxt}</td>
        </tr>`;
    }).join('');
    return `
      <div class="card">
        <h2>핵심 퍼널 <span class="hint">1단계(AI 상담노트 상담 건수) 대비 전환율</span></h2>
        <div class="table-scroll">
        <table class="kpi">
          <thead><tr><th>단계</th><th>지표</th><th>수치</th><th>1단계 대비</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        </div>
        <p style="font-size:0.72rem;color:var(--text-dim);margin:8px 0 0;">9단계(재상담건수)는 왼쪽부터 <b>AI노트를 사용후 재상담 건수(선불)</b> / <b>AI노트가 생성된 재상담 건수(선불)</b> 순이며, <span style="color:var(--bad);">AI상담노트가 생성된 상담건 기준입니다.</span></p>
      </div>`;
  }

  function renderScoreboard(data) {
    let good = 0, bad = 0, off = 0;
    data.screens.forEach((s) => s.metrics.forEach((m) => {
      const st = metricStatus(m);
      if (st === 'good') good++; else if (st === 'bad') bad++; else if (st === 'off') off++;
    }));
    const flowHtml = data.screens.map((s) => {
      const core = s.metrics.find((m) => m.key === s.coreMetric);
      const valTxt = core ? fmtMetricValue(core) : '–';
      const status = core ? metricStatus(core) : 'nodata';
      const statusClass = status === 'nodata' ? 'status-nodata' : `status-${status}`;
      return `
        <div class="flow-step ${statusClass}" title="${flowStatusLabel(status)}">
          <div class="flow-num">${s.no}</div>
          <div class="flow-text">
            <div class="flow-name">${s.name}</div>
            <div class="flow-metric">${core ? core.label + ': ' : ''}<b>${valTxt}</b></div>
          </div>
        </div>`;
    }).join('');
    return `
      <div class="card">
        <h2>요약 스코어보드</h2>
        <div class="score-tiles">
          <div class="score-tile good"><div class="num">${good}</div><div class="lbl">달성</div></div>
          <div class="score-tile bad"><div class="num">${bad}</div><div class="lbl">미달</div></div>
          <div class="score-tile mute"><div class="num">${off}</div><div class="lbl">추가 개발 필요</div></div>
        </div>
        <div class="flow">${flowHtml}</div>
      </div>`;
  }

  function renderScreenCard(s) {
    const core = s.metrics.find((m) => m.key === s.coreMetric);
    const coreStatus = core ? metricStatus(core) : 'nodata';
    const cardStatusClass = coreStatus === 'nodata' ? 'screen-status-off' : `screen-status-${coreStatus}`;
    const rows = s.metrics.map((m) => {
      const status = metricStatus(m);
      return `
        <tr${m.kind === 'aux' ? ' class="aux"' : ''}>
          <td>${m.label}${kindBadge(m.kind)}</td>
          <td>${m.calc}</td>
          <td class="figcell">${fmtTarget(m)}</td>
          <td class="figcell">${fmtMetricValue(m)}${over100Note(m)}</td>
          <td>${statusBadge(status)}</td>
        </tr>`;
    }).join('');
    const eventsHtml = s.events.length ? `
      <div${s.hideEvents ? ' style="display:none"' : ''}>
      <p class="evt-title">추적 이벤트</p>
      <div class="table-scroll">
      <table class="evt">
        <thead><tr><th>이벤트 설명</th><th>GA 이벤트키</th><th>기간 내 활성사용자</th></tr></thead>
        <tbody>${s.events.map((e) => `<tr><td>${e.label}</td><td class="key">${e.key}</td><td class="figcell">${fmtUsers(e.value)}</td></tr>`).join('')}</tbody>
      </table>
      </div>
      </div>` : '';
    return `
      <div class="card screen-card-wrap ${cardStatusClass}">
        <h2>${s.no}. ${s.name} <span class="hint">${s.file}</span></h2>
        <div class="screen-card">
          <div class="screen-mock-col">
            <div class="mock">${MOCKS[s.mock]}<div class="mock-notch"></div></div>
            <div class="cap">${s.no} · ${s.name}</div>
          </div>
          <div class="screen-body">
            <p class="screen-desc">${s.desc}</p>
            <div class="table-scroll">
            <table class="kpi">
              <thead><tr><th>지표명</th><th>계산식</th><th>목표</th><th>실측</th><th>달성</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
            </div>
            ${eventsHtml}
          </div>
        </div>
      </div>`;
  }

  let activeMainTab = 'funnel'; // 기본 선택 탭

  function render(from, to) {
    const data = buildMetrics(from, to);
    const html = activeMainTab === 'screens'
      ? renderScoreboard(data) + data.screens.map(renderScreenCard).join('')
      : renderCoreFunnel(data) + renderFunnelDailyTable(data, from, to);
    document.getElementById('content').innerHTML = html;
  }

  function setActivePreset(days) {
    document.querySelectorAll('.preset-btn[data-preset]').forEach((btn) => {
      btn.classList.toggle('active', Number(btn.dataset.preset) === days);
    });
  }
  function applyRange(from, to, presetDays) {
    from = clamp(from); to = clamp(to);
    document.getElementById('customFrom').value = from;
    document.getElementById('customTo').value = to;
    setActivePreset(presetDays || null);
    render(from, to);
  }
  function updateFooter() {
    document.getElementById('footer').innerHTML =
      `데이터 출처: BigQuery GA4 export (unsedang.analytics_488612198) · GA4 계정 ${ACCOUNT_NAME} (account_id ${ACCOUNT_ID}) · 내장 데이터 범위 ${DATE_RANGE.from} ~ ${DATE_RANGE.to}(AI 상담노트 집계 시작일인 9월 30일부터, 총 ${rangeDates(DATE_RANGE.from, DATE_RANGE.to).length}일)<br>` +
      `03 발송 성공률·06 전체 재상담율은 GA4가 아닌 운세당 DB API(consultation-stats/monthly)에서 2026-10-06 조회한 값입니다.<br>` +
      `이 표는 실시간 fetch가 아닌 <b>정적 스냅샷</b>입니다 — 조회 시점 값을 임베드했습니다. 갱신하려면 BigQuery/DB API로 재조회 후 리포트를 다시 생성해야 합니다.<br>` +
      `날짜 필터는 이미 내장된 데이터 안에서 다시 집계하는 것이며, 그 순간 GA4에 실시간으로 쿼리하는 것이 아닙니다.<br>` +
      `원본 KPI 목표 문서: AI상담노트-화면별-KPI목표-260929.html (작성일 2026-09-29)<br>` +
      `생성 시각: ${GENERATED_AT}`;
  }

  function init() {
    const totalDays = rangeDates(DATE_RANGE.from, DATE_RANGE.to).length;
    // 7/14/30일 버튼은 가용 일수보다 길면 전체 범위와 결과가 똑같아 의미가 없으므로
    // 비활성화한다 — 내장 범위가 늘어나 가용 일수가 그 숫자를 넘으면 자동으로 풀린다.
    document.querySelectorAll('.preset-btn[data-preset]').forEach((btn) => {
      const days = Number(btn.dataset.preset);
      if (days > 1) {
        btn.disabled = days >= totalDays;
      }
    });
    document.getElementById('customFrom').min = DATE_RANGE.from;
    document.getElementById('customFrom').max = DATE_RANGE.to;
    document.getElementById('customTo').min = DATE_RANGE.from;
    document.getElementById('customTo').max = DATE_RANGE.to;

    document.querySelectorAll('.preset-btn[data-preset]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const days = Number(btn.dataset.preset);
        const to = DATE_RANGE.to;
        const from = days >= 90 ? DATE_RANGE.from : clamp(addDays(to, -(days - 1)));
        applyRange(from, to, days);
      });
    });
    const onCustomChange = () => {
      const from = document.getElementById('customFrom').value || DATE_RANGE.from;
      const to = document.getElementById('customTo').value || DATE_RANGE.to;
      if (from > to) return;
      applyRange(from, to, null);
    };
    document.getElementById('customFrom').addEventListener('change', onCustomChange);
    document.getElementById('customTo').addEventListener('change', onCustomChange);

    document.querySelectorAll('.main-tab-btn[data-tab]').forEach((btn) => {
      btn.addEventListener('click', () => {
        if (btn.dataset.tab === activeMainTab) return;
        activeMainTab = btn.dataset.tab;
        document.querySelectorAll('.main-tab-btn[data-tab]').forEach((b) => b.classList.toggle('active', b === btn));
        const from = document.getElementById('customFrom').value || DATE_RANGE.from;
        const to = document.getElementById('customTo').value || DATE_RANGE.to;
        render(from, to);
      });
    });

    const defaultDays = 7;
    applyRange(clamp(addDays(DATE_RANGE.to, -(defaultDays - 1))), DATE_RANGE.to, defaultDays);
    updateFooter();
  }

  init();
</script>
