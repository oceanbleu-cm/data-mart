      <div class="mock-audio"><div class="mock-line"></div></div>
      <div class="mock-chat-cta"><span class="pill">상담가능</span><span class="cta-btn">상담하기</span></div>`,
    mock05: `
      <div class="mock-chat-head">선생님 · 6분 상담</div>
      <div class="mock-chat-body"><div class="mock-bubble left"><div class="mock-line w80"></div></div></div>
      <div class="mock-dim"></div>
      <div class="mock-survey">
        <div class="mock-modal-title">OO님과의 상담은 어떠셨나요?</div>
        <div class="mock-chip-grid">
          <div class="mock-chip on">편안한 경청</div><div class="mock-chip">쉬운 설명</div>
          <div class="mock-chip on">높은 적중률</div><div class="mock-chip">구체적 조언</div>
        </div>
        <div class="mock-btn primary" style="margin-top:4px;">다음</div>
        <div class="mock-skip">건너뛰고 상담노트 보기</div>
      </div>`,
    mock06: `
      <div class="mock-chat-head">선생님 · 6분 상담</div>
      <div class="mock-chat-body">
        <div class="mock-bubble left"><div class="mock-line w80"></div><div class="mock-line w40"></div></div>
        <div class="mock-bubble right"><div class="mock-line w60"></div></div>
      </div>
      <div class="mock-audio"><div class="mock-line"></div></div>
      <div class="mock-chat-cta highlight"><span class="pill">상담가능</span><span class="cta-btn">상담하기</span></div>`,
  };

  function flowStatusLabel(status) {
    if (status === 'good') return '달성';
    if (status === 'bad') return '미달';
    if (status === 'off') return '미연동';
    if (status === 'aux') return '참고용';
    return '측정불가';
  }
  function renderScoreboard(data) {
    let good = 0, bad = 0, off = 0;
    data.screens.forEach((s) => s.metrics.forEach((m) => {
      const st = metricStatus(m);
      if (st === 'good') good++; else if (st === 'bad') bad++; else if (st === 'off') off++;
    }));
    const flowHtml = data.screens.map((s) => {
      const core = s.metrics.find((m) => m.key === s.coreMetric);
      const valTxt = core ? fmtMetricValue(core) : '–';
      const status = core ? metricStatus(core) : 'nodata';
      const statusClass = status === 'nodata' ? 'status-nodata' : `status-${status}`;
      return `
        <div class="flow-step ${statusClass}" title="${flowStatusLabel(status)}">
          <div class="flow-num">${s.no}</div>
          <div class="flow-text">
            <div class="flow-name">${s.name}</div>
            <div class="flow-metric">${core ? core.label + ': ' : ''}<b>${valTxt}</b></div>
          </div>
        </div>`;
    }).join('');
    return `
      <div class="card">
        <h2>요약 스코어보드</h2>
        <div class="score-tiles">
          <div class="score-tile good"><div class="num">${good}</div><div class="lbl">달성</div></div>
          <div class="score-tile bad"><div class="num">${bad}</div><div class="lbl">미달</div></div>
          <div class="score-tile mute"><div class="num">${off}</div><div class="lbl">미연동</div></div>
        </div>
        <div class="flow">${flowHtml}</div>
      </div>`;
  }

  function renderScreenCard(s) {
    const core = s.metrics.find((m) => m.key === s.coreMetric);
    const coreStatus = core ? metricStatus(core) : 'nodata';
    const cardStatusClass = coreStatus === 'nodata' ? 'screen-status-off' : `screen-status-${coreStatus}`;
    const rows = s.metrics.map((m) => {
      const status = metricStatus(m);
      return `
        <tr${m.kind === 'aux' ? ' class="aux"' : ''}>
          <td>${m.label}${kindBadge(m.kind)}</td>
          <td>${m.calc}</td>
          <td class="figcell">${fmtTarget(m)}</td>
          <td class="figcell">${fmtMetricValue(m)}${over100Note(m)}</td>
          <td>${statusBadge(status)}</td>
        </tr>`;
    }).join('');
    const eventsHtml = s.events.length ? `
      <p class="evt-title">추적 이벤트</p>
      <div class="table-scroll">
      <table class="evt">
        <thead><tr><th>이벤트 설명</th><th>GA 이벤트키</th><th>기간 내 활성사용자</th></tr></thead>
        <tbody>${s.events.map((e) => `<tr><td>${e.label}</td><td class="key">${e.key}</td><td class="figcell">${fmtUsers(e.value)}</td></tr>`).join('')}</tbody>
      </table>
      </div>` : '';
    return `
      <div class="card screen-card-wrap ${cardStatusClass}">
        <h2>${s.no}. ${s.name} <span class="hint">${s.file}</span></h2>
        <div class="screen-card">
          <div class="screen-mock-col">
            <div class="mock">${MOCKS[s.mock]}<div class="mock-notch"></div></div>
            <div class="cap">${s.no} · ${s.name} (형태 참고용 목업)</div>
          </div>
          <div class="screen-body">
            <p class="screen-desc">${s.desc}</p>
            <div class="table-scroll">
            <table class="kpi">
              <thead><tr><th>지표명</th><th>계산식</th><th>목표</th><th>실측</th><th>달성</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
            </div>
            ${eventsHtml}
          </div>
        </div>
      </div>`;
  }

  let CURRENT_FROM = DATE_RANGE.to;
  let CURRENT_TO = DATE_RANGE.to;

  function render(from, to) {
    CURRENT_FROM = from; CURRENT_TO = to;
    const data = buildMetrics(from, to);
    const html = renderScoreboard(data) + data.screens.map(renderScreenCard).join('');
    document.getElementById('content').innerHTML = html;
  }

  function setActivePreset(days) {
    document.querySelectorAll('.preset-btn[data-preset]').forEach((btn) => {
      btn.classList.toggle('active', Number(btn.dataset.preset) === days);
    });
  }
  function applyRange(from, to, presetDays) {
    from = clamp(from); to = clamp(to);
    document.getElementById('customFrom').value = from;
    document.getElementById('customTo').value = to;
    setActivePreset(presetDays || null);
    render(from, to);
  }
  function updateFooter() {
    document.getElementById('footer').innerHTML =
      `데이터 출처: Supermetrics(GAWA) · GA4 계정 ${ACCOUNT_NAME} (account_id ${ACCOUNT_ID}) · 내장 데이터 범위 ${DATE_RANGE.from} ~ ${DATE_RANGE.to}(AI 상담노트 집계 시작일인 9월 30일부터, 총 ${rangeDates(DATE_RANGE.from, DATE_RANGE.to).length}일)<br>` +
      `이 표는 실시간 fetch가 아닌 <b>정적 스냅샷</b>입니다 — 조회 시점 값을 임베드했습니다. 갱신하려면 Supermetrics로 재조회 후 리포트를 다시 생성해야 합니다.<br>` +
      `날짜 필터는 이미 내장된 데이터 안에서 다시 집계하는 것이며, 그 순간 GA4에 실시간으로 쿼리하는 것이 아닙니다.<br>` +
      `원본 KPI 목표 문서: AI상담노트-화면별-KPI목표-260929.html (작성일 2026-09-29)<br>` +
      `생성 시각: ${GENERATED_AT}`;
  }

  // --- 이미지 저장: html2canvas를 버튼 클릭 시점에 지연 로드 ---
  const HTML2CANVAS_SRC = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
  function loadHtml2Canvas() {
    if (window.html2canvas) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = HTML2CANVAS_SRC;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('html2canvas 로드 실패(네트워크 확인 필요)'));
      document.head.appendChild(s);
    });
  }
  async function captureContent() {
    const btn = document.getElementById('captureBtn');
    const orig = btn.textContent;
    btn.disabled = true; btn.textContent = '캡처 중…';
    try {
      await loadHtml2Canvas();
      const target = document.getElementById('content');
      const canvas = await window.html2canvas(target, {
        backgroundColor: getComputedStyle(document.body).backgroundColor,
        scale: 2, useCORS: true,
      });
      const link = document.createElement('a');
      link.download = `ga4-ainote-kpi-unsedang_${CURRENT_FROM}_${CURRENT_TO}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch (e) {
      console.error('이미지 캡처 실패', e);
      alert('이미지 캡처에 실패했습니다: ' + (e.message || e));
    } finally {
      btn.disabled = false; btn.textContent = orig;
    }
  }

  function init() {
    const totalDays = rangeDates(DATE_RANGE.from, DATE_RANGE.to).length;
    document.getElementById('presetAllBtn').textContent = `전체(${totalDays}일)`;
    // 7/14/30일 버튼은 "전체" 가용 일수보다 길면 전체와 결과가 똑같아 의미가 없으므로
    // 비활성화한다 — 내장 범위가 늘어나 가용 일수가 그 숫자를 넘으면 자동으로 풀린다.
    document.querySelectorAll('.preset-btn[data-preset]').forEach((btn) => {
      const days = Number(btn.dataset.preset);
      if (days > 1 && days < 90) {
        btn.disabled = days >= totalDays;
      }
    });
    document.getElementById('customFrom').min = DATE_RANGE.from;
    document.getElementById('customFrom').max = DATE_RANGE.to;
    document.getElementById('customTo').min = DATE_RANGE.from;
    document.getElementById('customTo').max = DATE_RANGE.to;

    document.querySelectorAll('.preset-btn[data-preset]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const days = Number(btn.dataset.preset);
        const to = DATE_RANGE.to;
        const from = days >= 90 ? DATE_RANGE.from : clamp(addDays(to, -(days - 1)));
        applyRange(from, to, days);
      });
    });
    const onCustomChange = () => {
      const from = document.getElementById('customFrom').value || DATE_RANGE.from;
      const to = document.getElementById('customTo').value || DATE_RANGE.to;
      if (from > to) return;
      applyRange(from, to, null);
    };
    document.getElementById('customFrom').addEventListener('change', onCustomChange);
    document.getElementById('customTo').addEventListener('change', onCustomChange);
    document.getElementById('captureBtn').addEventListener('click', captureContent);

    applyRange(DATE_RANGE.from, DATE_RANGE.to, 90);
    updateFooter();
  }

  init();
</script>
