<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마인드케어 리포트</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card-bg: #ffffff;
    --text: #1c1c1f;
    --text-dim: #6b6b74;
    --border: #e3e3e7;
    --accent: #7c5cff;
    --accent-bg: #efeaff;
    --positive: #1a7f4b;
    --negative: #c23b3b;
    --table-head-bg: #f0f0f3;
    --stripe: #fafafb;
    --paid-bg: #eaf1ff;
    --paid-head-bg: #d7e4ff;
    --paid-text: #2a5db0;
    --premium-bg: #e8f8ef;
    --premium-head-bg: #c9f0d8;
    --premium-text: #1a7f4b;
    --free-bg: #fff2e2;
    --free-head-bg: #ffe3bd;
    --free-text: #a15c00;
    --cashback-bg: #efeaff;
    --cashback-head-bg: #ddd1ff;
    --cashback-text: #5c3fd6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171b;
      --card-bg: #202024;
      --text: #ececef;
      --text-dim: #9a9aa4;
      --border: #35353b;
      --accent: #b3a1ff;
      --accent-bg: #2a2440;
      --positive: #5fd08c;
      --negative: #ff8080;
      --table-head-bg: #26262b;
      --stripe: #232328;
      --paid-bg: #1c2740;
      --paid-head-bg: #253656;
      --paid-text: #8fb4ff;
      --premium-bg: #163024;
      --premium-head-bg: #1f4a34;
      --premium-text: #7fe3ab;
      --free-bg: #3a2c10;
      --free-head-bg: #4a3a15;
      --free-text: #f0c374;
      --cashback-bg: #2a2440;
      --cashback-head-bg: #362a5c;
      --cashback-text: #c9b8ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171b;
    --card-bg: #202024;
    --text: #ececef;
    --text-dim: #9a9aa4;
    --border: #35353b;
    --accent: #b3a1ff;
    --accent-bg: #2a2440;
    --positive: #5fd08c;
    --negative: #ff8080;
    --table-head-bg: #26262b;
    --stripe: #232328;
    --paid-bg: #1c2740;
    --paid-head-bg: #253656;
    --paid-text: #8fb4ff;
    --premium-bg: #163024;
    --premium-head-bg: #1f4a34;
    --premium-text: #7fe3ab;
    --free-bg: #3a2c10;
    --free-head-bg: #4a3a15;
    --free-text: #f0c374;
    --cashback-bg: #2a2440;
    --cashback-head-bg: #362a5c;
    --cashback-text: #c9b8ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 64px 214px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1080px; margin: 0; }
  .site-nav {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 190px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: var(--card-bg);
    border-right: 1px solid var(--border);
    padding: 18px 10px;
    overflow-y: auto;
    z-index: 200;
  }
  .site-nav a {
    display: block;
    font-size: 0.8rem;
    color: var(--text);
    line-height: 1.4;
    padding: 9px 8px;
    border-radius: 8px;
    text-decoration: none;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .site-nav a:hover { background: var(--bg); }
  .site-nav a.active { background: var(--accent-bg); color: var(--accent); font-weight: 700; }
  h1 { font-size: 1.35rem; margin: 16px 0 4px; }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-bottom: 20px;
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
    font-weight: 400;
  }
  .tab-btn-summary {
    border-color: var(--accent);
    color: var(--accent);
    margin-right: 8px;
  }
  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .reload-btn {
    margin-left: auto;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-dim);
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .reload-btn:hover { color: var(--accent); border-color: var(--accent); }
  .reload-btn:disabled { opacity: 0.5; cursor: default; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .card h2 {
    font-size: 0.88rem;
    font-weight: 400;
    margin: 0 0 8px;
  }
  .card h2 .hint {
    font-weight: 400;
    color: var(--text-dim);
    font-size: 0.72rem;
    margin-left: 6px;
  }
  .stat-group-title {
    font-size: 0.7rem;
    font-weight: 400;
    color: var(--text-dim);
    margin: 10px 0 6px;
  }
  .stat-group-title:first-of-type { margin-top: 0; }
  .section-divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .ga4-range-picker {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    margin: 8px 0 12px;
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  .ga4-range-picker input[type="date"] {
    font-family: inherit;
    font-size: 0.82rem;
    padding: 5px 8px;
    margin-left: 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card-bg);
    color: var(--text);
  }
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 8px;
  }
  .summary-grid-5 { grid-template-columns: repeat(5, 1fr); }
  @media (max-width: 760px) {
    .summary-grid-5 { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
    body { padding-left: 16px; }
    .site-nav { position: static; width: auto; flex-direction: row; overflow-x: auto; margin-bottom: 12px; border-right: none; border-bottom: 1px solid var(--border); }
  }
  .stat { padding: 7px 10px; background: var(--stripe); border-radius: 8px; }
  .stat .label { font-size: 0.68rem; color: var(--text-dim); margin-bottom: 2px; }
  .stat .value { font-size: 0.92rem; font-weight: 400; font-variant-numeric: tabular-nums; }
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.78rem; min-width: 600px; }
  th, td {
    padding: 5px 8px;
    border-bottom: 1px solid var(--border);
    text-align: right;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  th:first-child, td:first-child { text-align: left; font-variant-numeric: normal; }
  .ga4-summary-table th:first-child, .ga4-summary-table td:first-child { text-align: center; }
  th { background: var(--table-head-bg); font-weight: 400; color: var(--text-dim); font-size: 0.74rem; }
  tbody tr:nth-child(even) { background: var(--stripe); }
  tfoot td { font-weight: 400; border-top: 2px solid var(--border); border-bottom: none; }
  th.col-paid { background: var(--paid-head-bg); color: var(--paid-text); }
  td.col-paid { background: var(--paid-bg); }
  th.col-premium { background: var(--premium-head-bg); color: var(--premium-text); }
  td.col-premium { background: var(--premium-bg); }
  th.col-free { background: var(--free-head-bg); color: var(--free-text); }
  td.col-free { background: var(--free-bg); }
  th.col-cashback { background: var(--cashback-head-bg); color: var(--cashback-text); }
  td.col-cashback { background: var(--cashback-bg); color: var(--cashback-text); }
  tfoot td.col-paid { background: var(--paid-bg); }
  tfoot td.col-premium { background: var(--premium-bg); }
  tfoot td.col-free { background: var(--free-bg); }
  tfoot td.col-cashback { background: var(--cashback-bg); }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 0.7rem;
    color: var(--text-dim);
  }
  .legend .swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    margin-right: 5px;
    vertical-align: middle;
  }
  .legend .swatch.paid { background: var(--paid-head-bg); }
  .legend .swatch.premium { background: var(--premium-head-bg); }
  .legend .swatch.free { background: var(--free-head-bg); }
  .legend .swatch.cashback { background: var(--cashback-head-bg); }
  .delta { font-size: 0.68rem; margin-left: 2px; }
  .delta.up { color: var(--negative); }
  .delta.down { color: var(--paid-text); }
  .delta.flat { color: var(--text-dim); }
  .check-row {
    margin-top: 6px;
    font-size: 0.72rem;
    color: var(--text-dim);
  }
  .check-row.ok::before { content: "✓ "; color: var(--positive); font-weight: 400; }
  .check-row.bad::before { content: "✗ "; color: var(--negative); font-weight: 400; }
  .check-row.loading::before { content: "⏳ "; }
  .error-card { border-color: var(--negative); }
  .error-card .msg { color: var(--negative); font-size: 0.85rem; margin-bottom: 12px; }
  .retry-btn {
    border: 1px solid var(--negative);
    background: transparent;
    color: var(--negative);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .carrier-heading {
    font-size: 1.05rem;
    margin: 22px 0 10px;
    padding-top: 4px;
  }
  .carrier-heading:first-of-type { margin-top: 4px; }
  .carrier-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 4px 0 12px;
  }
  .carrier-tab-btn {
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    padding: 7px 16px;
    border-radius: 6px;
    font-size: 0.84rem;
    cursor: pointer;
    font-weight: 400;
  }
  .carrier-tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  footer {
    color: var(--text-dim);
    font-size: 0.72rem;
    margin-top: 24px;
    line-height: 1.7;
  }
  footer a { color: var(--text-dim); }
</style>

  <div class="wrap">
    <nav class="site-nav">
      <a href="db-data-unsedang.html">운세당 매출 리포트</a>

    <h1>마인드케어 리포트</h1>

    <div id="ga4Summary"></div>

    <div class="tabs" id="tabs"></div>

    <div id="content"></div>

    <footer id="footer"></footer>
  </div>

<script>
(function () {
  const API_TEMPLATE = "https://admin.firstmindcare.com/api/v1/reports/mindcare-subscription-stats/monthly.json?baseMonth={month}";
  const FETCH_TIMEOUT_MS = 15000;
  const CARRIER_ORDER = ['KT', 'LGU+', 'SKT'];

  // --- GA4(MINDCARE) 활성 현황 — 최근 21일 정적 스냅샷, 매일 자동 라우틴이 갱신 ---
  // 통신사(KT/LGU+/SKT) 구분은 GA4에서 신뢰 가능한 방법을 찾지 못해(호스트명/소스/경로 모두
  // 가입자 규모와 불일치) 서비스 전체 합계만 제공한다. 활성사용자(전체)는 /kpass/news2/,
  // /kpass/recommend/(백그라운드성 호출, docs/ga4_guide.md MINDCARE 섹션 참고)를 제외한 값.
  // 화면의 "선택 기간 합계"는 일별 값을 그대로 더한 단순 합산이다(activeUsers는 비집계
  // 지표라 동일 사용자가 여러 날 중복 집계될 수 있어 실제 순사용자 수보다 클 수 있음 — 사용자
  // 요청으로 별도 비집계 합계 조회는 넣지 않기로 함, 2026-10-14).
  const GA4_GENERATED_AT = '2026-10-18 03:02 UTC (Supermetrics GA4/GAWA 조회, 정적 스냅샷)';
  const GA4_RANGE = { from: '2026-09-27', to: '2026-10-17' };
  const GA4_DAILY = [
    { date: '2026-09-27', activeUsers: 1356, breathing: 591, transcription: 255, careAudio: 10, mtmTextInput: 1 },
    { date: '2026-09-28', activeUsers: 2063, breathing: 983, transcription: 287, careAudio: 8, mtmTextInput: 1 },
    { date: '2026-09-29', activeUsers: 1640, breathing: 731, transcription: 270, careAudio: 11, mtmTextInput: 1 },
    { date: '2026-09-30', activeUsers: 2417, breathing: 384, transcription: 232, careAudio: 8, mtmTextInput: 0 },
    { date: '2026-10-01', activeUsers: 1428, breathing: 574, transcription: 230, careAudio: 9, mtmTextInput: 0 },
    { date: '2026-10-02', activeUsers: 1349, breathing: 578, transcription: 237, careAudio: 9, mtmTextInput: 0 },
    { date: '2026-10-03', activeUsers: 1097, breathing: 496, transcription: 254, careAudio: 5, mtmTextInput: 0 },
    { date: '2026-10-04', activeUsers: 1006, breathing: 418, transcription: 226, careAudio: 8, mtmTextInput: 0 },
    { date: '2026-10-05', activeUsers: 1226, breathing: 573, transcription: 274, careAudio: 15, mtmTextInput: 0 },
    { date: '2026-10-06', activeUsers: 1734, breathing: 793, transcription: 277, careAudio: 12, mtmTextInput: 0 },
    { date: '2026-10-07', activeUsers: 1024, breathing: 375, transcription: 220, careAudio: 7, mtmTextInput: 0 },
    { date: '2026-10-08', activeUsers: 1054, breathing: 369, transcription: 221, careAudio: 14, mtmTextInput: 2 },
    { date: '2026-10-09', activeUsers: 866, breathing: 341, transcription: 255, careAudio: 8, mtmTextInput: 0 },
    { date: '2026-10-10', activeUsers: 1010, breathing: 409, transcription: 239, careAudio: 9, mtmTextInput: 0 },
    { date: '2026-10-11', activeUsers: 1032, breathing: 440, transcription: 237, careAudio: 11, mtmTextInput: 0 },
    { date: '2026-10-12', activeUsers: 1549, breathing: 726, transcription: 259, careAudio: 9, mtmTextInput: 0 },
    { date: '2026-10-13', activeUsers: 1924, breathing: 259, transcription: 213, careAudio: 8, mtmTextInput: 0 },
    { date: '2026-10-14', activeUsers: 958, breathing: 282, transcription: 209, careAudio: 12, mtmTextInput: 1 },
    { date: '2026-10-15', activeUsers: 1499, breathing: 349, transcription: 219, careAudio: 11, mtmTextInput: 1 },
    { date: '2026-10-16', activeUsers: 1400, breathing: 269, transcription: 212, careAudio: 9, mtmTextInput: 2 },
    { date: '2026-10-17', activeUsers: 979, breathing: 252, transcription: 225, careAudio: 10, mtmTextInput: 0 },
  ];

  const numFmt = new Intl.NumberFormat('ko-KR');
  const num = (n) => numFmt.format(n);
  const won = (n) => numFmt.format(n) + '원';
  function fmtDelta(delta) {
    if (delta === null || delta === undefined) return '';
    if (delta > 0) return `<span class="delta up">▲${num(delta)}</span>`;
    if (delta < 0) return `<span class="delta down">▼${num(Math.abs(delta))}</span>`;
    return `<span class="delta flat">–0</span>`;
  }

  const WEEKDAY_KO = ['일', '월', '화', '수', '목', '금', '토'];
  function fmtDateLabel(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const [, m, day] = dateStr.split('-');
    return `${parseInt(m, 10)}/${parseInt(day, 10)} (${WEEKDAY_KO[d.getDay()]})`;
  }
  function fmtMonthLabel(monthKey) {
    return `${parseInt(monthKey.split('-')[1], 10)}월`;
  }

  function sortedDays(monthlyData) {
    return [...monthlyData.dailyStats].sort((a, b) => b.date.localeCompare(a.date));
  }

  function orderedCarriers(carrierStats) {
    return CARRIER_ORDER.map((name) => carrierStats.find((c) => c.carrier === name)).filter(Boolean);
  }

  // --- 실시간 fetch + 캐시 ---
  const monthCache = new Map(); // monthKey -> { data, fetchedAt }
  let lastFetchedAt = null;

  async function fetchMonth(monthKey, { force = false } = {}) {
    if (!force && monthCache.has(monthKey)) return monthCache.get(monthKey).data;

    const url = API_TEMPLATE.replace('{month}', monthKey);
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
    try {
      const res = await fetch(url, { mode: 'cors', signal: controller.signal });
      if (!res.ok) {
        // 이 API는 해당 월 데이터가 아직 없으면(D-1 집계 전) 200이 아니라 에러 응답으로
        // 알려준다(resCd '8888') — 진짜 장애와 구분해서 "데이터 없음"으로 처리한다.
        let body = null;
        try { body = await res.json(); } catch (_) {}
        if (body && body.resCd === '8888') {
          const err = new Error(body.resMsg || '집계된 데이터가 없는 월입니다.');
          err.noData = true;
          throw err;
        }
        throw new Error(`HTTP ${res.status}`);
      }
      const data = await res.json();
      const fetchedAt = new Date();
      monthCache.set(monthKey, { data, fetchedAt });
      lastFetchedAt = fetchedAt;
      updateFooter();
      return data;
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('요청 시간 초과');
      throw e;
    } finally {
      clearTimeout(timer);
    }
  }

  function getMonthOrder() {
    const YEAR = 2026;
    const now = new Date();
    let lastMonth = 12;
    if (now.getFullYear() === YEAR) lastMonth = now.getMonth() + 1;
    else if (now.getFullYear() < YEAR) lastMonth = 1;
    const months = [];
    for (let m = 1; m <= lastMonth; m++) months.push(`${YEAR}-${String(m).padStart(2, '0')}`);
    return months;
  }

  // 연도 요약은 마감된(전월까지) 월만 집계 — 진행 중인 당월은 제외
  function getClosedMonthOrder() {
    return getMonthOrder().slice(0, -1);
  }

  function renderLoadingCard(msg) {
    document.getElementById('content').innerHTML = `<div class="card"><div class="check-row loading">${msg}</div></div>`;
  }

  function renderErrorCard(msg, onRetry) {
    const content = document.getElementById('content');
    content.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'card error-card';
    card.innerHTML = `<h2>데이터를 불러오지 못했습니다</h2><div class="msg">${msg}</div>`;
    const retryBtn = document.createElement('button');
    retryBtn.className = 'retry-btn';
    retryBtn.textContent = '다시 시도';
    retryBtn.onclick = onRetry;
    card.appendChild(retryBtn);
    content.appendChild(card);
  }

  function summaryCardHtml(titleHtml, latestPaid, latestPremium, latestFree, medAgg) {
    return `
      <h2>${titleHtml}</h2>
      <div class="stat-group-title">요약 (누적가입자는 최신값 기준)</div>
      <div class="summary-grid summary-grid-5">
        <div class="stat"><div class="label">유료 누적가입자</div><div class="value">${num(latestPaid)}</div></div>
        <div class="stat"><div class="label">프리미엄 누적가입자</div><div class="value">${num(latestPremium)}</div></div>
        <div class="stat"><div class="label">무료 누적가입자</div><div class="value">${num(latestFree)}</div></div>
        <div class="stat"><div class="label">필사명상 참여인원</div><div class="value">${num(medAgg.participants)}</div></div>
        <div class="stat"><div class="label">필사명상 적립금</div><div class="value">${won(medAgg.points)}</div></div>
      </div>`;
  }

  // rows: [{ label, paid, premium, free, participants, points }]
  function combinedTableHtml({ headLabel, rows, sumAgg, hintHtml, checkHtml }) {
    const bodyRows = rows
      .map((r, i) => {
        const prev = rows[i + 1];
        const paidDelta = prev ? r.paid - prev.paid : null;
        const premiumDelta = prev ? r.premium - prev.premium : null;
        const freeDelta = prev ? r.free - prev.free : null;
        return `<tr>
        <td>${r.label}</td>
        <td class="col-paid">${num(r.paid)} ${fmtDelta(paidDelta)}</td>
        <td class="col-premium">${num(r.premium)} ${fmtDelta(premiumDelta)}</td>
        <td class="col-free">${num(r.free)} ${fmtDelta(freeDelta)}</td>
        <td class="col-cashback">${num(r.participants)}</td>
        <td class="col-cashback">${won(r.points)}</td>
      </tr>`;
      })
      .join('');
    return `
      <h2>가입자 현황 · 필사명상 <span class="hint">${hintHtml}</span></h2>
      <div class="legend">
        <span><span class="swatch paid"></span>유료 누적</span>
        <span><span class="swatch premium"></span>프리미엄 누적</span>
        <span><span class="swatch free"></span>무료 누적</span>
        <span><span class="swatch cashback"></span>필사명상</span>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>${headLabel}</th>
              <th class="col-paid">유료 누적가입자</th>
              <th class="col-premium">프리미엄 누적가입자</th>
              <th class="col-free">무료 누적가입자</th>
              <th class="col-cashback">필사명상 참여인원</th>
              <th class="col-cashback">필사명상 적립금</th>
            </tr>
          </thead>
          <tbody>${bodyRows}</tbody>
          <tfoot>
            <tr>
              <td>합계</td>
              <td class="col-paid">–</td>
              <td class="col-premium">–</td>
              <td class="col-free">–</td>
              <td class="col-cashback">${num(sumAgg.participants)}</td>
              <td class="col-cashback">${won(sumAgg.points)}</td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="check-row">* 유료·프리미엄·무료 누적은 스냅샷 값이라 합산하지 않습니다(합계 열 "–") — 최신값은 위 요약 카드를 참고하세요.</div>
      ${checkHtml || ''}
      <div class="check-row">출처 — 유료·프리미엄·무료 누적: 와이즈모니터</div>`;
  }

  function fmtShortDate(dateStr) {
    return dateStr.slice(2).replace(/-/g, '.');
  }

  const GA4_METRICS = [
    { label: '활성사용자 (전체)', key: 'activeUsers' },
    { label: '숨명상 (/breathing)', key: 'breathing' },
    { label: '필사명상 (/transcription01~03)', key: 'transcription' },
    { label: '오디오명상 (/careAudio)', key: 'careAudio' },
    { label: '게시판 상담 (/mtmTextInput)', key: 'mtmTextInput' },
  ];

  function shiftDateStr(dateStr, days) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    dt.setUTCDate(dt.getUTCDate() + days);
    return dt.toISOString().slice(0, 10);
  }

  function renderGa4Daily(fromDate, toDate) {
    const body = document.getElementById('ga4DailyBody');
    if (!body) return;
    const [start, end] = fromDate <= toDate ? [fromDate, toDate] : [toDate, fromDate];
    const headCells = GA4_METRICS.map((m) => `<th>${m.label}</th>`).join('');
    const filtered = GA4_DAILY.filter((d) => d.date >= start && d.date <= end);
    const sorted = [...filtered].sort((a, b) => b.date.localeCompare(a.date));
    const rows = sorted
      .map((d) => `<tr><td>${fmtDateLabel(d.date)}</td>${GA4_METRICS.map((m) => `<td>${num(d[m.key])}</td>`).join('')}</tr>`)
      .join('');
    const sumRow = GA4_METRICS
      .map((m) => `<td>${num(filtered.reduce((s, d) => s + d[m.key], 0))}</td>`)
      .join('');

    body.innerHTML = `
      <div class="table-scroll">
        <table class="ga4-summary-table">
          <thead><tr><th>날짜</th>${headCells}</tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr><td>선택 기간 합계 (${filtered.length}일)</td>${sumRow}</tr></tfoot>
        </table>
      </div>`;
  }

  function renderGa4Summary() {
    const el = document.getElementById('ga4Summary');
    if (!el) return;
    const DAY_COUNT = GA4_DAILY.length;
    const defaultFromRaw = shiftDateStr(GA4_RANGE.to, -6);
    const defaultFrom = defaultFromRaw > GA4_RANGE.from ? defaultFromRaw : GA4_RANGE.from;

    el.innerHTML = `
      <div class="card">
        <h2>GA4 활성 현황 <span class="hint">최근 ${DAY_COUNT}일 · ${fmtShortDate(GA4_RANGE.from)}~${fmtShortDate(GA4_RANGE.to)}</span></h2>
        <div class="ga4-range-picker">
          <label>시작일<input type="date" id="ga4FromInput" value="${defaultFrom}" min="${GA4_RANGE.from}" max="${GA4_RANGE.to}"></label>
          <label>종료일<input type="date" id="ga4ToInput" value="${GA4_RANGE.to}" min="${GA4_RANGE.from}" max="${GA4_RANGE.to}"></label>
        </div>
        <div id="ga4DailyBody"></div>
        <div class="check-row">* 활성사용자(전체)는 /kpass/news2/·/kpass/recommend/(백그라운드성 호출 추정 페이지) 제외 기준. 통신사(KT/LGU+/SKT)별 구분은 GA4에서 신뢰 가능한 방법이 없어 서비스 전체 합계만 제공합니다.</div>
        <div class="check-row">* 선택 기간 합계는 일별 값을 단순 합산한 값입니다 — activeUsers는 비집계 지표라 동일 사용자가 여러 날 중복 집계될 수 있어 실제 순사용자 수보다 클 수 있습니다.</div>
        <div class="check-row">출처 — GA4 MINDCARE 계정(Supermetrics), 정적 스냅샷 · 마지막 갱신: ${GA4_GENERATED_AT}</div>
      </div>`;

    const fromInput = document.getElementById('ga4FromInput');
    const toInput = document.getElementById('ga4ToInput');
    const update = () => renderGa4Daily(fromInput.value, toInput.value);
    fromInput.onchange = update;
    toInput.onchange = update;
    update();
  }

  // --- 통신사 서브탭 ---
  let selectedCarrier = null; // 월/연 전환 시에도 선택 유지

  function renderCarrierTabs(content, carrierHtmlMap, carrierNames) {
    if (carrierNames.length === 0) return;
    if (!selectedCarrier || !carrierNames.includes(selectedCarrier)) selectedCarrier = carrierNames[0];

    const tabsWrap = document.createElement('div');
    tabsWrap.className = 'carrier-tabs';

    const pane = document.createElement('div');
    pane.className = 'card';

    carrierNames.forEach((name) => {
      const btn = document.createElement('button');
      btn.className = 'carrier-tab-btn' + (name === selectedCarrier ? ' active' : '');
      btn.textContent = name;
      btn.onclick = () => {
        selectedCarrier = name;
        tabsWrap.querySelectorAll('.carrier-tab-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        pane.innerHTML = carrierHtmlMap[name];
      };
      tabsWrap.appendChild(btn);
    });

    content.appendChild(tabsWrap);
    pane.innerHTML = carrierHtmlMap[selectedCarrier];
    content.appendChild(pane);
  }

  function carrierLatest(c) {
    const days = sortedDays(c.monthly);
    return { paid: days[0].paidCumulative, premium: days[0].premiumCumulative, free: days[0].freeCumulative };
  }

  function sumCarrierLatest(carriers) {
    return carriers.reduce(
      (acc, c) => {
        const latest = carrierLatest(c);
        acc.paid += latest.paid;
        acc.premium += latest.premium;
        acc.free += latest.free;
        return acc;
      },
      { paid: 0, premium: 0, free: 0 }
    );
  }

  function sumCarrierMonthly(carriers) {
    return carriers.reduce(
      (acc, c) => {
        acc.participants += c.monthly.transcriptionMeditationParticipants;
        acc.points += c.monthly.transcriptionMeditationPoints;
        return acc;
      },
      { participants: 0, points: 0 }
    );
  }

  // --- 월간 뷰 ---
  async function renderMonth(monthKey, opts = {}) {
    setReloadEnabled(false);
    renderLoadingCard(`${monthKey} 데이터 불러오는 중...`);
    let data;
    try {
      data = await fetchMonth(monthKey, opts);
    } catch (e) {
      renderErrorCard(`${monthKey} 조회 실패 (${e.message})`, () => renderMonth(monthKey, { force: true }));
      setReloadEnabled(true);
      return;
    }
    setReloadEnabled(true);

    const carriers = orderedCarriers(data.carrierStats);
    const content = document.getElementById('content');
    content.innerHTML = '';

    const overallLatest = sumCarrierLatest(carriers);
    const overallMed = sumCarrierMonthly(carriers);
    const overallCard = document.createElement('div');
    overallCard.className = 'card';
    overallCard.innerHTML = summaryCardHtml(
      `마인드케어 ${data.baseMonth} 월 통합 요약 <span class="hint">SKT+KT+LGU+ · ${data.dateRange.from} ~ ${data.dateRange.to}</span>`,
      overallLatest.paid,
      overallLatest.premium,
      overallLatest.free,
      overallMed
    );
    content.appendChild(overallCard);

    const carrierHtmlMap = {};
    carriers.forEach((c) => {
      const days = sortedDays(c.monthly);
      const latestPaid = days[0].paidCumulative;
      const latestPremium = days[0].premiumCumulative;
      const latestFree = days[0].freeCumulative;
      const medAgg = {
        participants: c.monthly.transcriptionMeditationParticipants,
        points: c.monthly.transcriptionMeditationPoints,
      };

      const rows = days.map((d) => ({
        label: fmtDateLabel(d.date),
        paid: d.paidCumulative,
        premium: d.premiumCumulative,
        free: d.freeCumulative,
        participants: d.transcriptionMeditationParticipants,
        points: d.transcriptionMeditationPoints,
      }));
      const medSum = rows.reduce(
        (acc, r) => ({
          participants: acc.participants + r.participants,
          points: acc.points + r.points,
        }),
        { participants: 0, points: 0 }
      );
      const medMatches = medSum.participants === medAgg.participants && medSum.points === medAgg.points;

      carrierHtmlMap[c.carrier] =
        summaryCardHtml(
          `${c.carrier} ${data.baseMonth} 월 요약 <span class="hint">${data.dateRange.from} ~ ${data.dateRange.to}</span>`,
          latestPaid,
          latestPremium,
          latestFree,
          medAgg
        ) +
        '<hr class="section-divider">' +
        combinedTableHtml({
          headLabel: '일자',
          rows,
          sumAgg: medSum,
          hintHtml: '해당 월 일별 상세 내역',
          checkHtml: `<div class="check-row ${medMatches ? 'ok' : 'bad'}">
            ${medMatches ? '일별 필사명상 합계가 월 API 합계와 일치합니다.' : '일별 필사명상 합계가 월 API 합계와 다릅니다 — 데이터 확인 필요.'}
          </div>`,
        });
    });

    renderCarrierTabs(content, carrierHtmlMap, carriers.map((c) => c.carrier));
  }

  // --- 연간 요약 뷰 (마감된 전월까지만 집계) ---
  async function renderYear(year, opts = {}) {
    setReloadEnabled(false);
    const monthKeys = getClosedMonthOrder().filter((k) => k.startsWith(year + '-'));
    if (monthKeys.length === 0) {
      document.getElementById('content').innerHTML =
        '<div class="card"><div class="check-row">마감된 월이 아직 없습니다 (당월 데이터는 요약에서 제외).</div></div>';
      setReloadEnabled(true);
      return;
    }
    const monthsData = [];
    for (let i = 0; i < monthKeys.length; i++) {
      renderLoadingCard(`${year}년 데이터 불러오는 중 (${i}/${monthKeys.length})...`);
      try {
        const data = await fetchMonth(monthKeys[i], opts);
        monthsData.push(data);
      } catch (e) {
        renderErrorCard(`${monthKeys[i]} 조회 실패 (${e.message})`, () => renderYear(year, { force: true }));
        setReloadEnabled(true);
        return;
      }
    }
    setReloadEnabled(true);

    const content = document.getElementById('content');
    content.innerHTML = '';

    const monthsCarriers = monthsData.map((d) => orderedCarriers(d.carrierStats));
    const first = monthsData[0];
    const last = monthsData[monthsData.length - 1];

    const lastLatest = sumCarrierLatest(monthsCarriers[monthsCarriers.length - 1]);
    const yearMed = monthsCarriers.reduce(
      (acc, carriers) => {
        const m = sumCarrierMonthly(carriers);
        acc.participants += m.participants;
        acc.points += m.points;
        return acc;
      },
      { participants: 0, points: 0 }
    );

    const overallCard = document.createElement('div');
    overallCard.className = 'card';
    overallCard.innerHTML = summaryCardHtml(
      `마인드케어 ${year}년 통합 요약 <span class="hint">SKT+KT+LGU+ · ${first.dateRange.from} ~ ${last.dateRange.to} · 마감월 기준</span>`,
      lastLatest.paid,
      lastLatest.premium,
      lastLatest.free,
      yearMed
    );
    content.appendChild(overallCard);

    const carrierHtmlMap = {};
    const carrierNames = [];
    CARRIER_ORDER.forEach((carrierName) => {
      const rows = [];
      let carrierYearAgg = { participants: 0, points: 0 };
      let lastCarrierLatest = null;
      for (let i = monthsData.length - 1; i >= 0; i--) {
        const c = monthsCarriers[i].find((cc) => cc.carrier === carrierName);
        if (!c) continue;
        const days = sortedDays(c.monthly);
        if (!lastCarrierLatest) lastCarrierLatest = { paid: days[0].paidCumulative, premium: days[0].premiumCumulative, free: days[0].freeCumulative };
        rows.push({
          label: fmtMonthLabel(monthKeys[i]),
          paid: days[0].paidCumulative,
          premium: days[0].premiumCumulative,
          free: days[0].freeCumulative,
          participants: c.monthly.transcriptionMeditationParticipants,
          points: c.monthly.transcriptionMeditationPoints,
        });
        carrierYearAgg.participants += c.monthly.transcriptionMeditationParticipants;
        carrierYearAgg.points += c.monthly.transcriptionMeditationPoints;
      }
      if (rows.length === 0) return;

      carrierNames.push(carrierName);
      carrierHtmlMap[carrierName] =
        summaryCardHtml(
          `${carrierName} ${year}년 요약 <span class="hint">${first.dateRange.from} ~ ${last.dateRange.to} · 마감월 기준</span>`,
          lastCarrierLatest.paid,
          lastCarrierLatest.premium,
          lastCarrierLatest.free,
          carrierYearAgg
        ) +
        '<hr class="section-divider">' +
        combinedTableHtml({
          headLabel: '월',
          rows,
          sumAgg: carrierYearAgg,
          hintHtml: `${year}년 월별 상세 내역 (누적가입자는 월말 기준)`,
        });
    });

    renderCarrierTabs(content, carrierHtmlMap, carrierNames);
  }

  // --- 탭/새로고침 UI ---
  let currentView = null; // { type: 'year'|'month', key }

  function setReloadEnabled(enabled) {
    const btn = document.getElementById('reloadBtn');
    if (btn) btn.disabled = !enabled;
  }

  function renderCurrentView(opts = {}) {
    if (!currentView) return;
    if (currentView.type === 'year') renderYear(currentView.key, opts);
    else renderMonth(currentView.key, opts);
  }

  function updateFooter() {
    const footer = document.getElementById('footer');
    const ts = lastFetchedAt ? lastFetchedAt.toLocaleTimeString('ko-KR') : '-';
    footer.innerHTML =
      `데이터는 mindcare-subscription-stats API에서 실시간으로 조회됩니다 · 마지막 조회: ${ts}<br>` +
      `출처: <a href="${API_TEMPLATE}" target="_blank" rel="noopener">${API_TEMPLATE}</a>`;
  }

  // D-1 기준으로 데이터가 적재되는 구조라, 당월 첫날(예: 10/1)엔 전날(9/30)이 아직
  // 당월에 속하지 않아 당월 dailyStats가 비어 있다. 이 경우 당월 탭 자체를 숨기고,
  // 실제로 하루치라도 쌓이는 날(예: 10/2, 10/1 데이터 노출)부터 탭이 나타나게 한다.
  async function init() {
    renderGa4Summary();
    renderLoadingCard('데이터 불러오는 중...');
    const tabsEl = document.getElementById('tabs');
    let months = getMonthOrder();
    const year = months[0].split('-')[0];

    const lastMonthKey = months[months.length - 1];
    let lastMonthData;
    let lastMonthNoData = false;
    try {
      lastMonthData = await fetchMonth(lastMonthKey);
    } catch (e) {
      lastMonthNoData = !!e.noData; // resCd 8888(해당 월 데이터 없음)이면 탭을 숨긴다
      lastMonthData = undefined; // 그 외 진짜 조회 실패는 탭을 그대로 두고 월 뷰에서 재시도하게 둔다
    }
    const lastMonthEmpty = lastMonthData && (
      !lastMonthData.carrierStats ||
      lastMonthData.carrierStats.every((c) => !c.monthly || !c.monthly.dailyStats || c.monthly.dailyStats.length === 0)
    );
    if ((lastMonthNoData || lastMonthEmpty) && months.length > 1) {
      months = months.slice(0, -1);
    }

    const yearBtn = document.createElement('button');
    yearBtn.className = 'tab-btn tab-btn-summary';
    yearBtn.textContent = `${year}년`;
    yearBtn.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
      yearBtn.classList.add('active');
      currentView = { type: 'year', key: year };
      renderYear(year);
    };
    tabsEl.appendChild(yearBtn);

    months.forEach((mk, i) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (i === months.length - 1 ? ' active' : '');
      btn.textContent = `${mk.split('-')[1]}월`;
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentView = { type: 'month', key: mk };
        renderMonth(mk);
      };
      tabsEl.appendChild(btn);
    });

    const reloadBtn = document.createElement('button');
    reloadBtn.id = 'reloadBtn';
    reloadBtn.className = 'reload-btn';
    reloadBtn.textContent = '↻ 새로고침';
    reloadBtn.onclick = () => renderCurrentView({ force: true });
    tabsEl.appendChild(reloadBtn);

    updateFooter();
    const defaultMonthKey = months[months.length - 1];
    currentView = { type: 'month', key: defaultMonthKey };
    renderMonth(defaultMonthKey);
  }

  init();
})();
</script>
</body>
