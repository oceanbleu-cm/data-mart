<script>
(function () {
  const ACCOUNT_ID = '488612198';
  const ACCOUNT_NAME = 'unsedang-a3588';
  const GENERATED_AT = '2026-10-02 03:08 UTC (Supermetrics GA4/GAWA 조회, 정적 스냅샷)';
  const DATE_RANGE = { from: '2026-09-18', to: '2026-10-01' };

  const CONSULT_API = 'https://adm.unsedang.com/api/v1/reports/consultation-stats/monthly?baseMonth=2026-09';
  const FETCH_TIMEOUT_MS = 10000;
  let CONSULT_DAILY = null; // {date: 상담수} — fetch 성공 시 채워짐
  let CONSULT_USER_DAILY = null; // {date: 상담인원(userCount, 선불+후불 단순 합산)} — fetch 성공 시 채워짐
  let CONSULT_STATE = 'loading'; // 'loading' | 'ok' | 'error'
  let CONSULT_ERROR_MSG = '';

  const numFmt = new Intl.NumberFormat('ko-KR');
  const fmtUsers = (n) => (n == null ? '–' : numFmt.format(n) + '명');
  const fmtCount = (n) => (n == null ? '–' : numFmt.format(n) + '건');
  const fmtPercent = (n) => (n == null ? '–' : n.toFixed(1) + '%');
  const WEEKDAY_KO = ['일', '월', '화', '수', '목', '금', '토'];
  function fmtDateLabel(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const [, m, day] = dateStr.split('-');
    return `${parseInt(m, 10)}/${parseInt(day, 10)} (${WEEKDAY_KO[d.getDay()]})`;
  }
  function rangeDates() {
    const dates = [];
    const [fy, fm, fd] = DATE_RANGE.from.split('-').map(Number);
    const [ty, tm, td] = DATE_RANGE.to.split('-').map(Number);
    let cur = Date.UTC(fy, fm - 1, fd);
    const end = Date.UTC(ty, tm - 1, td);
    while (cur <= end) {
      const d = new Date(cur);
      const y = d.getUTCFullYear();
      const m = String(d.getUTCMonth() + 1).padStart(2, '0');
      const day = String(d.getUTCDate()).padStart(2, '0');
      dates.push(`${y}-${m}-${day}`);
      cur += 86400000;
    }
    return dates;
  }

  async function loadConsultStats() {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
    try {
      const res = await fetch(CONSULT_API, { mode: 'cors', signal: controller.signal });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const map = {};
      const userMap = {};
      for (const day of data.dailyStats || []) {
        map[day.date] = day.consultationCount.prepaid.total + day.consultationCount.postpaid.total;
        userMap[day.date] = day.userCount.prepaid.total + day.userCount.postpaid.total;
      }
      CONSULT_DAILY = map;
      CONSULT_USER_DAILY = userMap;
      CONSULT_STATE = 'ok';
    } catch (e) {
      CONSULT_STATE = 'error';
      CONSULT_ERROR_MSG = e.name === 'AbortError' ? '요청 시간 초과' : String(e.message || e);
      console.error('상담 데이터 로드 실패', e);
    } finally {
      clearTimeout(timer);
      document.getElementById('content').innerHTML = renderFirstUserSectionCard();
      updateFooter();
    }
  }

  function consultCell(date) {
    if (CONSULT_STATE === 'loading') return '로딩 중…';
    if (CONSULT_STATE === 'error') return '로드 실패';
    const v = CONSULT_DAILY[date];
    return v == null ? '–' : fmtCount(v);
  }
  function consultUserCell(date) {
    if (CONSULT_STATE === 'loading') return '로딩 중…';
    if (CONSULT_STATE === 'error') return '로드 실패';
    const v = CONSULT_USER_DAILY[date];
    return v == null ? '–' : fmtUsers(v);
  }
  function convRateCell(date) {
    if (CONSULT_STATE !== 'ok') return '–';
    const v = CONSULT_DAILY[date];
    const total = TOTAL_DAILY[date];
    if (v == null || !total) return '–';
    return fmtPercent((v / total) * 100);
  }

  function renderConsultFootnote() {
    const statusText = CONSULT_STATE === 'error'
      ? ` (로드 실패: ${CONSULT_ERROR_MSG} — 페이지를 새로고침하면 재시도됩니다)`
      : '';
    return `<div class="note">ℹ "상담수"는 <a href="${CONSULT_API}" target="_blank" rel="noopener">DB API(consultation-stats)</a>에서
      <b>이 페이지를 열 때마다 실시간으로 가져온</b> 선불+후불 상담 건수 합계입니다 — 위 매체 유입
      표(GA4)와 달리 정적 스냅샷이 아닙니다. "상담인원"은 동일 API의 userCount(선불+후불 단순 합산)로,
      한 사람이 여러 번 상담하면 "상담수"보다 작게 나옵니다(참고용 근사치 — prepaid/postpaid
      userCount를 그대로 더한 값이라 두 결제방식을 모두 쓴 사람은 중복 집계될 수 있습니다).
      "전환율" = 상담수 ÷ "합계"(사이트 전체 활성사용자) × 100으로, 유입 대비 상담 전환 정도를
      보는 참고 지표입니다.${statusText}</div>`;
  }

  // --- 합계 열은 사이트 전체 TOTAL_DAILY/TOTAL_PERIOD를 사용(어느 기준으로 쪼개든 사이트
  // 전체 활성사용자 수 자체는 같기 때문). 상담수/전환율은 CONSULT_DAILY(실시간 fetch)/
  // TOTAL_DAILY 기준으로 계산한다. ---
  function firstUserDailyUsers(g, date) { const v = FIRST_USER_DAILY[g.key][date]; return v ? v[0] : 0; }
  function firstUserTotal(g) { return FIRST_USER_TOTALS[g.key]; }

  function renderFirstUserLegend() {
    return `<div class="legend">${FIRST_USER_GROUPS
      .map((g, i) => `<span><span class="swatch s${i}"></span>${g.label}</span>`)
      .join('')}</div>`;
  }

  function renderFirstUserSummary() {
    const dates = rangeDates();
    const items = FIRST_USER_GROUPS.map((g) => `<div class="stat"><div class="label">${g.label}</div><div class="value">${fmtUsers(firstUserTotal(g))}</div></div>`);
    items.push(`<div class="stat"><div class="label">합계(사이트 전체)</div><div class="value">${fmtUsers(TOTAL_PERIOD)}</div></div>`);
    if (CONSULT_STATE === 'ok') {
      const consultSum = dates.reduce((acc, d) => acc + (CONSULT_DAILY[d] || 0), 0);
      items.push(`<div class="stat"><div class="label">상담수(2주 합계)</div><div class="value">${fmtCount(consultSum)}</div></div>`);
      items.push(`<div class="stat"><div class="label">전환율(2주 합계)</div><div class="value">${fmtPercent((consultSum / TOTAL_PERIOD) * 100)}</div></div>`);
    } else {
      items.push(`<div class="stat"><div class="label">상담수(2주 합계)</div><div class="value">${CONSULT_STATE === 'error' ? '로드 실패' : '로딩 중…'}</div></div>`);
    }
    return `<div class="summary-grid">${items.join('')}</div>`;
  }

  // --- 일자별 데이터 클립보드 복사 (첫 사용자 소스 그룹 표 전용) ---
  function firstUserCopyText(date) {
    const total = TOTAL_DAILY[date];
    const byGroup = {};
    FIRST_USER_GROUPS.forEach((g) => { byGroup[g.key] = firstUserDailyUsers(g, date); });
    const consult = CONSULT_STATE === 'ok' ? CONSULT_DAILY[date] : null;
    const consultUser = CONSULT_STATE === 'ok' ? CONSULT_USER_DAILY[date] : null;
    const rate = (consult != null && total) ? (consult / total) * 100 : null;
    const n = (v) => (v == null ? '–' : numFmt.format(v));
    const pct = (v) => (v == null ? '–' : v.toFixed(1) + '%');
    return [
      `${fmtDateLabel(date)} (${date})`,
      `총 방문자: ${n(total)}`,
      `LG: ${n(byGroup.lg)}`,
      `미확인: ${n(byGroup.notSet)}`,
      `다이렉트: ${n(byGroup.direct)}`,
      `naver: ${n(byGroup.naverGrp)}`,
      `google: ${n(byGroup.googleGrp)}`,
      `기타: ${n(byGroup.etcGrp)}`,
      `-------`,
      `상담수: ${n(consult)}`,
      `상담인원: ${n(consultUser)}`,
      `전환율: ${pct(rate)}`,
    ].join('\n');
  }

  window.copyFirstUserDay = function (date, btn) {
    const text = firstUserCopyText(date);
    const onDone = () => {
      if (!btn) return;
      const orig = btn.textContent;
      btn.textContent = '복사됨';
      btn.disabled = true;
      setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1200);
    };
    const fallbackCopy = () => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        onDone();
      } catch (e) {
        console.error('클립보드 복사 실패', e);
        alert('복사에 실패했습니다.');
      }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onDone).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
  };

  function renderFirstUserTable() {
    const dates = rangeDates();
    const headRow = `<th>일자</th>` + FIRST_USER_GROUPS.map((g, i) => `<th class="col-s${i}">${g.label}</th>`).join('') + `<th>합계</th><th>상담수</th><th>상담인원</th><th>전환율</th>`;
    const bodyRows = [...dates]
      .reverse()
      .map((date) => {
        const cells = FIRST_USER_GROUPS
          .map((g, i) => `<td class="col-s${i}">${fmtUsers(firstUserDailyUsers(g, date))}</td>`)
          .join('');
        const dateCell = `<td class="date-cell"><span>${fmtDateLabel(date)}</span><button type="button" class="copy-btn" onclick="copyFirstUserDay('${date}', this)">복사</button></td>`;
        return `<tr>${dateCell}${cells}<td>${fmtUsers(TOTAL_DAILY[date])}</td><td>${consultCell(date)}</td><td>${consultUserCell(date)}</td><td>${convRateCell(date)}</td></tr>`;
      })
      .join('');
    const footCells = FIRST_USER_GROUPS.map((g, i) => `<td class="col-s${i}">${fmtUsers(firstUserTotal(g))}</td>`).join('');
    let consultFoot = '–';
    let consultUserFoot = '–';
    let convFoot = '–';
    if (CONSULT_STATE === 'ok') {
      const consultSum = dates.reduce((acc, d) => acc + (CONSULT_DAILY[d] || 0), 0);
      const consultUserSum = dates.reduce((acc, d) => acc + (CONSULT_USER_DAILY[d] || 0), 0);
      consultFoot = fmtCount(consultSum);
      consultUserFoot = fmtUsers(consultUserSum);
      convFoot = fmtPercent((consultSum / TOTAL_PERIOD) * 100);
    } else if (CONSULT_STATE === 'error') {
      consultFoot = '로드 실패';
      consultUserFoot = '로드 실패';
    } else {
      consultFoot = '로딩 중…';
      consultUserFoot = '로딩 중…';
    }
    return `<div class="table-scroll"><table>
      <thead><tr>${headRow}</tr></thead>
      <tbody>${bodyRows}</tbody>
      <tfoot><tr><td>합계(${DATE_RANGE.from.slice(5).replace('-', '/')}~${DATE_RANGE.to.slice(5).replace('-', '/')})</td>${footCells}<td>${fmtUsers(TOTAL_PERIOD)}</td><td>${consultFoot}</td><td>${consultUserFoot}</td><td>${convFoot}</td></tr></tfoot>
    </table></div>`;
  }

  function renderFirstUserFootnote() {
    return `<div class="note">ℹ firstUserSource는 사용자당 평생 하나뿐인 값(최초 유입 시점에 고정)이라, 같은 도메인 계열 원본 값을 합산해도 중복 집계가 없습니다. "합계" 열은 소스 구분 없이 사이트 전체를 별도로 재조회한 활성사용자이며, 같은 날 여러 경로로 방문한 사람이 있으면 그룹 합산치보다 작을 수 있습니다.</div>`;
  }

  function renderFirstUserSectionCard() {
    return `
      <div class="card">
        <h2>매체별 유입 (첫 사용자 소스 그룹) <span class="hint">최근 2주 일별 활성사용자 (${DATE_RANGE.from} ~ ${DATE_RANGE.to})</span></h2>
        <div class="path-hint">firstUserSource</div>
        ${renderFirstUserSummary()}
        ${renderFirstUserLegend()}
        ${renderFirstUserTable()}
        ${renderFirstUserFootnote()}
        ${renderConsultFootnote()}
      </div>`;
  }

  function updateFooter() {
    const consultStatusLine = CONSULT_STATE === 'ok'
      ? '상담수/전환율은 페이지 로드 시점에 실시간 fetch됨(DB API).'
      : CONSULT_STATE === 'error'
        ? `상담수/전환율 실시간 fetch 실패(${CONSULT_ERROR_MSG}) — 새로고침 시 재시도.`
        : '상담수/전환율 실시간 fetch 중…';
    document.getElementById('footer').innerHTML =
      `데이터 출처: Supermetrics(GAWA) · GA4 계정 ${ACCOUNT_NAME} (account_id ${ACCOUNT_ID}) · 조회 기간 ${DATE_RANGE.from} ~ ${DATE_RANGE.to}<br>` +
      `매체 유입(활성사용자) 표는 실시간 fetch가 아닌 <b>정적 스냅샷</b>입니다 — GA4는 공개 API 엔드포인트가 없어 조회 시점 값을 임베드했습니다. 갱신하려면 Supermetrics로 재조회 후 리포트를 다시 생성해야 합니다.<br>` +
      `상담수/전환율 열은 예외적으로 <b>${CONSULT_API}</b>를 ${consultStatusLine}<br>` +
      `표에 표시되는 활성사용자는 비집계 지표입니다 — 일별 값은 그날 실측치, 합계 행/열(그룹별·전체)은 항상 해당 범위로 별도 재조회한 순사용자 수이며 일별 값을 단순히 더한 것이 아닙니다.<br>` +
      `생성 시각: ${GENERATED_AT}`;
  }

  function init() {
    document.getElementById('content').innerHTML = renderFirstUserSectionCard();
    updateFooter();
    loadConsultStats();
  }

  init();
})();
</script>
