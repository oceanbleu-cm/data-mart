    { key: 'googleGrp', label: 'google' },
    { key: 'kakaoGrp', label: 'kakao' },
    { key: 'etcGrp', label: '기타' },
  ];

  // --- 최근 7일 서브합계(DATE_RANGE 중 가장 최근 7일) — 표 중간에 삽입되는 "최근 7일 합계/평균" 행 ---
  // activeUsers는 비집계 지표라 TOTAL_DAILY/FIRST_USER_DAILY의 일별 값을 단순 합산하면
  // 재방문자가 중복 집계된다. 그래서 FIRST_USER_TOTALS(14일 전체)와 동일한 원리로, 이 7일
  // 구간만 GA4에 별도로 재조회한 값이다(그룹별은 원본 라벨 분류 후 단순합산 — firstUserSource는
  // 평생 1개 값이라 라벨 분류 자체는 안전하지만, 날짜로 쪼개 합산하면 재방문자 중복이 생기므로
  // 날짜 dimension 없이 재조회). 매일 자동 라우틴이 창이 밀릴 때마다 최근 7일 구간도 같이
  // 재계산해 덮어쓴다.
  const RECENT7_RANGE = { from: '2026-10-17', to: '2026-10-23' };
  const RECENT7_TOTAL = 4818;
  const RECENT7_FIRST_USER_TOTALS = { lg: 883, notSet: 1183, direct: 415, naverGrp: 1715, googleGrp: 89, kakaoGrp: 114, etcGrp: 419 };
</script>
<script>
(function () {
  const ACCOUNT_ID = '488612198';
  const ACCOUNT_NAME = 'unsedang-a3588';
  const GENERATED_AT = '2026-10-24 02:51 UTC (BigQuery GA4 export analytics_488612198 조회, 정적 스냅샷)';
  const DATE_RANGE = { from: '2026-09-26', to: '2026-10-23' };

  const FETCH_TIMEOUT_MS = 10000;
  let CONSULT_DAILY = null; // {date: 상담건(consultationCount.total, 선불+후불 단순 합산)} — fetch 성공 시 채워짐
  let REPEAT_COUNT_DAILY = null; // {date: 재상담(consultationCount.repeatConsultation, 선불+후불 단순 합산)} — fetch 성공 시 채워짐
  let NEW_CONSULT_DAILY = null; // {date: 신규상담(consultationCount.newConsultation, 선불+후불 단순 합산)} — fetch 성공 시 채워짐
  let CONSULT_STATE = 'loading'; // 'loading' | 'ok' | 'error'
  let CONSULT_ERROR_MSG = '';
  function consultApiUrl(baseMonth) {
    return `https://adm.unsedang.com/api/v1/reports/consultation-stats/monthly?baseMonth=${baseMonth}`;
  }
  // DATE_RANGE(28일 창, 내장 데이터 전체)가 월 경계를 넘나들 수 있어(예: 09-14~10-11),
  // 걸쳐 있는 모든 월(baseMonth)을 구해 각각 fetch 후 합친다 — 조회기간 필터가 어떤 구간을
  // 선택하든(7/14/21/28일 또는 커스텀) 전부 DATE_RANGE 안에서 골라 쓰므로, 필터와 무관하게
  // 페이지 로드 시 한 번만 전체 창 기준으로 fetch해두면 된다.
  const CONSULT_MONTHS = [...new Set(rangeDates(DATE_RANGE.from, DATE_RANGE.to).map((d) => d.slice(0, 7)))];

  const numFmt = new Intl.NumberFormat('ko-KR');
  const fmtUsers = (n) => (n == null ? '–' : numFmt.format(n) + '명');
  const fmtCount = (n) => (n == null ? '–' : numFmt.format(n) + '건');
  const fmtPercent = (n) => (n == null ? '–' : n.toFixed(1) + '%');
  const WEEKDAY_KO = ['일', '월', '화', '수', '목', '금', '토'];
  function fmtDateLabel(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const [, m, day] = dateStr.split('-');
    return `${parseInt(m, 10)}/${parseInt(day, 10)} (${WEEKDAY_KO[d.getDay()]})`;
  }
  function toUTC(dateStr) { const [y, m, d] = dateStr.split('-').map(Number); return Date.UTC(y, m - 1, d); }
  function fromUTC(ts) {
    const d = new Date(ts);
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
  }
  function addDays(dateStr, delta) { return fromUTC(toUTC(dateStr) + delta * 86400000); }
  function clamp(dateStr) {
    if (dateStr < DATE_RANGE.from) return DATE_RANGE.from;
    if (dateStr > DATE_RANGE.to) return DATE_RANGE.to;
    return dateStr;
  }
  function rangeDates(from, to) {
    const dates = [];
    let cur = toUTC(from);
    const end = toUTC(to);
    while (cur <= end) {
      dates.push(fromUTC(cur));
      cur += 86400000;
    }
    return dates;
  }

  async function loadConsultStats() {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
    try {
      const results = await Promise.all(CONSULT_MONTHS.map(async (month) => {
        const res = await fetch(consultApiUrl(month), { mode: 'cors', signal: controller.signal });
        if (!res.ok) throw new Error(`${month}: HTTP ${res.status}`);
        return res.json();
      }));
      const map = {};
      const repeatCountMap = {};
      const newConsultMap = {};
      for (const data of results) {
        for (const day of data.dailyStats || []) {
          map[day.date] = day.consultationCount.prepaid.total + day.consultationCount.postpaid.total;
          repeatCountMap[day.date] = day.consultationCount.prepaid.repeatConsultation + day.consultationCount.postpaid.repeatConsultation;
          newConsultMap[day.date] = day.consultationCount.prepaid.newConsultation + day.consultationCount.postpaid.newConsultation;
        }
      }
      CONSULT_DAILY = map;
      REPEAT_COUNT_DAILY = repeatCountMap;
      NEW_CONSULT_DAILY = newConsultMap;
      CONSULT_STATE = 'ok';
    } catch (e) {
      CONSULT_STATE = 'error';
      CONSULT_ERROR_MSG = e.name === 'AbortError' ? '요청 시간 초과' : String(e.message || e);
      console.error('상담 데이터 로드 실패', e);
    } finally {
      clearTimeout(timer);
      document.getElementById('content').innerHTML = renderFirstUserSectionCard(SEL_FROM, SEL_TO);
      updateFooter();
    }
  }

  function consultCell(date) {
    if (CONSULT_STATE === 'loading') return '로딩 중…';
    if (CONSULT_STATE === 'error') return '로드 실패';
    const v = CONSULT_DAILY[date];
    return v == null ? '–' : fmtCount(v);
  }
  function convRateCell(date) {
    if (CONSULT_STATE !== 'ok') return '–';
    const v = CONSULT_DAILY[date];
    const total = TOTAL_DAILY[date];
    if (v == null || !total) return '–';
    return fmtPercent((v / total) * 100);
  }
  function newConsultCell(date) {
    if (CONSULT_STATE === 'loading') return '로딩 중…';
    if (CONSULT_STATE === 'error') return '로드 실패';
    const v = NEW_CONSULT_DAILY[date];
    return v == null ? '–' : fmtCount(v);
  }
  function newConsultRateCell(date) {
    if (CONSULT_STATE !== 'ok') return '–';
    const v = NEW_CONSULT_DAILY[date];
    const total = TOTAL_DAILY[date];
    if (v == null || !total) return '–';
    return fmtPercent((v / total) * 100);
  }
  // "재상담"(consultationCount.repeatConsultation, 선불+후불 단순 합산, 건수 — 동일인이
  // 여러 번 재상담하면 매번 집계)은 운세당 매출 리포트(db-data-unsedang.html)와 동일한
  // 필드를 쓴다. 신규상담 + 재상담 = 상담건.
  function repeatCountCell(date) {
    if (CONSULT_STATE === 'loading') return '로딩 중…';
    if (CONSULT_STATE === 'error') return '로드 실패';
    const v = REPEAT_COUNT_DAILY[date];
    return v == null ? '–' : fmtCount(v);
  }
  function repeatCountConvRateCell(date) {
    if (CONSULT_STATE !== 'ok') return '–';
    const v = REPEAT_COUNT_DAILY[date];
    const total = TOTAL_DAILY[date];
    if (v == null || !total) return '–';
    return fmtPercent((v / total) * 100);
  }

  // --- 합계 열은 사이트 전체 TOTAL_DAILY/TOTAL_PERIOD를 사용(어느 기준으로 쪼개든 사이트
  // 전체 활성사용자 수 자체는 같기 때문). 상담건/상담율은 CONSULT_DAILY(실시간 fetch)/
  // TOTAL_DAILY 기준으로 계산한다. ---
  function firstUserDailyUsers(g, date) {
    const v = FIRST_USER_DAILY[g.key][date];
    const base = v ? v[0] : 0;
    if (g.key !== 'etcGrp') return base;
    const nv = FIRST_USER_DAILY.notSet[date];
    return base + (nv ? nv[0] : 0);
  }
  function firstUserTotal(g) {
    const base = FIRST_USER_TOTALS[g.key];
    return g.key === 'etcGrp' ? base + FIRST_USER_TOTALS.notSet : base;
  }
  function firstUserRecent7(g) {
    const base = RECENT7_FIRST_USER_TOTALS[g.key];
    return g.key === 'etcGrp' ? base + RECENT7_FIRST_USER_TOTALS.notSet : base;
  }

  // --- 선택 기간(from~to)의 합계 — activeUsers는 비집계 지표라, 미리 재조회해둔 두 구간
  // (DATE_RANGE 전체=28일, RECENT7_RANGE=최근 7일)만 정확한 값이고, 그 외 선택(14/21일
  // 칩이나 임의의 커스텀 범위)은 일별 값을 단순 합산한 값이다(재방문자 중복 가능). ---
  const isFullRange = (from, to) => from === DATE_RANGE.from && to === DATE_RANGE.to;
  const isRecent7Range = (from, to) => from === RECENT7_RANGE.from && to === RECENT7_RANGE.to;
  function totalForRange(from, to) {
    if (isFullRange(from, to)) return TOTAL_PERIOD;
    if (isRecent7Range(from, to)) return RECENT7_TOTAL;
    return rangeDates(from, to).reduce((acc, d) => acc + (TOTAL_DAILY[d] || 0), 0);
  }
  function groupTotalForRange(g, from, to) {
    if (isFullRange(from, to)) return firstUserTotal(g);
    if (isRecent7Range(from, to)) return firstUserRecent7(g);
    return rangeDates(from, to).reduce((acc, d) => acc + firstUserDailyUsers(g, d), 0);
  }

  function renderFirstUserLegend() {
    return `<div class="legend">${FIRST_USER_GROUPS
      .map((g, i) => `<span><span class="swatch s${i}"></span>${g.label}</span>`)
      .join('')}</div>`;
  }

  function renderFirstUserSummary(from, to) {
    const dates = rangeDates(from, to);
    const periodLabel = `${dates.length}일 합계`;
    const items = FIRST_USER_GROUPS.map((g) => {
      const v = groupTotalForRange(g, from, to);
      return `<div class="stat"><div class="label">${g.label}</div><div class="value">${fmtUsers(v)}</div></div>`;
    });
    const total = totalForRange(from, to);
    items.push(`<div class="stat"><div class="label">합계(사이트 전체)</div><div class="value">${fmtUsers(total)}</div></div>`);
    if (CONSULT_STATE === 'ok') {
      const consultSum = dates.reduce((acc, d) => acc + (CONSULT_DAILY[d] || 0), 0);
      const newConsultSum = dates.reduce((acc, d) => acc + (NEW_CONSULT_DAILY[d] || 0), 0);
      const repeatCountSum = dates.reduce((acc, d) => acc + (REPEAT_COUNT_DAILY[d] || 0), 0);
      items.push(`<div class="stat"><div class="label">상담건(${periodLabel})</div><div class="value">${fmtCount(consultSum)}</div></div>`);
      items.push(`<div class="stat"><div class="label">상담율(${periodLabel})</div><div class="value">${fmtPercent((consultSum / total) * 100)}</div></div>`);
      items.push(`<div class="stat"><div class="label">신규상담(${periodLabel})</div><div class="value">${fmtCount(newConsultSum)}</div></div>`);
      items.push(`<div class="stat"><div class="label">신규상담율(${periodLabel})</div><div class="value">${fmtPercent((newConsultSum / total) * 100)}</div></div>`);
      items.push(`<div class="stat"><div class="label">재상담(${periodLabel})</div><div class="value">${fmtCount(repeatCountSum)}</div></div>`);
      items.push(`<div class="stat"><div class="label">재상담율(${periodLabel})</div><div class="value">${fmtPercent((repeatCountSum / total) * 100)}</div></div>`);
    } else {
      items.push(`<div class="stat"><div class="label">상담건(${periodLabel})</div><div class="value">${CONSULT_STATE === 'error' ? '로드 실패' : '로딩 중…'}</div></div>`);
    }
    return `<div class="summary-grid">${items.join('')}</div>`;
  }

  // --- 일자별 데이터 클립보드 복사 (첫 사용자 소스 그룹 표 전용) ---
  function firstUserCopyText(date) {
    const total = TOTAL_DAILY[date];
    const byGroup = {};
    FIRST_USER_GROUPS.forEach((g) => { byGroup[g.key] = firstUserDailyUsers(g, date); });
    const consult = CONSULT_STATE === 'ok' ? CONSULT_DAILY[date] : null;
    const newConsult = CONSULT_STATE === 'ok' ? NEW_CONSULT_DAILY[date] : null;
    const repeatCount = CONSULT_STATE === 'ok' ? REPEAT_COUNT_DAILY[date] : null;
    const rate = (consult != null && total) ? (consult / total) * 100 : null;
    const newRate = (newConsult != null && total) ? (newConsult / total) * 100 : null;
    const repeatCountRate = (repeatCount != null && total) ? (repeatCount / total) * 100 : null;
    const n = (v) => (v == null ? '–' : numFmt.format(v));
    const pct = (v) => (v == null ? '–' : v.toFixed(1) + '%');
    return [
      `${fmtDateLabel(date)} (${date})`,
      `총 방문자: ${n(total)}`,
      `LG: ${n(byGroup.lg)}`,
      `다이렉트: ${n(byGroup.direct)}`,
      `naver: ${n(byGroup.naverGrp)}`,
      `google: ${n(byGroup.googleGrp)}`,
      `기타: ${n(byGroup.etcGrp)}`,
      `-------`,
      `상담건: ${n(consult)}`,
      `상담율: ${pct(rate)}`,
      `신규상담: ${n(newConsult)}`,
      `신규상담율: ${pct(newRate)}`,
      `재상담: ${n(repeatCount)}`,
      `재상담율: ${pct(repeatCountRate)}`,
    ].join('\n');
  }

  window.copyFirstUserDay = function (date, btn) {
    const text = firstUserCopyText(date);
    const onDone = () => {
      if (!btn) return;
      const orig = btn.textContent;
      btn.textContent = '복사됨';
      btn.disabled = true;
      setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1200);
    };
    const fallbackCopy = () => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        onDone();
      } catch (e) {
        console.error('클립보드 복사 실패', e);
        alert('복사에 실패했습니다.');
      }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onDone).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
  };

  // 최근 7일 합계/평균 행(표 중간, 최근 7일 일별 행 바로 아래 삽입) — RECENT7_TOTAL/
  // RECENT7_FIRST_USER_TOTALS는 이 7일 구간만 GA4에 별도로 재조회한 정확한 값(비집계
  // 지표라 일별 값 단순 합산이 아님). 상담건/신규상담/재상담은 CONSULT_DAILY류가 건수
  // 지표라 안전하게 합산 가능해 최근 7일 날짜만 골라 그 자리에서 합산한다.
  function recent7SubRows() {
    const last7Dates = rangeDates(RECENT7_RANGE.from, RECENT7_RANGE.to);
    const groupCellsFor = (divisor) =>
      FIRST_USER_GROUPS.map((g, i) => `<td class="col-s${i}">${fmtUsers(Math.round(firstUserRecent7(g) / divisor))}</td>`).join('');

    let consultSumCell = '–';
    let consultAvgCell = '–';
    let convCell = '–';
    let newConsultSumCell = '–';
    let newConsultAvgCell = '–';
    let newConvCell = '–';
    let repeatCountSumCell = '–';
    let repeatCountAvgCell = '–';
    let repeatCountConvCell = '–';
    if (CONSULT_STATE === 'ok') {
      const consultSum = last7Dates.reduce((acc, d) => acc + (CONSULT_DAILY[d] || 0), 0);
      const newConsultSum = last7Dates.reduce((acc, d) => acc + (NEW_CONSULT_DAILY[d] || 0), 0);
      const repeatCountSum = last7Dates.reduce((acc, d) => acc + (REPEAT_COUNT_DAILY[d] || 0), 0);
      consultSumCell = fmtCount(consultSum);
      consultAvgCell = fmtCount(Math.round(consultSum / 7));
      convCell = fmtPercent((consultSum / RECENT7_TOTAL) * 100);
      newConsultSumCell = fmtCount(newConsultSum);
      newConsultAvgCell = fmtCount(Math.round(newConsultSum / 7));
      newConvCell = fmtPercent((newConsultSum / RECENT7_TOTAL) * 100);
      repeatCountSumCell = fmtCount(repeatCountSum);
      repeatCountAvgCell = fmtCount(Math.round(repeatCountSum / 7));
      repeatCountConvCell = fmtPercent((repeatCountSum / RECENT7_TOTAL) * 100);
    } else if (CONSULT_STATE === 'error') {
      consultSumCell = consultAvgCell = newConsultSumCell = newConsultAvgCell = repeatCountSumCell = repeatCountAvgCell = '로드 실패';
    } else {
      consultSumCell = consultAvgCell = newConsultSumCell = newConsultAvgCell = repeatCountSumCell = repeatCountAvgCell = '로딩 중…';
    }

    const sumRow = `<tr class="total-row">
      <td>최근 7일 합계</td>
      ${groupCellsFor(1)}
      <td>${fmtUsers(RECENT7_TOTAL)}</td><td>${consultSumCell}</td><td>${convCell}</td><td>${newConsultSumCell}</td><td>${newConvCell}</td><td>${repeatCountSumCell}</td><td>${repeatCountConvCell}</td>
    </tr>`;
    const avgRow = `<tr class="avg-sub-row">
      <td>최근 7일 평균(1일)</td>
      ${groupCellsFor(7)}
      <td>${fmtUsers(Math.round(RECENT7_TOTAL / 7))}</td><td>${consultAvgCell}</td><td>${convCell}</td><td>${newConsultAvgCell}</td><td>${newConvCell}</td><td>${repeatCountAvgCell}</td><td>${repeatCountConvCell}</td>
    </tr>`;
    return [sumRow, avgRow];
  }

  function renderFirstUserTable(from, to) {
    const dates = rangeDates(from, to);
    const headRow = `<th>일자</th>` + FIRST_USER_GROUPS.map((g, i) => `<th class="col-s${i}">${g.label}</th>`).join('') + `<th>합계</th><th>상담건</th><th>상담율</th><th>신규상담</th><th>신규상담율</th><th>재상담</th><th>재상담율</th>`;
    const dayRows = [...dates]
      .reverse()
      .map((date) => {
        const cells = FIRST_USER_GROUPS
          .map((g, i) => `<td class="col-s${i}">${fmtUsers(firstUserDailyUsers(g, date))}</td>`)
          .join('');
        const dateCell = `<td class="date-cell"><span>${fmtDateLabel(date)}</span><button type="button" class="copy-btn" onclick="copyFirstUserDay('${date}', this)">복사</button></td>`;
        return `<tr>${dateCell}${cells}<td>${fmtUsers(TOTAL_DAILY[date])}</td><td>${consultCell(date)}</td><td>${convRateCell(date)}</td><td>${newConsultCell(date)}</td><td>${newConsultRateCell(date)}</td><td>${repeatCountCell(date)}</td><td>${repeatCountConvRateCell(date)}</td></tr>`;
      });
    // "최근 7일 합계/평균" 서브행은 선택 구간이 전체 창의 최신 끝(DATE_RANGE.to)을 포함하고
    // 7일보다 길 때만 끼워 넣는다 — "최근 7일" 칩처럼 정확히 7일을 고르면 푸터 합계 행과
    // 중복이라 생략하고, 과거 쪽으로 치우친 커스텀 구간(끝이 DATE_RANGE.to가 아님)에는
    // "최근 7일"이라는 개념 자체가 안 맞아 생략한다.
    if (to === DATE_RANGE.to && dayRows.length > 7) dayRows.splice(7, 0, ...recent7SubRows());
    const bodyRows = dayRows.join('');
    const total = totalForRange(from, to);
    const footCells = FIRST_USER_GROUPS.map((g, i) => {
      const v = groupTotalForRange(g, from, to);
      return `<td class="col-s${i}">${fmtUsers(v)}</td>`;
    }).join('');
    let consultFoot = '–';
    let convFoot = '–';
    let newConsultFoot = '–';
    let newConvFoot = '–';
    let repeatCountFoot = '–';
    let repeatCountConvFoot = '–';
    if (CONSULT_STATE === 'ok') {
      const consultSum = dates.reduce((acc, d) => acc + (CONSULT_DAILY[d] || 0), 0);
      const newConsultSum = dates.reduce((acc, d) => acc + (NEW_CONSULT_DAILY[d] || 0), 0);
      const repeatCountSum = dates.reduce((acc, d) => acc + (REPEAT_COUNT_DAILY[d] || 0), 0);
      consultFoot = fmtCount(consultSum);
      convFoot = fmtPercent((consultSum / total) * 100);
      newConsultFoot = fmtCount(newConsultSum);
      newConvFoot = fmtPercent((newConsultSum / total) * 100);
      repeatCountFoot = fmtCount(repeatCountSum);
      repeatCountConvFoot = fmtPercent((repeatCountSum / total) * 100);
    } else if (CONSULT_STATE === 'error') {
      consultFoot = '로드 실패';
      newConsultFoot = '로드 실패';
      repeatCountFoot = '로드 실패';
    } else {
      consultFoot = '로딩 중…';
      newConsultFoot = '로딩 중…';
      repeatCountFoot = '로딩 중…';
    }
    return `<div class="table-scroll"><table>
      <thead><tr>${headRow}</tr></thead>
      <tbody>${bodyRows}</tbody>
      <tfoot><tr><td>합계(${from.slice(5).replace('-', '/')}~${to.slice(5).replace('-', '/')})</td>${footCells}<td>${fmtUsers(total)}</td><td>${consultFoot}</td><td>${convFoot}</td><td>${newConsultFoot}</td><td>${newConvFoot}</td><td>${repeatCountFoot}</td><td>${repeatCountConvFoot}</td></tr></tfoot>
    </table></div>`;
  }

  function renderFirstUserFootnote() {
    return `<div class="note">ℹ firstUserSource는 사용자당 평생 하나뿐인 값(최초 유입 시점에 고정)이라, 같은 도메인 계열 원본 값을 합산해도 중복 집계가 없습니다. "합계" 열은 소스 구분 없이 사이트 전체를 별도로 재조회한 활성사용자이며, 같은 날 여러 경로로 방문한 사람이 있으면 그룹 합산치보다 작을 수 있습니다. "기타"에는 미확인(firstUserSource가 (not set)·빈 값인 활성사용자)이 함께 포함돼 있습니다.</div>`;
  }

  function renderFirstUserSectionCard(from, to) {
    return `
      <div class="card">
        <h2>매체별 유입 (첫 사용자 소스 그룹) <span class="hint">일별 활성사용자 (${from} ~ ${to})</span></h2>
        <div class="path-hint">firstUserSource</div>
        ${renderFirstUserSummary(from, to)}
        ${renderFirstUserLegend()}
        ${renderFirstUserTable(from, to)}
        ${renderFirstUserFootnote()}
      </div>`;
  }

  function updateFooter() {
    const consultStatusLine = CONSULT_STATE === 'ok'
      ? '상담건/상담율/신규상담/신규상담율/재상담/재상담율은 페이지 로드 시점에 실시간 fetch됨(DB API).'
      : CONSULT_STATE === 'error'
        ? `상담건/상담율/신규상담/신규상담율/재상담/재상담율 실시간 fetch 실패(${CONSULT_ERROR_MSG}) — 새로고침 시 재시도.`
        : '상담건/상담율/신규상담/신규상담율/재상담/재상담율 실시간 fetch 중…';
    document.getElementById('footer').innerHTML =
      `데이터 출처: BigQuery GA4 export (unsedang.analytics_488612198) · GA4 계정 ${ACCOUNT_NAME} (account_id ${ACCOUNT_ID}) · 내장 데이터 범위 ${DATE_RANGE.from} ~ ${DATE_RANGE.to}(최근 28일)<br>` +
      `매체 유입(활성사용자) 표는 실시간 fetch가 아닌 <b>정적 스냅샷</b>입니다 — GA4는 공개 API 엔드포인트가 없어 조회 시점 값을 임베드했습니다. 갱신하려면 BigQuery로 재조회 후 리포트를 다시 생성해야 합니다.<br>` +
      `상담건/상담율/신규상담/신규상담율/재상담/재상담율 열은 예외적으로 <b>${CONSULT_MONTHS.map(consultApiUrl).join(', ')}</b>를 ${consultStatusLine}<br>` +
      `표에 표시되는 활성사용자는 비집계 지표입니다 — 일별 값은 그날 실측치입니다.<br>` +
      `조회기간 필터는 이미 내장된 28일 데이터 안에서 다시 집계하는 것이며, 그 순간 GA4에 실시간으로 쿼리하는 것이 아닙니다.<br>` +
      `생성 시각: ${GENERATED_AT}`;
  }

  let SEL_FROM, SEL_TO;

  function render(from, to) {
    SEL_FROM = from;
    SEL_TO = to;
    document.getElementById('content').innerHTML = renderFirstUserSectionCard(from, to);
  }

  function setActivePreset(days) {
    document.querySelectorAll('.preset-btn[data-preset]').forEach((btn) => {
      btn.classList.toggle('active', Number(btn.dataset.preset) === days);
    });
  }

  function applyRange(from, to, presetDays) {
    from = clamp(from);
    to = clamp(to);
    document.getElementById('customFrom').value = from;
    document.getElementById('customTo').value = to;
    setActivePreset(presetDays || null);
    render(from, to);
  }

  function init() {
    document.getElementById('customFrom').min = DATE_RANGE.from;
    document.getElementById('customFrom').max = DATE_RANGE.to;
    document.getElementById('customTo').min = DATE_RANGE.from;
    document.getElementById('customTo').max = DATE_RANGE.to;

    document.querySelectorAll('.preset-btn[data-preset]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const days = Number(btn.dataset.preset);
        const to = DATE_RANGE.to;
        const from = days >= 28 ? DATE_RANGE.from : clamp(addDays(to, -(days - 1)));
        applyRange(from, to, days);
      });
    });
    const onCustomChange = () => {
      const from = document.getElementById('customFrom').value || DATE_RANGE.from;
      const to = document.getElementById('customTo').value || DATE_RANGE.to;
      if (from > to) return;
      applyRange(from, to, null);
    };
    document.getElementById('customFrom').addEventListener('change', onCustomChange);
    document.getElementById('customTo').addEventListener('change', onCustomChange);

    // 기본 선택: 최근 14일
    applyRange(addDays(DATE_RANGE.to, -13), DATE_RANGE.to, 14);
    updateFooter();
    loadConsultStats();
  }

  init();
})();
</script>
